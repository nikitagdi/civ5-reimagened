  <div class="layer" data-layer="map">

    <div data-include="icons.svg"></div>
    <div data-part="hud-root" data-bind-if="{{!ui.windows.economy.open && !ui.windows.military.open && !ui.windows.trade_routes.open}}">
    <div data-bind-if="{{!ui.windows.espionage.open && !ui.windows.victory.open && !ui.windows.demographics.open}}">

    <div data-bind-if="{{!ui.windows.techs.open && !ui.windows.city.open && !ui.windows.policies.open}}">

    <div data-bind-if="{{!ui.windows.city_captured.open && !ui.windows.free_great_person.open}}">
    <div data-bind-if="{{!ui.windows.deal.open || deal == null || deal.partner == null || deal.partner.is_human}}">
      <div data-include="parts/notification_log_panel.html"></div>
      <div data-include="parts/helm.html"></div>
      <div data-include="parts/civ_ribbon.html"></div>
      <div data-include="parts/deal.html"></div>
      <div data-include="parts/minimap_options.html"></div>

    </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>

    <div data-part="windows-root" data-bind-if="{{!ui.windows.economy.open && !ui.windows.military.open && !ui.windows.trade_routes.open}}">
    <div data-bind-if="{{!ui.windows.espionage.open && !ui.windows.victory.open && !ui.windows.demographics.open}}">

    <div data-bind-if="{{!ui.windows.end_game.open}}">
    <div data-bind-if="{{!ui.windows.techs.open && !ui.windows.city.open && !ui.windows.policies.open}}">
    <div data-bind-if="{{!ui.windows.ideology.open && !ui.windows.pantheon.open && !ui.windows.religion.open}}">
    <div data-bind-if="{{!ui.windows.religion_overview.open && !ui.windows.diplo.open && !ui.windows.leader.open}}">
    <div data-bind-if="{{!ui.windows.city_captured.open && !ui.windows.free_great_person.open}}">
    <div data-bind-if="{{!ui.windows.deal.open || deal == null || deal.partner == null || deal.partner.is_human}}">
      <div class="unit-lists-column" data-bind-class-toggle="unit-lists-left-ribbon:{{state.civ_ribbon.left && state.civ_ribbon.visible}}">
        <!-- The info corner is there only while one of its lists is open (the strip's lists button opens it). -->
        <div class="info-corner" data-bind-if="{{state.unit_lists.section != '' || ui.windows.city_list.open}}" data-bind-class-toggle="info-corner-cities:{{ui.windows.city_list.open}}">
        <div data-include="parts/unit_lists.html"></div>
        <div data-include="parts/city_list.html"></div>
        <div data-include="parts/unit_lists_body.html"></div>
        </div>
        <div data-include="parts/unit.html"></div>
      </div>
      <!-- After the corner column: the strip's dropdowns hang over it and must be on top of it. -->
      <div data-include="parts/top.html"></div>
      <div data-include="parts/tech_panel.html"></div>
    </div>
    </div>
    </div>

    </div>
