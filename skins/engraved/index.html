<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Engraved</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/onmap.css">
  <link rel="stylesheet" href="css/production.css">
  <link rel="stylesheet" href="css/research.css">
  <link rel="stylesheet" href="css/techs.css">
  <link rel="stylesheet" href="css/tech_award.css">
  <link rel="stylesheet" href="css/rich_tooltips.css">
  <link rel="stylesheet" href="css/tech_panel.css">
  <link rel="stylesheet" href="css/unit_lists.css">
  <link rel="stylesheet" href="css/minimap.css">
  <link rel="stylesheet" href="css/city.css">
  <link rel="stylesheet" href="css/city_list.css">
  <link rel="stylesheet" href="css/city_rename.css">
  <link rel="stylesheet" href="css/city_captured.css">
  <link rel="stylesheet" href="css/free_great_person.css">
  <link rel="stylesheet" href="css/policies.css">
  <link rel="stylesheet" href="css/ideology.css">
  <link rel="stylesheet" href="css/pantheon.css">
  <link rel="stylesheet" href="css/religion.css">
  <link rel="stylesheet" href="css/religion_overview.css">
  <link rel="stylesheet" href="css/declare_war.css">
  <link rel="stylesheet" href="css/civ_ribbon.css">
  <link rel="stylesheet" href="css/deal.css">
  <link rel="stylesheet" href="css/leader.css">
  <link rel="stylesheet" href="css/diplo.css">
  <link rel="stylesheet" href="css/tips.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/hud_layout.css">
  <link rel="stylesheet" href="dev/mockup.css" data-ui2-dev>
</head>
<body>
  <div class="layer" data-layer="map">
    <div data-include="parts/onmap.html"></div>
  </div>
  <div class="layer" data-layer="hud">
    <div data-include="icons.svg"></div>
    <div data-bind-if="{{!ui.windows.techs.open && !ui.windows.city.open && !ui.windows.policies.open}}">
    <div data-bind-if="{{!ui.windows.ideology.open && !ui.windows.pantheon.open && !ui.windows.religion.open}}">
    <div data-bind-if="{{!ui.windows.religion_overview.open && !ui.windows.diplo.open && !ui.windows.leader.open}}">
    <div data-bind-if="{{!ui.windows.city_captured.open && !ui.windows.free_great_person.open}}">
    <div data-bind-if="{{!ui.windows.deal.open || deal == null || deal.partner == null || deal.partner.is_human}}">
      <div data-include="parts/top.html"></div>
      <div data-include="parts/notes.html"></div>
      <div data-include="parts/chat.html"></div>
      <div data-include="parts/helm.html"></div>
      <div data-include="parts/civ_ribbon.html"></div>
      <div data-include="parts/deal.html"></div>
      <div data-include="parts/minimap_options.html"></div>
      <div class="mods" data-part="mods" data-slot="mods"></div>
    </div>
    </div>
    </div>
    </div>
    </div>
  </div>
  <div class="layer" data-layer="window">
    <div data-bind-if="{{!ui.windows.techs.open && !ui.windows.city.open && !ui.windows.policies.open}}">
    <div data-bind-if="{{!ui.windows.ideology.open && !ui.windows.pantheon.open && !ui.windows.religion.open}}">
    <div data-bind-if="{{!ui.windows.religion_overview.open && !ui.windows.diplo.open && !ui.windows.leader.open}}">
    <div data-bind-if="{{!ui.windows.city_captured.open && !ui.windows.free_great_person.open}}">
    <div data-bind-if="{{!ui.windows.deal.open || deal == null || deal.partner == null || deal.partner.is_human}}">
      <div class="unit-lists-column" data-bind-class-toggle="unit-lists-left-ribbon:{{state.civ_ribbon.left && state.civ_ribbon.visible}}">
        <div data-include="parts/unit_lists.html"></div>
        <div class="unit-lists-research" data-bind-if="{{!ui.windows.city_list.open}}"><div data-include="parts/tech_panel.html"></div></div>
        <div data-include="parts/city_list.html"></div>
        <div data-include="parts/unit.html"></div>
      </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    <div data-include="parts/unit_rename.html"></div>
    <div data-include="parts/diplo.html"></div>
    <div data-include="parts/deal_ai.html"></div>
    <div data-include="parts/leader.html"></div>
    <div data-include="parts/research.html"></div>
    <div data-include="parts/techs.html"></div>
    <div data-include="parts/tech_award.html"></div>
    <div data-include="parts/city.html"></div>
    <!-- after the city screen: it opens from there and must stay above it -->
    <div data-include="parts/production.html"></div>
    <div data-include="parts/city_rename.html"></div>
    <div data-include="parts/city_captured.html"></div>
    <div data-include="parts/free_great_person.html"></div>
    <div data-include="parts/policies.html"></div>
    <div data-include="parts/ideology.html"></div>
    <div data-include="parts/pantheon.html"></div>
    <div data-include="parts/religion.html"></div>
    <div data-include="parts/religion_overview.html"></div>
    <div data-include="parts/declare_war.html"></div>
  </div>
  <div class="layer" data-layer="tooltip">
    <div data-include="parts/tips.html"></div>
    <div data-include="parts/top_panel_tips.html"></div>
    <div data-include="parts/on_map_tips.html"></div>
    <div data-include="parts/techs_tip.html"></div>
    <div data-include="parts/tech_award_tip.html"></div>
    <div data-include="parts/rich_tooltips.html"></div>
    <div data-include="parts/city_tips.html"></div>
    <div data-include="parts/screen_tips.html"></div>
    <div data-include="parts/diplo_tips.html"></div>
  </div>
</body>
</html>
