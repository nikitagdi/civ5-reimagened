# Engraved: the first skin. Source of the package; see docs for the layout.

[skin]
id = "engraved"
version = "0.1.0"
title = "skin.title"
entry = "index.html"
model = "1.3"
api = "1.0"
default = true

[fonts]
subset = ["latin", "latin-ext", "cyrillic"]
sans = "Fira Sans"
display = "Alegreya"

# The name a stylesheet uses for a font file, and the file it stands for.
[fonts.files]
"fonts/FiraSans-Regular.ttf" = "third_party/fonts/fira-sans/FiraSans-Regular.ttf"
"fonts/FiraSans-Medium.ttf" = "third_party/fonts/fira-sans/FiraSans-Medium.ttf"
"fonts/Alegreya.ttf" = "third_party/fonts/alegreya/Alegreya[wght].ttf"

# Skin state (state.*): how the production window sorts its options and whether it hides the locked ones; the chat
# line being written and whether the choice of its addressee is open; whether the folded screen buttons of a narrow
# top strip are open.
[state]
unit_panel = { hover = -1, draft = "", valid = false }
unit_lists = { section = "", sort = "name", desc = false, military_folded = false, civilian_folded = false }
on_map = { unit = "", city = "" }
minimap = { options = false, streamer = false, banners = true, flags = true, grid = false, routes = true, yields = false, resources = false }
leader = { hover = "" }
deal = { side = 0, kind = -1, item = 0, amount = 0 }
civ_ribbon = { visible = true, left = false, hover = -1 }
declare_war = { diplomacy = false, protectors = false, allies = false, deals = false, routes = false }
diplo = { tab = "relations", deal = -1, hover = -1 }
policies = { visible = false, tab = "", expanded = false, confirm = -1, kind = "adopt_policy", name = "", tenet_level = 0, hover = -1 }
ideology = { confirm = -1, details = -1, folded = 0, name = "" }
pantheon = { confirm = -1, name = "", effect = "" }
religion = { symbol = -1, symbol_name = "", name = "", rename = false, list = "", confirm = false, ready = false, hover = -1, pick = { pantheon = 65535, founder = 65535, follower = 65535, follower2 = 65535, enhancer = 65535, bonus = 65535 }, label = { pantheon = "", founder = "", follower = "", follower2 = "", enhancer = "", bonus = "" } }
religion_overview = { tab = "mine", world_sort = "name", world_desc = false, beliefs_sort = "religion_name", beliefs_desc = false, menu = false, optimistic = "" }
free_gp = { selected = -1 }
city_rename = { draft = "", valid = false, touched = false, why = "" }
city_list = { sort = "population", desc = true }
city = { hover_yield = "", tiles_open = false, hover_kind = "", buy_tiles = false, sell = -1, hover = -1, queue_mode = 0, repeat_order = false }
tech_award = { hover = "" }
tech_panel = { open = false, last_id = -1, last_name = "", done = false }
techs = { hover = -1, unlock = -1, x = 0.0 }
demographics = { hover = "population" }
victory = { view = "summary", hover = "irr" }
espionage = { agents_sort = "name", agents_sort_desc = false, own_sort = "name", own_sort_desc = false, other_sort = "civilization", other_sort_desc = false, intrigue_sort = "turn", intrigue_sort_desc = true, tab = "overview", moving = -1, hover_agent = -1, hover_city = -1, selected = -1, ask = -1, confirm = "" }
trade_routes = { tab = "", sort = "from", sort_desc = false, choose_sort = "city", collapse_yours = false, collapse_majors = false, collapse_city_states = false, confirm = -1, hover = -1, overview = false }
military = { sort = "name", sort_desc = false }
economy = { tab = "", sort = "population", sort_desc = false, hover = "", happy_open = "", open_income_cities = false, open_income_diplomacy = false, open_income_religion = false, open_income_connections = false, open_expense_units = false, open_expense_buildings = false, open_expense_improvements = false, open_expense_diplomacy = false }
mp_vote = { pending = false }
congress = { picker = "none", choice = "", slot = 0, confirm = "none", rename = false, rename_text = "", tip = "" }
cs = { menu = "main", confirm = "none", tip = "" }
archaeology = { confirm = 0 }
culture = { tab = "yours", click_mode = "move", pick = -1, slot_type = "", sort_cities = "id", pair_partner = -1, pair_work = -1, own_work = -1, pair_label = "", reason = "Pick a work from another civilization.", source = -1, offer = -1, tip = "", x = 0, y = 0 }
prod = { sort = "order", hide_locked = false }
chat = { draft = "", pick = false }
top = { menu = false, hover = "", resource = -1, resources = false }

confirm = { dont_warn = false, hover = -1 }
goody = { sel = -1 }
notification = { hover = "" }
menu = { options = false, panel = "details" }
end_game = { tab = "summary" }
advisor = { economic = 0, military = 0, foreign = 0, science = 0 }
opt = { tab = "general", auto_end_turn = false, auto_end_turn_sp = false, next_unit_after_orders = true, auto_unit_cycle = true, air_rebase_rmb = true, civilian_yields = true, workers_keep_improvements = true, workers_keep_features = true, no_tile_recs = false, skip_reward_popups = false, policy_info_full = true, score_list = true, civ_ribbon = true, city_ribbon = true, unit_ribbon = true, city_advisor_recs = true, auto_close_city = false, auto_close_tech = false, clock = false, all_great_people = false, warn_unassigned = true, no_basic_help = false, scroll_inertia = true, zoom_dynamic = true, music = 70, effects = 80, ambience = 70, speech = 80, tooltip_delay = 500, tooltip_delay_ext = 1500, ui_scale = 100, ribbon_side = "right" }


