# Engraved: the first skin. Source of the package; see docs for the layout.

[skin]
id = "engraved"
version = "0.1.0"
title = "skin.title"
entry = "index.html"
model = "1.1"
api = "1.0"
default = true

[fonts]
subset = ["latin", "latin-ext", "cyrillic"]
sans = "Fira Sans"
display = "Alegreya"

# The name a stylesheet uses for a font file, and the file it stands for.
[fonts.files]
"fonts/FiraSans-Regular.ttf" = "third_party/fonts/fira-sans/FiraSans-Regular.ttf"
"fonts/FiraSans-Medium.ttf" = "third_party/fonts/fira-sans/FiraSans-Medium.ttf"
"fonts/Alegreya.ttf" = "third_party/fonts/alegreya/Alegreya[wght].ttf"

# Skin state (state.*): how the production window sorts its options and whether it hides the locked ones; the chat
# line being written and whether the choice of its addressee is open; whether the folded screen buttons of a narrow
# top strip are open.
[state]
demographics = { hover = "population" }
victory = { view = "summary", hover = "irr" }
espionage = { agents_sort = "name", agents_sort_desc = false, own_sort = "name", own_sort_desc = false, other_sort = "civilization", other_sort_desc = false, intrigue_sort = "turn", intrigue_sort_desc = true, tab = "overview", moving = -1, hover_agent = -1, hover_city = -1, selected = -1, ask = -1, confirm = "" }
trade_routes = { tab = "", sort = "from", sort_desc = false, choose_sort = "city", collapse_yours = false, collapse_majors = false, collapse_city_states = false, confirm = -1, hover = -1, overview = false }
military = { sort = "name", sort_desc = false }
economy = { tab = "", sort = "population", sort_desc = false, hover = "", happy_open = "", open_income_cities = false, open_income_diplomacy = false, open_income_religion = false, open_income_connections = false, open_expense_units = false, open_expense_buildings = false, open_expense_improvements = false, open_expense_diplomacy = false }
prod = { sort = "order", hide_locked = false }
chat = { draft = "", pick = false }
top = { menu = false }

# The production window's script: arrow keys move the focus; the sort is kept in the settings.
[scripts]
files = ["js/production.js", "js/economy.js", "js/military.js", "js/trade_routes.js", "js/espionage.js", "js/victory.js", "js/demographics.js"]
reads = ["production", "ui"]

[verify]
states = ["hud", "hud-timer", "hud-chat", "production", "production-sorted", "research", "techs", "economy", "military", "trade_routes", "espionage", "victory", "demographics", "demographics-whos-winning", "economy-happiness", "trade_routes-choose", "trade_routes-home", "trade_routes-port"]
golden = [{ state = "hud", viewport = [1920, 1080], scale = 1.0 }]
