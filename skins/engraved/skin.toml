# Engraved: the first skin. Source of the package; see docs for the layout.

[skin]
id = "engraved"
version = "0.1.0"
title = "skin.title"
entry = "index.html"
model = "1.1"
api = "1.0"
default = true

[fonts]
subset = ["latin", "latin-ext", "cyrillic"]
sans = "Fira Sans"
display = "Alegreya"

# The name a stylesheet uses for a font file, and the file it stands for.
[fonts.files]
"fonts/FiraSans-Regular.ttf" = "third_party/fonts/fira-sans/FiraSans-Regular.ttf"
"fonts/FiraSans-Medium.ttf" = "third_party/fonts/fira-sans/FiraSans-Medium.ttf"
"fonts/Alegreya.ttf" = "third_party/fonts/alegreya/Alegreya[wght].ttf"

# Skin state (state.*): how the production window sorts its options and whether it hides the locked ones; the chat
# line being written and whether the choice of its addressee is open; whether the folded screen buttons of a narrow
# top strip are open.
[state]
prod = { sort = "order", hide_locked = false }
chat = { draft = "", pick = false }
top = { menu = false }
confirm = { dont_warn = false, hover = -1 }
goody = { sel = -1 }
notification = { hover = "" }
menu = { options = false, panel = "details" }
end_game = { tab = "summary" }
advisor = { economic = 0, military = 0, foreign = 0, science = 0 }
opt = { tab = "general", auto_end_turn = false, auto_end_turn_sp = false, next_unit_after_orders = true, auto_unit_cycle = true, air_rebase_rmb = true, civilian_yields = true, workers_keep_improvements = true, workers_keep_features = true, no_tile_recs = false, skip_reward_popups = false, policy_info_full = true, score_list = true, civ_ribbon = true, city_ribbon = true, unit_ribbon = true, city_advisor_recs = true, auto_close_city = false, auto_close_tech = false, clock = false, all_great_people = false, warn_unassigned = true, no_basic_help = false, scroll_inertia = true, zoom_dynamic = true, music = 70, effects = 80, ambience = 70, speech = 80, tooltip_delay = 500, tooltip_delay_ext = 1500, ui_scale = 100, ribbon_side = "right" }

# The production window's script: arrow keys move the focus; the sort is kept in the settings.
[scripts]
files = ["js/end_game.js", "js/advisor.js", "js/game_menu.js", "js/production.js", "js/confirm.js", "js/message.js", "js/goody_choice.js"]
reads = ["end_game", "advisor", "game_menu", "production", "confirm", "message", "goody_choice", "notification_log", "game_menu", "end_game", "advisor"]

[verify]
states = ["hud", "hud-timer", "hud-chat", "production", "production-sorted", "research", "techs", "confirm", "message", "goody_choice", "notification_log", "game_menu", "end_game", "advisor"]
golden = [{ state = "hud", viewport = [1920, 1080], scale = 1.0 }]
