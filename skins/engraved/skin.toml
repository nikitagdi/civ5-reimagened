# Engraved: the first skin. Source of the package; see docs for the layout.

[skin]
id = "engraved"
version = "0.1.0"
title = "skin.title"
entry = "index.html"
model = "1.2"
api = "1.0"
default = true

[fonts]
subset = ["latin", "latin-ext", "cyrillic"]
sans = "Fira Sans"
display = "Alegreya"

# The name a stylesheet uses for a font file, and the file it stands for.
[fonts.files]
"fonts/FiraSans-Regular.ttf" = "third_party/fonts/fira-sans/FiraSans-Regular.ttf"
"fonts/FiraSans-Medium.ttf" = "third_party/fonts/fira-sans/FiraSans-Medium.ttf"
"fonts/Alegreya.ttf" = "third_party/fonts/alegreya/Alegreya[wght].ttf"

# Skin state (state.*): how the production window sorts its options and whether it hides the locked ones; the chat
# line being written and whether the choice of its addressee is open; whether the folded screen buttons of a narrow
# top strip are open.
[state]
policies = { tab = "", expanded = false, confirm = -1, kind = "adopt_policy", name = "", tenet_level = 0, hover = -1 }
ideology = { confirm = -1, details = -1, folded = 0, name = "" }
pantheon = { confirm = -1, name = "", effect = "" }
religion = { symbol = -1, symbol_name = "", name = "", rename = false, list = "", confirm = false, ready = false, hover = -1, pick = { pantheon = 65535, founder = 65535, follower = 65535, follower2 = 65535, enhancer = 65535, bonus = 65535 }, label = { pantheon = "", founder = "", follower = "", follower2 = "", enhancer = "", bonus = "" } }
religion_overview = { tab = "mine", world_sort = "name", world_desc = false, beliefs_sort = "religion_name", beliefs_desc = false, menu = false, optimistic = "" }
free_gp = { selected = -1 }
city_rename = { draft = "", valid = false, touched = false, why = "" }
city_list = { sort = "population", desc = true }
city = { hover_yield = "", tiles_open = false, hover_kind = "", buy_tiles = false, sell = -1, hover = -1, queue_mode = 0, repeat_order = false }
tech_award = { hover = "" }
tech_panel = { open = false, last_id = -1, last_name = "", done = false }
techs = { hover = -1, x = 0.0 }
prod = { sort = "order", hide_locked = false }
chat = { draft = "", pick = false }
top = { menu = false }

# The production window's script: arrow keys move the focus; the sort is kept in the settings.
[scripts]
files = ["js/production.js", "js/tech_panel.js", "js/techs.js", "js/city_rename.js", "js/city.js", "js/city_list.js", "js/free_great_person.js", "js/policies.js", "js/ideology.js", "js/pantheon.js", "js/religion.js", "js/religion_overview.js"]
reads = ["production", "research", "hud", "ui.windows.techs", "techs", "city", "city_rename", "city_captured", "free_great_person", "policies", "ideology", "pantheon", "religion", "religion_overview", "ui"]

[verify]
states = ["hud", "hud-timer", "hud-chat", "production", "production-sorted", "research", "techs", "techs--free", "techs--steal", "tech_award", "rich_tooltips", "tech_panel", "tech_panel--done", "city", "city_list", "city_rename", "city_captured", "free_great_person", "city--puppet", "city--sell", "city_rename--invalid", "city_rename--raze", "city_rename--unraze", "city_rename--annex", "city_captured--annex", "free_great_person--faith", "free_great_person--maya", "policies", "ideology", "pantheon", "religion", "religion_overview"]
golden = [{ state = "hud", viewport = [1920, 1080], scale = 1.0 }]
