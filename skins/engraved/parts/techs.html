<div class="wlayer full tt-layer" data-part="techs" data-screen="techs" data-esc="call techs.escape()" data-bind-if="{{ui.windows.techs.open}}">
  <section class="win tt">
    <header class="hd">
      <div class="ttl"><b data-l10n="techs.title">Technologies</b></div>
      <div class="facts" data-bind-if="{{techs != null}}">
        <span><b class="tt-sci" data-bind-value="{{techs.science_rate}}"></b><span data-l10n="techs.science">science per turn</span></span>
        <span data-l10n="policies.count" data-l10n-args="{{techs.researched_count}}, {{techs.total_count}}"></span>
      </div>
      <div class="tt-now" data-bind-if="{{techs != null && techs.current != null}}">
        <b class="ell" data-bind-value="{{techs.current.name}}"></b>
        <div class="scale"><div class="fill tt-fc" data-bind-style-width="{{techs.current.forecast_fraction * 100}}%"></div><div class="fill" data-bind-style-width="{{techs.current.fraction * 100}}%"></div><div class="ticks" data-bind-if="{{techs.current.turn_fraction > 0}}" data-bind-style-background-size="{{techs.current.turn_fraction * 100}}% 100%"></div></div>
      </div>
      <div class="tt-q" data-bind-if="{{techs != null}}"><span class="qchip" data-bind-for="q:{{techs.queue}}" data-bind-filter="{{q.pos > 1}}"><span class="n" data-bind-value="{{q.pos - 1}}"></span><span class="ell" data-bind-value="{{q.name}}"></span></span></div>
      <div class="close"><span class="key" data-l10n="key.escape">Esc</span><button class="x" data-part="techs.close" data-on-click="intent window.close(window: 'techs')"><svg class="i"><use href="#i-close"/></svg></button></div>
    </header>
    <div class="tt-mode" data-bind-if="{{techs != null && techs.mode == 'free'}}"><b data-bind-value="{{techs.free_reason}}"></b><b class="cnt" data-bind-value="{{techs.free_count}}"></b></div>
    <div class="tt-mode" data-bind-if="{{techs != null && techs.steal != null}}"><b data-l10n="techs.steal">Steal technology</b><img class="gi s24 round" data-bind-src="{{techs.steal.icon}}" data-bind-style-background-color="{{techs.steal.color}}"><span class="sub" data-bind-value="{{techs.steal.civ}}"></span><span class="sub" data-bind-value="{{techs.steal.spy_city}}"></span></div>
    <div class="empty" data-bind-if="{{techs == null}}" data-l10n="techs.loading">Loading technologies</div>
    <div class="tt-scroll" data-bind-scroll-x="state.techs.x" data-on-wheel="set state.techs.x = max(0, state.techs.x + event.dx + event.dy)" data-part="techs.list" data-bind-if="{{techs != null}}">
      <div class="tt-canvas" data-bind-style-width="{{techs.grid.cols * 316 + 48}}px" data-bind-style-height="{{techs.grid.rows * 96 + 72}}px">
        <div class="era" data-bind-for="e:{{techs.eras}}" data-bind-style-left="{{e.first_col * 316}}px" data-bind-style-width="{{e.cols * 316}}px" data-bind-class-toggle="cur:{{e.state == 'current'}}"><span data-bind-value="{{e.name}}"></span><small data-l10n="policies.count" data-l10n-args="{{e.researched}}, {{e.total}}"></small></div>
        <div class="tt-link" data-bind-for="l:{{techs.links}}" data-bind-class-toggle="or:{{l.kind == 'or'}}; queued:{{l.queued}}" data-bind-sort="{{l.queued ? 1 : 0}}">
          <div class="ln h" data-bind-style-left="{{l.from_col * 316 + 288}}px" data-bind-style-top="{{l.from_row * 96 + 91}}px" data-bind-style-width="{{(l.to_col - l.from_col) * 158 - 130}}px"></div>
          <div class="ln v" data-bind-style-left="{{(l.from_col + l.to_col) * 158 + 156}}px" data-bind-style-top="{{min(l.from_row, l.to_row) * 96 + 91}}px" data-bind-style-height="{{abs(l.to_row - l.from_row) * 96 + 2}}px"></div>
          <div class="ln h" data-bind-style-left="{{(l.from_col + l.to_col) * 158 + 156}}px" data-bind-style-top="{{l.to_row * 96 + 91}}px" data-bind-style-width="{{(l.to_col - l.from_col) * 158 - 132}}px"></div>
        </div>
        <div data-bind-if="{{techs.mode != 'steal'}}">
        <button class="tc" data-part="techs.row" data-bind-for="t:{{techs.techs}}" data-bind-style-left="{{t.col * 316 + 24}}px" data-bind-style-top="{{t.row * 96 + 52}}px"
          data-bind-class-toggle="cur:{{t.state == 'current'}}; res:{{t.state == 'researched'}}; free:{{t.state == 'free'}}; na:{{t.state == 'unavailable' || t.state == 'locked'}}"
          data-bind-disabled="{{!t.clickable || len(ui.pending) > 0}}" data-tooltip="techs-tip" data-on-pointerenter="set state.techs.hover = t.id; set ui.tip.kind = 0; set ui.tip.slot = null; set ui.tip.id = t.id"
          data-on-pointerleave="set ui.tip.id = null" data-on-click="call techs.track(t.id, event.shift ? 1 : 0); intent screen.act(screen: 'techs', action: 'research', a: t.id, b: event.shift ? 1 : 0)"
          data-on-contextmenu="call techs.track(t.id, 1); intent screen.act(screen: 'techs', action: 'research', a: t.id, b: 1)" >
          <span class="hv"></span><img class="gi s64 round por" data-bind-src="{{t.icon}}"><span class="bd"><span class="l1"><span class="nm ell" data-part="techs.name" data-bind-value="{{t.name}}"></span><span class="tn" data-bind-if="{{t.turns != null}}" data-bind-value="{{t.turns}}"></span></span><span class="st" data-part="techs.status" ><span data-bind-if="{{t.status == 'locked'}}" data-l10n="techs.status.locked">Locked</span><span data-bind-if="{{t.status == 'available'}}" data-l10n="techs.status.available">Available</span><span data-bind-if="{{t.status == 'researched'}}" data-l10n="techs.status.researched">Researched</span><span data-bind-if="{{t.status == 'current'}}" data-l10n="techs.status.current">Researching</span><span data-bind-if="{{t.status == 'queued'}}" data-l10n="techs.status.queued">Queued</span></span><span class="un"><img class="gi s32 round" data-part="techs.unlock" data-bind-for="u:{{t.unlocks}}" data-bind-filter="{{u.idx < 5}}" data-bind-src="{{u.icon}}" data-tooltip="techs-unlock-tip" data-on-pointerenter="set ui.tip.kind = 12; set ui.tip.slot = u.idx; set ui.tip.id = t.id" data-on-pointerleave="set ui.tip.kind = 0; set ui.tip.slot = null"></span></span><span class="scale pg"><span class="fill tt-fc" data-bind-style-width="{{t.forecast_fraction * 100}}%"></span><span class="fill" data-bind-style-width="{{t.fraction * 100}}%"></span><span class="ticks" data-bind-if="{{techs.science_rate > 0}}" data-bind-style-background-size="{{min(1, techs.science_rate / max(1,t.cost)) * 100}}% 100%"></span></span><span class="qb" data-bind-if="{{t.queue_pos != null && t.queue_pos > 1}}" data-bind-value="{{t.queue_pos - 1}}"></span>
        </button>
        </div>
        <div data-bind-if="{{techs.mode == 'steal'}}">
        <button class="tc free" data-bind-for="t:{{techs.techs}}" data-bind-style-left="{{t.col * 316 + 24}}px" data-bind-style-top="{{t.row * 96 + 52}}px" data-bind-disabled="{{!t.clickable || len(ui.pending) > 0}}" data-on-click="call techs.track(t.id, 0); intent screen.act(screen: 'techs', action: 'steal', a: t.id, b: techs.steal.player)" data-tooltip="techs-tip" data-on-pointerenter="set state.techs.hover = t.id"><span class="hv"></span><img class="gi s64 round por" data-bind-src="{{t.icon}}"><span class="bd"><span class="l1"><span class="nm ell" data-bind-value="{{t.name}}"></span><span class="tn" data-bind-value="{{t.steal_science}}"></span></span></span></button>
        </div>
      </div>
    </div>
    <footer class="wft tt-ft"><div class="legend"><span class="li na" data-l10n="techs.unavailable">Not yet available</span><span class="li" data-l10n="techs.available">Available</span><span class="li cur" data-l10n="techs.researching">Researching</span><span class="li res" data-l10n="techs.researched">Researched</span></div><span class="note" data-l10n="techs.hint">Click to research. Right click to add to queue. Scroll to explore the tree.</span></footer>
  </section>
</div>
