<div class="techs-screen" data-part="techs" data-screen="techs" data-bind-if="{{ui.windows.techs.open}}">
  <section class="techs-window">
    <div class="techs-head">
      <span data-l10n="techs.title">Technologies</span>
      <button data-part="techs.close" data-on-click="intent window.close(window: 'techs')" data-l10n="techs.close">Close</button>
    </div>
    <div data-bind-if="{{techs == null}}" data-l10n="techs.loading">Loading technologies</div>
    <div class="techs-grid" data-part="techs.list" data-bind-if="{{techs != null}}">
      <button class="techs-row" data-part="techs.row" data-bind-for="t:{{techs.techs}}"
        data-bind-disabled="{{t.status == 'researched'}}"
        data-on-click="intent screen.act(screen: 'techs', action: 'research', a: t.id, b: 0)"
        data-on-contextmenu="intent screen.act(screen: 'techs', action: 'research', a: t.id, b: 1)">
        <span class="techs-era" data-bind-value="{{t.era_name}}"></span>
        <span class="techs-name" data-part="techs.name" data-bind-value="{{t.name}}"></span>
        <span data-part="techs.status" data-bind-value="{{t.status}}"></span>
        <div class="techs-cost"><span data-bind-value="{{t.progress}}"></span><span> / </span><span data-bind-value="{{t.cost}}"></span></div>
        <span data-bind-if="{{t.turns != null}}" data-bind-value="{{t.turns}}"></span>
      </button>
    </div>
    <div data-l10n="techs.hint">Click to research. Right click to append to the queue.</div>
  </section>
</div>
