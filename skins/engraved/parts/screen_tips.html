<template data-layer="tooltip" id="policies-tip"><div class="policies-tip" data-bind-if="{{policies != null}}"><div data-bind-for="b:{{policies.branches}}"><div data-bind-for="p:{{b.policies}}" data-bind-filter="{{p.id == state.policies.hover}}"><b data-bind-value="{{p.name}}"></b><p data-bind-value="{{p.effect}}"></p><p data-bind-if="{{p.reason != null}}" data-bind-value="{{p.reason}}"></p></div></div></div></template>
<template data-layer="tooltip" id="religion-symbol-tip"><div class="religion-tip" data-bind-if="{{religion != null}}"><div data-bind-for="s:{{religion.symbols}}" data-bind-filter="{{s.id == state.religion.hover}}"><b data-bind-value="{{s.name}}"></b><p data-bind-value="{{s.tooltip}}"></p><span data-bind-if="{{s.founder != null}}" data-bind-value="{{s.founder}}"></span></div></div></template>
<template data-layer="tooltip" id="religion-overview-prophet-tip"><div class="religion_overview-tip" data-bind-if="{{religion_overview != null}}" data-bind-value="{{religion_overview.faith.prophet_tooltip}}"></div></template>

<template data-layer="tooltip" id="city-yield-tip">
  <div class="city-tip" data-bind-if="{{city != null}}">
    <div data-bind-for="y:{{city.yields}}" data-bind-filter="{{y.key == state.city.hover_yield}}">
      <div class="city-tip-row" data-bind-for="b:{{y.breakdown}}"><span data-bind-value="{{b.label}}"></span><b data-bind-value="{{fmt.signed(b.value)}}"></b></div>
    </div>
  </div>
</template>
<template data-layer="tooltip" id="city-tile-tip">
  <div class="city-tip" data-bind-if="{{city != null}}">
    <div data-bind-for="t:{{city.tiles}}" data-bind-filter="{{t.index == state.city.hover}}">
      <span data-l10n="city.tiles">City tiles</span>
      <span data-bind-if="{{t.other_city != null}}" data-bind-value="{{t.other_city}}"></span>
      <span data-bind-if="{{t.buy_reason != null}}" data-bind-value="{{t.buy_reason}}"></span>
      <span data-bind-if="{{t.border_next}}" data-l10n="city.next_border">Next border tile</span>
    </div>
  </div>
</template>
<template data-layer="tooltip" id="city-gp-tip">
  <div class="city-tip" data-bind-if="{{city != null}}">
    <div data-bind-for="p:{{city.great_people}}" data-bind-filter="{{p.key == state.city.hover_yield}}">
      <b data-bind-value="{{p.name}}"></b>
      <div class="city-tip-row" data-bind-if="{{p.rate != null}}"><span data-l10n="top.turns" data-l10n-args="{{p.turns}}"></span><b data-bind-value="{{fmt.signed(p.rate)}}"></b></div>
      <div class="city-tip-row" data-bind-for="m:{{p.modifiers}}"><span data-bind-value="{{m.label}}"></span></div>
    </div>
  </div>
</template>

<!-- Navigation captions include their bound shortcuts. -->
<template data-layer="tooltip" id="nav-fold-tip"><div class="tip"><div class="th hd"><span data-l10n="nav.fold">More windows and the game menu</span><span class="key" data-l10n="keycap.alt_w">Alt+W</span></div></div></template>

<template id="corner-units-tip" data-layer="tooltip"><div class="tip" data-l10n="unit_lists.units"></div></template>
<template id="corner-resources-tip" data-layer="tooltip"><div class="tip" data-l10n="unit_lists.resources"></div></template>
<template id="corner-gp-tip" data-layer="tooltip"><div class="tip" data-l10n="unit_lists.gp"></div></template>
<template id="corner-close-tip" data-layer="tooltip"><div class="tip" data-l10n="unit_lists.close"></div></template>
<template id="minimap-view-tip" data-layer="tooltip"><div class="tip"><div class="th" data-l10n="minimap.view"></div><div data-l10n="minimap.renderer_reason"></div></div></template>
<template id="minimap-options-tip" data-layer="tooltip"><div class="tip"><div class="th" data-l10n="minimap.options"></div></div></template>
<template id="minimap-streamer-tip" data-layer="tooltip"><div class="tip"><div class="th" data-l10n="minimap.streamer"></div></div></template>
<template id="minimap-timer-control-tip" data-layer="tooltip"><div class="tip"><div class="th" data-l10n="minimap.timer"></div><div data-l10n="minimap.timer_reason"></div></div></template>
<template id="unit-rename-tip" data-layer="tooltip"><div class="tip" data-l10n="unit_panel.rename"></div></template>

<template id="notification-dismiss-tip" data-layer="tooltip"><div class="tip" data-l10n="notification.dismiss"></div></template>
