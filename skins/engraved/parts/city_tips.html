<template id="city-tip" data-layer="tooltip"><div class="tip" data-bind-if="{{city != null}}">
  <div data-bind-if="{{state.city.hover_kind == 'option'}}"><div data-bind-for="g:{{city.production.groups}}"><div class="cv-tipb" data-bind-for="o:{{g.options}}" data-bind-filter="{{o.item == state.city.hover}}"><div class="th hd"><span data-bind-value="{{o.name}}"></span><span class="tl lk" data-bind-if="{{o.turns != null}}" data-l10n="top.turns" data-l10n-args="{{o.turns}}"></span></div><span class="tl" data-bind-value="{{o.help}}"></span><span class="tl c-neg" data-bind-value="{{o.reason}}"></span><span class="tl lk" data-bind-value="{{o.buy_reason}}"></span></div></div></div>
  <div data-bind-if="{{state.city.hover_kind == 'building'}}"><div data-bind-for="g:{{city.building_groups}}"><div class="cv-tipb" data-bind-for="b:{{g.buildings}}" data-bind-filter="{{b.id == state.city.hover}}"><div class="th hd"><span data-bind-value="{{b.name}}"></span></div><span class="tl" data-bind-value="{{b.help}}"></span><span class="tl lk" data-bind-value="{{b.sell_reason}}"></span></div></div></div>
  <div data-bind-if="{{state.city.hover_kind == 'focus'}}"><div class="tl" data-bind-for="f:{{city.focus_options}}" data-bind-filter="{{f.id == state.city.hover}}" data-bind-value="{{f.reason}}"></div></div>
</div></template>
