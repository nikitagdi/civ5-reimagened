<div class="ideology-screen" data-screen="ideology" data-esc="call policies.escape()" data-part="ideology" data-bind-if="{{ui.windows.ideology.open && ideology != null}}">
  <section class="ideology-window">
    <div class="ideology-head"><b class="ideology-title" data-l10n="ideology.title">Choose an ideology</b><span data-bind-value="{{ideology.civ_name}}"></span><button class="ideology-button" data-on-click="intent window.close(window: 'ideology')" data-l10n="ideology.back">Back</button></div>
    <span class="ideology-reason" data-bind-if="{{ideology.reason != null}}" data-bind-value="{{ideology.reason}}"></span>
    <div class="ideology-cards">
      <div class="ideology-card" data-bind-for="o:{{ideology.options}}">
        <div class="ideology-crest"><img class="ideology-icon" data-bind-src="{{o.icon}}"></div>
        <b class="ideology-title" data-part="ideology.name" data-bind-value="{{o.name}}"></b>
        <div class="ideology-victories"><span data-bind-for="v:{{o.victories}}" data-bind-value="{{v.kind}}"></span></div>
        <div class="ideology-free"><b data-bind-value="{{o.free_tenets}}"></b><span data-l10n="ideology.free">free tenets</span></div>
        <div class="ideology-adopters"><span data-bind-for="a:{{o.adopted_by}}" data-bind-value="{{a.name}}"></span></div>
        <button class="ideology-button" data-part="ideology.choose" data-bind-disabled="{{!ideology.enabled}}" data-on-click="set state.ideology.confirm = o.id; set state.ideology.name = o.name" data-l10n="ideology.adopt">Adopt</button>
        <button class="ideology-button" data-part="ideology.details" data-on-click="set state.ideology.details = o.id" data-l10n="ideology.tenets">Tenets</button>
      </div>
    </div>
    <div class="ideology-overlay" data-bind-if="{{state.ideology.details >= 0}}">
      <div class="ideology-dialog"><div data-bind-for="o:{{ideology.options}}" data-bind-filter="{{o.id == state.ideology.details}}"><b class="ideology-title" data-bind-value="{{o.name}}"></b>
        <div class="ideology-level" data-bind-for="l:{{o.levels}}"><button class="ideology-button" data-on-click="set state.ideology.folded = l.level" data-l10n="ideology.level" data-l10n-args="{{l.level}}">Level</button><button class="ideology-button" data-bind-if="{{state.ideology.folded == l.level}}" data-on-click="set state.ideology.folded = 0" data-l10n="ideology.expand">Expand</button><div data-bind-if="{{state.ideology.folded != l.level}}"><div class="ideology-tenet" data-bind-for="t:{{l.tenets}}"><b data-bind-value="{{t.name}}"></b><span data-bind-value="{{t.effect}}"></span></div></div></div>
      </div><button class="ideology-button" data-on-click="set state.ideology.details = -1" data-l10n="ideology.back">Back</button></div>
    </div>
    <div class="ideology-overlay" data-bind-if="{{state.ideology.confirm >= 0 && state.ideology.details < 0}}"><div class="ideology-dialog"><b class="ideology-title" data-l10n="ideology.confirm" data-l10n-args="{{state.ideology.name}}">Adopt ideology?</b><button class="ideology-button" data-part="ideology.confirm" data-bind-hotkey="'Enter'" data-on-click="intent screen.act(screen: 'ideology', action: 'choose', a: state.ideology.confirm); set state.ideology.confirm = -1" data-l10n="ideology.adopt">Adopt</button><button class="ideology-button" data-on-click="set state.ideology.confirm = -1" data-l10n="ideology.back">Back</button></div></div>
  </section>
</div>
