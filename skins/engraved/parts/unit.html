<section class="unit plate tr" data-part="unit" data-bind-if="{{unit != null && !ui.windows.city.open && !ui.windows.city_captured.open && !ui.windows.ideology.open && !ui.windows.pantheon.open && !ui.windows.religion.open && !ui.windows.free_great_person.open}}">
  <div class="head">
    <div class="portrait" data-part="unit.portrait">
      <svg class="i fill sil"><use href="#i-unit"/></svg>
      <img class="pic" data-bind-src="{{unit.portrait}}">
    </div>
    <div class="info">
      <div class="title" data-part="unit.title">
        <span class="nm" data-bind-value="{{unit.name}}">Bogatyr</span>
        <span class="ty" data-bind-value="{{unit.type_name}}">Knight</span>
        <span class="state" data-bind-if="{{unit.activity == 'hold'}}" data-l10n="unit.holding">Holding</span>
        <span class="state" data-bind-if="{{unit.activity == 'sleep'}}" data-l10n="unit.resting">Fortified</span>
        <span class="state" data-bind-if="{{unit.activity == 'heal'}}" data-l10n="unit.healing">Healing</span>
        <span class="state" data-bind-if="{{unit.pending}}" data-l10n="unit.pending">Waiting</span>
        <span class="lvl" data-l10n="unit.level" data-l10n-args="{{unit.level}}">Level 2</span>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="k"><svg class="i"><use href="#i-str"/></svg><span data-l10n="unit.strength">Strength</span></div>
          <div class="v"><span data-bind-value="{{unit.strength}}">20</span><span class="rng" data-bind-if="{{unit.ranged > 0}}" data-l10n="unit.ranged" data-l10n-args="{{unit.ranged}}">ranged 18</span></div>
        </div>
        <div class="stat sep">
          <div class="k"><svg class="i"><use href="#i-moves"/></svg><span data-l10n="unit.moves">Moves</span></div>
          <div class="v">
            <span data-bind-value="{{round(unit.moves * 10) / 10}}">2</span>
            <span class="of" data-l10n="unit.of" data-l10n-args="{{unit.max_moves}}">of 4</span>
            <div class="pips">
              <div class="pip" data-bind-if="{{unit.max_moves >= 1}}" data-bind-class-toggle="on:{{unit.moves >= 1}}"></div>
              <div class="pip" data-bind-if="{{unit.max_moves >= 2}}" data-bind-class-toggle="on:{{unit.moves >= 2}}"></div>
              <div class="pip" data-bind-if="{{unit.max_moves >= 3}}" data-bind-class-toggle="on:{{unit.moves >= 3}}"></div>
              <div class="pip" data-bind-if="{{unit.max_moves >= 4}}" data-bind-class-toggle="on:{{unit.moves >= 4}}"></div>
              <div class="pip" data-bind-if="{{unit.max_moves >= 5}}" data-bind-class-toggle="on:{{unit.moves >= 5}}"></div>
            </div>
          </div>
        </div>
        <div class="stat sep">
          <div class="k"><svg class="i"><use href="#i-hp"/></svg><span data-l10n="unit.health">Health</span></div>
          <div class="v">
            <span data-bind-value="{{round(unit.hp_fraction * 100)}}%">100%</span>
            <div class="hpbar"><div class="fill" data-bind-class-toggle="low:{{unit.hp_fraction < 0.5}}" data-bind-style-width="{{unit.hp_fraction * 100}}%" style="width: 100%"></div></div>
          </div>
        </div>
      </div>
      <div class="promos" data-part="unit.promotions">
        <span class="lbl" data-l10n="unit.promotions">Promotions</span>
        <span class="ready" data-bind-if="{{unit.promotion_ready}}" data-l10n="unit.promotion_ready">ready</span>
        <div class="chip" data-bind-for="p:{{unit.promotions}}">
          <svg class="i"><use href="#i-str"/></svg>
          <span data-bind-value="{{p.name}}">Shock I</span>
        </div>
        <span class="none" data-bind-if="{{len(unit.promotions) == 0 && !unit.promotion_ready}}" data-l10n="unit.no_promotions">none</span>
      </div>
    </div>
  </div>

  <div class="unit-panel-catalog" data-bind-if="{{hud != null && hud.unit != null}}">
    <button class="unit-panel-rename-button" data-part="unit-panel.rename-open" data-on-click="intent window.open(window: 'unit_rename', a: hud.unit.id)" data-l10n="unit_panel.rename"></button>
    <span class="unit-panel-xp" data-l10n="unit_panel.xp" data-l10n-args="{{unit.xp}}, {{hud.unit.xp_next}}"></span>
    <div class="unit-panel-actions" data-part="unit.actions" data-slot="hud.unit.actions">
      <button class="unit-panel-action" data-part="unit.act.found-city" data-bind-for="a:{{hud.unit.catalog}}" data-bind-filter="{{a.client == 'found_city'}}" data-bind-hotkey="{{a.hotkey}}" data-bind-disabled="{{!a.enabled || unit.pending || len(ui.pending) > 0}}" data-bind-class-toggle="unit-panel-promotion:{{a.promotion}}; unit-panel-build:{{a.build}}" data-tooltip="unit-panel-action-tip" data-on-pointerenter="set state.unit_panel.hover = a.id" data-on-click="call unit_panel.act(a.id, a.client, event.alt, event.shift)"><svg class="i" data-bind-if="{{a.promotion}}"><use href="#i-str"/></svg><svg class="i" data-bind-if="{{a.build}}"><use href="#i-worker"/></svg><svg class="i" data-bind-if="{{!a.promotion && !a.build}}"><use href="#i-move"/></svg><span class="unit-panel-action-name" data-bind-value="{{a.name}}"></span><span class="unit-panel-key" data-hotkey-label></span></button>
      <button class="unit-panel-action" data-part="unit.act.fortify" data-bind-for="a:{{hud.unit.catalog}}" data-bind-filter="{{a.client == 'fortify'}}" data-bind-hotkey="{{a.hotkey}}" data-bind-disabled="{{!a.enabled || unit.pending || len(ui.pending) > 0}}" data-bind-class-toggle="unit-panel-promotion:{{a.promotion}}; unit-panel-build:{{a.build}}" data-tooltip="unit-panel-action-tip" data-on-pointerenter="set state.unit_panel.hover = a.id" data-on-click="call unit_panel.act(a.id, a.client, event.alt, event.shift)"><svg class="i" data-bind-if="{{a.promotion}}"><use href="#i-str"/></svg><svg class="i" data-bind-if="{{a.build}}"><use href="#i-worker"/></svg><svg class="i" data-bind-if="{{!a.promotion && !a.build}}"><use href="#i-move"/></svg><span class="unit-panel-action-name" data-bind-value="{{a.name}}"></span><span class="unit-panel-key" data-hotkey-label></span></button>
      <button class="unit-panel-action" data-part="unit.act.sleep" data-bind-for="a:{{hud.unit.catalog}}" data-bind-filter="{{a.client == 'sleep'}}" data-bind-hotkey="{{a.hotkey}}" data-bind-disabled="{{!a.enabled || unit.pending || len(ui.pending) > 0}}" data-bind-class-toggle="unit-panel-promotion:{{a.promotion}}; unit-panel-build:{{a.build}}" data-tooltip="unit-panel-action-tip" data-on-pointerenter="set state.unit_panel.hover = a.id" data-on-click="call unit_panel.act(a.id, a.client, event.alt, event.shift)"><svg class="i" data-bind-if="{{a.promotion}}"><use href="#i-str"/></svg><svg class="i" data-bind-if="{{a.build}}"><use href="#i-worker"/></svg><svg class="i" data-bind-if="{{!a.promotion && !a.build}}"><use href="#i-move"/></svg><span class="unit-panel-action-name" data-bind-value="{{a.name}}"></span><span class="unit-panel-key" data-hotkey-label></span></button>
      <button class="unit-panel-action" data-part="unit.act.skip" data-bind-for="a:{{hud.unit.catalog}}" data-bind-filter="{{a.client == 'skip'}}" data-bind-hotkey="{{a.hotkey}}" data-bind-disabled="{{!a.enabled || unit.pending || len(ui.pending) > 0}}" data-bind-class-toggle="unit-panel-promotion:{{a.promotion}}; unit-panel-build:{{a.build}}" data-tooltip="unit-panel-action-tip" data-on-pointerenter="set state.unit_panel.hover = a.id" data-on-click="call unit_panel.act(a.id, a.client, event.alt, event.shift)"><svg class="i" data-bind-if="{{a.promotion}}"><use href="#i-str"/></svg><svg class="i" data-bind-if="{{a.build}}"><use href="#i-worker"/></svg><svg class="i" data-bind-if="{{!a.promotion && !a.build}}"><use href="#i-move"/></svg><span class="unit-panel-action-name" data-bind-value="{{a.name}}"></span><span class="unit-panel-key" data-hotkey-label></span></button>
      <button class="unit-panel-action" data-part="unit-panel.action" data-bind-for="a:{{hud.unit.catalog}}" data-bind-filter="{{a.client != 'found_city' && a.client != 'fortify' && a.client != 'sleep' && a.client != 'skip'}}" data-bind-hotkey="{{a.hotkey}}" data-bind-disabled="{{!a.enabled || unit.pending || len(ui.pending) > 0}}" data-bind-class-toggle="unit-panel-promotion:{{a.promotion}}; unit-panel-build:{{a.build}}" data-tooltip="unit-panel-action-tip" data-on-pointerenter="set state.unit_panel.hover = a.id" data-on-click="call unit_panel.act(a.id, a.client, event.alt, event.shift)"><svg class="i" data-bind-if="{{a.promotion}}"><use href="#i-str"/></svg><svg class="i" data-bind-if="{{a.build}}"><use href="#i-worker"/></svg><svg class="i" data-bind-if="{{!a.promotion && !a.build}}"><use href="#i-move"/></svg><span class="unit-panel-action-name" data-bind-value="{{a.name}}"></span><span class="unit-panel-key" data-hotkey-label></span></button>
    </div>
  </div>
</section>
