<!-- SIMPLIFIED(SIMP-462): The native unit catalog has no spy identity or move-spy action; relocate spies from the espionage overview. -->
<!-- The selected unit, compact: portrait, name, type and level on one line, the experience bar with the promotions
     under it, one row of stats, then the orders in one wrapping row in the catalog's order (the HUD service sorts it by
     the order weights: move, attacks, fortify, builds, special orders, upgrade, automation, delete last). The name of
     an order is in its tooltip. -->
<section class="unit plate tr" data-part="unit" data-bind-if="{{unit != null}}">
  <div class="u-head">
    <div class="u-por" data-part="unit.portrait">
      <svg class="i fill sil"><use href="#i-unit"/></svg>
      <img class="pic" data-bind-src="{{unit.portrait}}">
    </div>
    <div class="u-info">
      <div class="u-title" data-part="unit.title">
        <span class="nm" data-bind-value="{{unit.name}}">Bogatyr</span>
        <span class="ty" data-bind-value="{{unit.type_name}}">Knight</span>
        <span class="state" data-bind-if="{{unit.activity == 'hold'}}" data-l10n="unit.holding">Holding</span>
        <span class="state" data-bind-if="{{unit.activity == 'sleep'}}" data-l10n="unit.resting">Fortified</span>
        <span class="state" data-bind-if="{{unit.activity == 'heal'}}" data-l10n="unit.healing">Healing</span>
        <span class="state" data-bind-if="{{unit.pending}}" data-l10n="unit.pending">Waiting</span>
        <span class="lvl" data-l10n="unit.level" data-l10n-args="{{unit.level}}">Level 2</span>
        <button class="ren" data-part="unit-panel.rename-open" data-on-click="intent window.open(window: 'unit_rename', a: hud.unit.id)" data-tooltip="unit-rename-tip" data-bind-if="{{hud != null && hud.unit != null}}"><svg class="i"><use href="#i-pencil"/></svg></button>
      </div>
      <div class="u-xp" data-bind-if="{{hud != null && hud.unit != null}}" data-bind-class-toggle="full:{{unit.promotion_ready}}">
        <b data-bind-value="{{unit.xp}}/{{hud.unit.xp_next}}">12/30</b>
        <div class="trk"><div class="fill" data-bind-style-width="{{clamp(unit.xp / max(hud.unit.xp_next, 1), 0, 1) * 100}}%" style="width: 40%"></div></div>
        <span data-l10n="unit_panel.xp_short">XP</span>
      </div>
      <div class="u-promos" data-part="unit.promotions" data-bind-if="{{len(unit.promotions) > 0}}">
        <img class="pr" data-bind-for="p:{{unit.promotions}}" data-bind-src="{{p.icon}}" data-tooltip="unit-promotion-tip" data-on-pointerenter="set state.unit_panel.promo = p.id">
      </div>
      <div class="u-stats">
        <span class="s" data-bind-if="{{unit.strength > 0}}"><svg class="i"><use href="#i-str"/></svg><span data-bind-value="{{unit.strength}}">20</span></span>
        <span class="s" data-bind-if="{{unit.ranged > 0}}"><svg class="i"><use href="#i-bow"/></svg><span data-bind-value="{{unit.ranged}}">18</span><small data-l10n="unit_panel.range" data-l10n-args="{{unit.range}}">r2</small></span>
        <span class="s"><svg class="i"><use href="#i-moves"/></svg><span data-bind-value="{{round(unit.moves * 10) / 10}}">2</span><small data-bind-value="/{{unit.max_moves}}">/4</small></span>
        <span class="s" data-bind-class-toggle="hp-mid:{{unit.hp_fraction < 0.66}}; hp-lo:{{unit.hp_fraction < 0.33}}"><svg class="i"><use href="#i-hp"/></svg><span data-bind-value="{{round(unit.hp_fraction * 100)}}%">100%</span><div class="uhp" data-bind-if="{{unit.hp_fraction < 1}}"><div class="fill" data-bind-style-width="{{unit.hp_fraction * 100}}%"></div></div></span>
      </div>
    </div>
  </div>

  <div class="u-acts" data-part="unit.actions" data-slot="hud.unit.actions">
    <div class="row" data-bind-if="{{hud != null && hud.unit != null}}">
    <button class="ua"
      data-part="unit-panel.action"
      data-bind-for="a:{{hud.unit.catalog}}"
      data-bind-hotkey="{{a.hotkey}}"
      data-bind-disabled="{{!a.enabled || unit.pending || len(ui.pending) > 0}}"
      data-bind-class-toggle="is-rec:{{a.promotion}}; danger:{{a.client == 'disband'}}"
      data-tooltip="unit-panel-action-tip"
      data-on-pointerenter="set state.unit_panel.hover = a.id"
      data-on-click="call unit_panel.act(a.id, a.client, event.alt, event.shift)">
      <img class="ai" data-bind-src="{{a.icon}}">
      <!-- The orders the playtests reach by name: a mark over the whole button carries the name and the key. -->
      <span class="mk" data-part="unit.act.found-city" data-bind-if="{{a.client == 'found_city'}}"><span class="hk" data-hotkey-label></span></span>
      <span class="mk" data-part="unit.act.fortify" data-bind-if="{{a.client == 'fortify'}}"><span class="hk" data-hotkey-label></span></span>
      <span class="mk" data-part="unit.act.sleep" data-bind-if="{{a.client == 'sleep'}}"><span class="hk" data-hotkey-label></span></span>
      <span class="mk" data-part="unit.act.skip" data-bind-if="{{a.client == 'skip'}}"><span class="hk" data-hotkey-label></span></span>
      <span class="mk" data-part="unit.act.disband" data-bind-if="{{a.client == 'disband'}}"><span class="hk" data-hotkey-label></span></span>
      <span class="mk" data-bind-if="{{a.client != 'found_city' && a.client != 'fortify' && a.client != 'sleep' && a.client != 'skip' && a.client != 'disband'}}"><span class="hk" data-hotkey-label></span></span>
    </button>
    </div>
  </div>
</section>
