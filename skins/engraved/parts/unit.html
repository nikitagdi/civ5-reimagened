<section class="unit plate tr" data-part="unit" data-bind-if="{{unit != null}}">
  <div class="head">
    <div class="portrait" data-part="unit.portrait">
      <svg class="i fill sil"><use href="#i-unit"/></svg>
      <img class="pic" data-bind-src="{{unit.portrait}}">
    </div>
    <div class="info">
      <div class="title" data-part="unit.title">
        <span class="nm" data-bind-value="{{unit.name}}">Bogatyr</span>
        <span class="ty" data-bind-value="{{unit.type_name}}">Knight</span>
        <span class="state" data-bind-if="{{unit.activity == 'hold'}}" data-l10n="unit.holding">Holding</span>
        <span class="state" data-bind-if="{{unit.activity == 'sleep'}}" data-l10n="unit.resting">Fortified</span>
        <span class="state" data-bind-if="{{unit.activity == 'heal'}}" data-l10n="unit.healing">Healing</span>
        <span class="state" data-bind-if="{{unit.pending}}" data-l10n="unit.pending">Waiting</span>
        <span class="lvl" data-l10n="unit.level" data-l10n-args="{{unit.level}}">Level 2</span>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="k"><svg class="i"><use href="#i-str"/></svg><span data-l10n="unit.strength">Strength</span></div>
          <div class="v"><span data-bind-value="{{unit.strength}}">20</span><span class="rng" data-bind-if="{{unit.ranged > 0}}" data-l10n="unit.ranged" data-l10n-args="{{unit.ranged}}">ranged 18</span></div>
        </div>
        <div class="stat sep">
          <div class="k"><svg class="i"><use href="#i-moves"/></svg><span data-l10n="unit.moves">Moves</span></div>
          <div class="v">
            <span data-bind-value="{{round(unit.moves * 10) / 10}}">2</span>
            <span class="of" data-l10n="unit.of" data-l10n-args="{{unit.max_moves}}">of 4</span>
            <div class="pips">
              <div class="pip" data-bind-if="{{unit.max_moves >= 1}}" data-bind-class-toggle="on:{{unit.moves >= 1}}"></div>
              <div class="pip" data-bind-if="{{unit.max_moves >= 2}}" data-bind-class-toggle="on:{{unit.moves >= 2}}"></div>
              <div class="pip" data-bind-if="{{unit.max_moves >= 3}}" data-bind-class-toggle="on:{{unit.moves >= 3}}"></div>
              <div class="pip" data-bind-if="{{unit.max_moves >= 4}}" data-bind-class-toggle="on:{{unit.moves >= 4}}"></div>
              <div class="pip" data-bind-if="{{unit.max_moves >= 5}}" data-bind-class-toggle="on:{{unit.moves >= 5}}"></div>
            </div>
          </div>
        </div>
        <div class="stat sep">
          <div class="k"><svg class="i"><use href="#i-hp"/></svg><span data-l10n="unit.health">Health</span></div>
          <div class="v">
            <span data-bind-value="{{round(unit.hp_fraction * 100)}}%">100%</span>
            <div class="hpbar"><div class="fill" data-bind-class-toggle="low:{{unit.hp_fraction < 0.5}}" data-bind-style-width="{{unit.hp_fraction * 100}}%" style="width: 100%"></div></div>
          </div>
        </div>
      </div>
      <div class="promos" data-part="unit.promotions">
        <span class="lbl" data-l10n="unit.promotions">Promotions</span>
        <span class="ready" data-bind-if="{{unit.promotion_ready}}" data-l10n="unit.promotion_ready">ready</span>
        <div class="chip" data-bind-for="p:{{unit.promotions}}">
          <svg class="i"><use href="#i-str"/></svg>
          <span data-bind-value="{{p.name}}">Shock I</span>
        </div>
        <span class="none" data-bind-if="{{len(unit.promotions) == 0 && !unit.promotion_ready}}" data-l10n="unit.no_promotions">none</span>
      </div>
    </div>
  </div>

  <div class="actions" data-part="unit.actions" data-slot="hud.unit.actions">
    <!-- The orders take the unit's key from its map flag: a path through the optional unit root is nullable for the
         profile's type check, and an order needs a key. A hotkey cannot sit in a list, so the buttons have none yet. -->
    <div class="acts" data-bind-for="u:{{map.units}}" data-bind-key="{{u.key}}" data-bind-filter="{{u.key == ui.selection.unit}}">
    <button class="act" data-part="unit.act.move" data-bind-if="{{unit.act.move.shown}}" data-bind-disabled="{{!unit.act.move.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'move')">
      <svg class="i"><use href="#i-move"/></svg><span class="lb" data-l10n="act.move">Move</span>
    </button>
    <button class="act" data-part="unit.act.range-attack" data-bind-if="{{unit.act.range_attack.shown}}" data-bind-disabled="{{!unit.act.range_attack.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'range_attack')">
      <svg class="i"><use href="#i-bow"/></svg><span class="lb" data-l10n="act.range_attack">Attack</span>
    </button>
    <button class="act" data-part="unit.act.found-city" data-bind-if="{{unit.act.found_city.shown}}" data-bind-disabled="{{!unit.act.found_city.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'found_city')">
      <svg class="i"><use href="#i-settler"/></svg><span class="lb" data-l10n="act.found_city">Found</span>
    </button>
    <button class="act" data-part="unit.act.fortify" data-bind-if="{{unit.act.fortify.shown}}" data-bind-disabled="{{!unit.act.fortify.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'fortify')">
      <svg class="i"><use href="#i-fortify"/></svg><span class="lb" data-l10n="act.fortify">Fortify</span>
    </button>
    <button class="act" data-part="unit.act.sleep" data-bind-if="{{unit.act.sleep.shown}}" data-bind-disabled="{{!unit.act.sleep.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'sleep')">
      <svg class="i"><use href="#i-sleep"/></svg><span class="lb" data-l10n="act.sleep">Sleep</span>
    </button>
    <button class="act" data-part="unit.act.heal" data-bind-if="{{unit.act.heal.shown}}" data-bind-disabled="{{!unit.act.heal.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'heal')">
      <svg class="i"><use href="#i-hp"/></svg><span class="lb" data-l10n="act.heal">Heal</span>
    </button>
    <button class="act" data-part="unit.act.automate-build" data-bind-if="{{unit.act.automate_build.shown}}" data-bind-disabled="{{!unit.act.automate_build.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'automate_build')">
      <svg class="i"><use href="#i-worker"/></svg><span class="lb" data-l10n="act.automate_build">Auto</span>
    </button>
    <button class="act" data-part="unit.act.automate-explore" data-bind-if="{{unit.act.automate_explore.shown}}" data-bind-disabled="{{!unit.act.automate_explore.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'automate_explore')">
      <svg class="i"><use href="#i-tour"/></svg><span class="lb" data-l10n="act.automate_explore">Explore</span>
    </button>
    <button class="act" data-part="unit.act.skip" data-bind-if="{{unit.act.skip.shown}}" data-bind-disabled="{{!unit.act.skip.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'skip')">
      <svg class="i"><use href="#i-moves"/></svg><span class="lb" data-l10n="act.skip">Skip</span>
    </button>
    <button class="act" data-part="unit.act.wake" data-bind-if="{{unit.act.wake.shown}}" data-bind-disabled="{{!unit.act.wake.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'wake')">
      <svg class="i"><use href="#i-alert"/></svg><span class="lb" data-l10n="act.wake">Wake</span>
    </button>
    <button class="act" data-part="unit.act.cancel" data-bind-if="{{unit.act.cancel.shown}}" data-bind-disabled="{{!unit.act.cancel.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'cancel')">
      <svg class="i"><use href="#i-close"/></svg><span class="lb" data-l10n="act.cancel">Cancel</span>
    </button>
    <!-- SIMPLIFIED(SIMP-250): alert, pillage and upgrade are shown as the core reports them but stay disabled: no order exists for them yet. -->
    <button class="act" data-part="unit.act.alert"data-bind-if="{{unit.act.alert.shown}}" data-bind-disabled="{{true}}">
      <svg class="i"><use href="#i-alert"/></svg><span class="lb" data-l10n="act.alert">Alert</span>
    </button>
    <button class="act" data-part="unit.act.pillage" data-bind-if="{{unit.act.pillage.shown}}" data-bind-disabled="{{true}}">
      <svg class="i"><use href="#i-pillage"/></svg><span class="lb" data-l10n="act.pillage">Pillage</span>
    </button>
    <button class="act" data-part="unit.act.upgrade" data-bind-if="{{unit.act.upgrade.shown}}" data-bind-disabled="{{true}}">
      <svg class="i"><use href="#i-upgrade"/></svg><span class="lb" data-l10n="act.upgrade">Upgrade</span>
    </button>
    <button class="act gap danger" data-part="unit.act.disband" data-bind-if="{{unit.act.disband.shown}}" data-bind-disabled="{{!unit.act.disband.enabled}}" data-on-click="intent unit.action(unit: u.key, action: 'disband')">
      <svg class="i"><use href="#i-del"/></svg><span class="lb" data-l10n="act.disband">Delete</span>
    </button>
    </div>
  </div>
</section>
