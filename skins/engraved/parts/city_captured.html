<div class="city_captured-screen" data-part="city-captured" data-screen="city_captured" data-esc="none" data-bind-if="{{ui.windows.city_captured.open && !ui.windows.city.open}}">
  <section class="city_captured-window" data-bind-if="{{city_captured != null}}">
    <header class="city_captured-header"><b data-part="city-captured.name" data-bind-value="{{city_captured.name}}"></b><span data-bind-value="{{city_captured.taken_from}}"></span><span data-bind-value="{{city_captured.founded_by}}"></span></header>
    <div class="city_captured-loot" data-bind-if="{{city_captured.loot != null}}"><span data-l10n="city_captured.gold">Plundered gold</span><b data-bind-value="{{city_captured.loot.gold}}"></b><span data-l10n="city_captured.culture">Culture</span><b data-bind-value="{{city_captured.loot.culture}}"></b><span data-l10n="city_captured.great_works">Great Works</span><b data-bind-value="{{city_captured.loot.great_works_count}}"></b></div>
    <div class="city_captured-scroll">
      <div class="city_captured-option" data-bind-for="o:{{city_captured.options}}"><button data-part="city-captured.option" data-bind-disabled="{{!o.enabled}}" data-on-click="intent screen.act(screen: 'city_captured', action: o.key, a: city_captured.city)"><b data-bind-value="{{o.title}}"></b><span data-bind-value="{{o.text}}"></span><span data-bind-value="{{o.liberate_to}}"></span></button><span class="city_captured-reason" data-bind-value="{{o.reason}}"></span><span data-bind-value="{{o.forecast}}"></span></div>
      <div class="city_captured-annex" data-bind-if="{{city_captured.mode == 'annex'}}"><span data-l10n="city_captured.annex_help">Annexing gives you control of production, citizens and buildings. Occupation remains until a Courthouse is built.</span><span data-bind-value="{{city_captured.happiness}}"></span></div>
      <span class="city_captured-reason" data-part="city-captured.reason" data-bind-value="{{city_captured.reason}}"></span>
    </div>
    <footer class="city_captured-footer"><button data-part="city-captured.view" data-bind-disabled="{{!city_captured.can_view}}" data-on-click="intent window.open(window: 'city', a: city_captured.city, b: 1)" data-l10n="city_captured.view">View city first</button><button data-bind-if="{{city_captured.mode == 'annex'}}" data-on-click="intent window.close(window: 'city_captured')" data-l10n="city_captured.keep">Keep as puppet</button><button class="city_captured-primary" data-bind-if="{{city_captured.mode == 'annex'}}" data-bind-disabled="{{city_captured.may_annex != true}}" data-on-click="intent screen.act(screen: 'city_captured', action: 'annex', a: city_captured.city)" data-l10n="city_captured.annex">Annex</button></footer>
  </section>
</div>
