<div class="wlayer dimmed" data-part="game-menu" data-screen="game_menu" data-esc="intent window.close(window: 'game_menu')" data-bind-if="{{ui.windows.game_menu.open}}">
 <section class="win pop w-xl gm-win">
  <div class="hd">
   <img class="gi s48" data-bind-if="{{game_menu != null}}" data-bind-src="{{game_menu.player.civ_icon}}">
   <div class="ttl stack"><span class="kick" data-bind-if="{{game_menu != null}}" data-bind-value="{{game_menu.turn}}"></span><b data-bind-if="{{!state.menu.options}}" data-l10n="menu.title"></b><b data-bind-if="{{state.menu.options}}" data-l10n="menu.options"></b></div>
   <div class="close"><span class="key" data-l10n="key.escape">Esc</span><button class="x" data-on-click="intent window.close(window: 'game_menu')"><svg class="i"><use href="#i-close"/></svg></button></div>
  </div>
  <div class="wbd empty" data-bind-if="{{game_menu == null}}" data-l10n="menu.loading"></div>
  <div class="gm" data-bind-if="{{game_menu != null &amp;&amp; !state.menu.options}}">
   <div class="side">
    <div class="who lg"><img class="gi s80 round" data-bind-src="{{game_menu.player.leader_icon}}"><span class="tx"><b data-part="game-menu.leader" data-bind-value="{{game_menu.player.leader}}"></b><span data-bind-value="{{game_menu.player.civ}}"></span><span data-bind-value="{{game_menu.player.trait.short}}"></span></span></div>
    <div class="setic"><div class="c" data-bind-for="s:{{game_menu.settings}}"><b data-bind-value="{{s.value}}"></b><span data-bind-value="{{s.label}}"></span></div></div>
    <div class="btns col gm-list">
     <button class="btn primary" data-part="game-menu.return" data-bind-hotkey="'Enter'" data-on-click="intent window.close(window: 'game_menu')"><span data-l10n="menu.return"></span><span class="key" data-hotkey-label>Enter</span></button>
     <button class="btn" data-bind-disabled="{{!game_menu.can_save}}" data-on-click="intent screen.act(screen: 'game_menu', action: 'save')" data-l10n="menu.save"></button>
     <span class="why" data-bind-if="{{game_menu.save_reason != null}}" data-bind-value="{{game_menu.save_reason}}"></span>
     <button class="btn" data-part="game-menu.options" data-on-click="call menu.open()" data-l10n="menu.options"></button>
     <span class="btn danger off" data-l10n="menu.exit"></span><span class="why" data-l10n="menu.exit.reason"></span>
    </div>
   </div>
   <div class="det">
    <div class="tabs band"><button class="tab" data-bind-class-toggle="on:{{state.menu.panel == 'details'}}" data-l10n="menu.details" data-on-click="set state.menu.panel = 'details'"></button><button class="tab" data-bind-class-toggle="on:{{state.menu.panel == 'mods'}}" data-bind-if="{{len(game_menu.mods) &gt; 0}}" data-on-click="set state.menu.panel = 'mods'"><span data-l10n="menu.mods"></span><span class="cnt" data-bind-value="{{len(game_menu.mods)}}"></span></button></div>
    <div class="wbd" data-bind-if="{{state.menu.panel == 'details'}}">
     <div class="kv"><div class="r" data-bind-for="d:{{game_menu.details}}"><span class="k" data-bind-value="{{d.label}}"></span><b data-bind-value="{{d.value}}"></b></div></div>
     <div class="sect"><span data-l10n="menu.victories"></span><i class="rule"></i></div><div class="chips"><span class="chip" data-bind-for="v:{{game_menu.victories}}" data-bind-value="{{v.name}}"></span></div>
     <div class="sect"><span data-l10n="menu.rules"></span><i class="rule"></i></div><div class="chips"><span class="chip" data-bind-for="o:{{game_menu.game_options}}" data-bind-value="{{o.name}}"></span></div>
    </div>
    <div class="wbd" data-bind-if="{{state.menu.panel == 'mods'}}"><div class="kv"><div class="r" data-bind-for="m:{{game_menu.mods}}"><span class="k" data-bind-value="{{m.name}}"></span><b data-bind-value="{{m.version}}"></b></div></div></div>
   </div>
  </div>
  <div class="tabs band" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options}}"><button class="tab" data-bind-class-toggle="on:{{state.opt.tab == 'general'}}" data-l10n="menu.general" data-on-click="set state.opt.tab = 'general'"></button><button class="tab" data-bind-class-toggle="on:{{state.opt.tab == 'interface'}}" data-l10n="menu.interface" data-on-click="set state.opt.tab = 'interface'"></button><button class="tab" data-bind-class-toggle="on:{{state.opt.tab == 'hotkeys'}}" data-l10n="menu.hotkeys" data-on-click="set state.opt.tab = 'hotkeys'"></button></div>
  <div class="wbd gm-opts" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options &amp;&amp; state.opt.tab == 'general'}}">
       <span class="lb" data-l10n="menu.opt.auto.end.turn"></span><button class="tgl" data-part="game-menu.option-auto-end-turn" data-control="toggle" data-bind-model="state.opt.auto_end_turn" data-bind-class-toggle="on:{{state.opt.auto_end_turn}}"></button>
       <span class="lb" data-l10n="menu.opt.auto.end.turn.sp"></span><button class="tgl" data-part="game-menu.option-auto-end-turn-sp" data-control="toggle" data-bind-model="state.opt.auto_end_turn_sp" data-bind-class-toggle="on:{{state.opt.auto_end_turn_sp}}"></button>
       <span class="lb" data-l10n="menu.opt.next.unit.after.orders"></span><button class="tgl" data-part="game-menu.option-next-unit-after-orders" data-control="toggle" data-bind-model="state.opt.next_unit_after_orders" data-bind-class-toggle="on:{{state.opt.next_unit_after_orders}}"></button>
       <span class="lb" data-l10n="menu.opt.auto.unit.cycle"></span><button class="tgl" data-part="game-menu.option-auto-unit-cycle" data-control="toggle" data-bind-model="state.opt.auto_unit_cycle" data-bind-class-toggle="on:{{state.opt.auto_unit_cycle}}"></button>
       <span class="lb" data-l10n="menu.opt.air.rebase.rmb"></span><button class="tgl" data-part="game-menu.option-air-rebase-rmb" data-control="toggle" data-bind-model="state.opt.air_rebase_rmb" data-bind-class-toggle="on:{{state.opt.air_rebase_rmb}}"></button>
       <span class="lb" data-l10n="menu.opt.civilian.yields"></span><button class="tgl" data-part="game-menu.option-civilian-yields" data-control="toggle" data-bind-model="state.opt.civilian_yields" data-bind-class-toggle="on:{{state.opt.civilian_yields}}"></button>
       <span class="lb" data-l10n="menu.opt.workers.keep.improvements"></span><button class="tgl" data-part="game-menu.option-workers-keep-improvements" data-control="toggle" data-bind-model="state.opt.workers_keep_improvements" data-bind-class-toggle="on:{{state.opt.workers_keep_improvements}}"></button>
       <span class="lb" data-l10n="menu.opt.workers.keep.features"></span><button class="tgl" data-part="game-menu.option-workers-keep-features" data-control="toggle" data-bind-model="state.opt.workers_keep_features" data-bind-class-toggle="on:{{state.opt.workers_keep_features}}"></button>
       <span class="lb" data-l10n="menu.opt.no.tile.recs"></span><button class="tgl" data-part="game-menu.option-no-tile-recs" data-control="toggle" data-bind-model="state.opt.no_tile_recs" data-bind-class-toggle="on:{{state.opt.no_tile_recs}}"></button>
       <span class="lb" data-l10n="menu.opt.skip.reward.popups"></span><button class="tgl" data-part="game-menu.option-skip-reward-popups" data-control="toggle" data-bind-model="state.opt.skip_reward_popups" data-bind-class-toggle="on:{{state.opt.skip_reward_popups}}"></button>
       <span class="lb" data-l10n="menu.opt.music"></span><input class="field n gm-num" type="number" min="0" max="100" step="1" data-bind-model="state.opt.music">
       <span class="lb" data-l10n="menu.opt.effects"></span><input class="field n gm-num" type="number" min="0" max="100" step="1" data-bind-model="state.opt.effects">
       <span class="lb" data-l10n="menu.opt.ambience"></span><input class="field n gm-num" type="number" min="0" max="100" step="1" data-bind-model="state.opt.ambience">
       <span class="lb" data-l10n="menu.opt.speech"></span><input class="field n gm-num" type="number" min="0" max="100" step="1" data-bind-model="state.opt.speech">
       <span class="lb dis" data-l10n="menu.quick"></span><small class="lb dis" data-bind-value="{{game_menu.options.quick_locked_reason}}"></small>
  </div>
  <div class="wbd gm-opts" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options &amp;&amp; state.opt.tab == 'interface'}}">
       <span class="lb" data-l10n="menu.opt.policy.info.full"></span><button class="tgl" data-part="game-menu.option-policy-info-full" data-control="toggle" data-bind-model="state.opt.policy_info_full" data-bind-class-toggle="on:{{state.opt.policy_info_full}}"></button>
       <span class="lb" data-l10n="menu.opt.score.list"></span><button class="tgl" data-part="game-menu.option-score-list" data-control="toggle" data-bind-model="state.opt.score_list" data-bind-class-toggle="on:{{state.opt.score_list}}"></button>
       <span class="lb" data-l10n="menu.opt.civ.ribbon"></span><button class="tgl" data-part="game-menu.option-civ-ribbon" data-control="toggle" data-bind-model="state.opt.civ_ribbon" data-bind-class-toggle="on:{{state.opt.civ_ribbon}}"></button>
       <span class="lb" data-l10n="menu.opt.city.ribbon"></span><button class="tgl" data-part="game-menu.option-city-ribbon" data-control="toggle" data-bind-model="state.opt.city_ribbon" data-bind-class-toggle="on:{{state.opt.city_ribbon}}"></button>
       <span class="lb" data-l10n="menu.opt.unit.ribbon"></span><button class="tgl" data-part="game-menu.option-unit-ribbon" data-control="toggle" data-bind-model="state.opt.unit_ribbon" data-bind-class-toggle="on:{{state.opt.unit_ribbon}}"></button>
       <span class="lb" data-l10n="menu.opt.city.advisor.recs"></span><button class="tgl" data-part="game-menu.option-city-advisor-recs" data-control="toggle" data-bind-model="state.opt.city_advisor_recs" data-bind-class-toggle="on:{{state.opt.city_advisor_recs}}"></button>
       <span class="lb" data-l10n="menu.opt.auto.close.city"></span><button class="tgl" data-part="game-menu.option-auto-close-city" data-control="toggle" data-bind-model="state.opt.auto_close_city" data-bind-class-toggle="on:{{state.opt.auto_close_city}}"></button>
       <span class="lb" data-l10n="menu.opt.auto.close.tech"></span><button class="tgl" data-part="game-menu.option-auto-close-tech" data-control="toggle" data-bind-model="state.opt.auto_close_tech" data-bind-class-toggle="on:{{state.opt.auto_close_tech}}"></button>
       <span class="lb" data-l10n="menu.opt.clock"></span><button class="tgl" data-part="game-menu.option-clock" data-control="toggle" data-bind-model="state.opt.clock" data-bind-class-toggle="on:{{state.opt.clock}}"></button>
       <span class="lb" data-l10n="menu.opt.all.great.people"></span><button class="tgl" data-part="game-menu.option-all-great-people" data-control="toggle" data-bind-model="state.opt.all_great_people" data-bind-class-toggle="on:{{state.opt.all_great_people}}"></button>
       <span class="lb" data-l10n="menu.opt.warn.unassigned"></span><button class="tgl" data-part="game-menu.option-warn-unassigned" data-control="toggle" data-bind-model="state.opt.warn_unassigned" data-bind-class-toggle="on:{{state.opt.warn_unassigned}}"></button>
       <span class="lb" data-l10n="menu.opt.no.basic.help"></span><button class="tgl" data-part="game-menu.option-no-basic-help" data-control="toggle" data-bind-model="state.opt.no_basic_help" data-bind-class-toggle="on:{{state.opt.no_basic_help}}"></button>
       <span class="lb" data-l10n="menu.opt.scroll.inertia"></span><button class="tgl" data-part="game-menu.option-scroll-inertia" data-control="toggle" data-bind-model="state.opt.scroll_inertia" data-bind-class-toggle="on:{{state.opt.scroll_inertia}}"></button>
       <span class="lb" data-l10n="menu.opt.zoom.dynamic"></span><button class="tgl" data-part="game-menu.option-zoom-dynamic" data-control="toggle" data-bind-model="state.opt.zoom_dynamic" data-bind-class-toggle="on:{{state.opt.zoom_dynamic}}"></button>
       <span class="lb" data-l10n="menu.opt.tooltip.delay"></span><input class="field n gm-num" type="number" min="0" max="5000" step="1" data-bind-model="state.opt.tooltip_delay">
       <span class="lb" data-l10n="menu.opt.tooltip.delay.ext"></span><input class="field n gm-num" type="number" min="0" max="10000" step="1" data-bind-model="state.opt.tooltip_delay_ext">
       <span class="lb" data-l10n="menu.opt.ui.scale"></span><input class="field n gm-num" type="number" min="75" max="150" step="1" data-bind-model="state.opt.ui_scale">
  </div>
  <div class="wbd" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options &amp;&amp; state.opt.tab == 'hotkeys'}}">
   <div class="why" data-l10n="menu.hotkeys.reason"></div>
   <div class="gm-hk" data-bind-for="g:{{game_menu.hotkeys}}"><div class="sect lg" data-bind-value="{{g.name}}"></div><div class="kv"><div class="r" data-bind-for="a:{{g.actions}}"><span class="k" data-bind-value="{{a.name}}"></span><b class="key" data-bind-value="{{a.default}}"></b></div></div></div>
  </div>
  <div class="wft" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options}}"><button class="btn c" data-part="game-menu.cancel" data-on-click="call menu.cancel()" data-l10n="menu.cancel"></button><button class="btn primary c" data-part="game-menu.accept" data-on-click="call menu.accept()" data-l10n="menu.accept"></button></div>
 </section>
</div>
