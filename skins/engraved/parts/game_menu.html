<div class="wlayer dimmed" data-part="game-menu" data-screen="game_menu" data-esc="intent window.close(window: 'game_menu')" data-bind-if="{{ui.windows.game_menu.open}}">
 <section class="win pop w-xl gm-win">
  <div class="hd">
   <img class="gi s48" data-bind-if="{{game_menu != null}}" data-bind-src="{{game_menu.player.civ_icon}}">
   <div class="ttl stack"><span class="kick" data-bind-if="{{game_menu != null}}" data-bind-value="{{game_menu.turn}}"></span><b data-bind-if="{{!state.menu.options}}" data-l10n="menu.title"></b><b data-bind-if="{{state.menu.options}}" data-l10n="menu.options"></b></div>
   <div class="close"><span class="key" data-l10n="key.escape">Esc</span><button class="x" data-on-click="intent window.close(window: 'game_menu')"><svg class="i"><use href="#i-close"/></svg></button></div>
  </div>
  <div class="wbd empty" data-bind-if="{{game_menu == null}}" data-l10n="menu.loading"></div>
  <div class="gm" data-bind-if="{{game_menu != null &amp;&amp; !state.menu.options}}">
   <div class="side">
    <div class="who lg"><img class="gi s80 round" data-bind-src="{{game_menu.player.leader_icon}}"><span class="tx"><b data-part="game-menu.leader" data-bind-value="{{game_menu.player.leader}}"></b><span data-bind-value="{{game_menu.player.civ}}"></span><span data-bind-value="{{game_menu.player.trait.short}}"></span></span></div>
    <div class="setic"><div class="c" data-bind-for="s:{{game_menu.settings}}"><b data-bind-value="{{s.value}}"></b><span data-bind-value="{{s.label}}"></span></div></div>
    <div class="btns col gm-list">
     <button class="btn primary" data-part="game-menu.return" data-bind-hotkey="'Enter'" data-on-click="intent window.close(window: 'game_menu')"><span data-l10n="menu.return"></span><span class="key" data-hotkey-label>Enter</span></button>
     <button class="btn" data-part="game-menu.save" data-bind-disabled="{{!game_menu.can_save || !session.is_host}}" data-on-click="intent session.op(op: 'save')" data-l10n="menu.save"></button>
     <span class="why" data-bind-if="{{!session.is_host}}" data-l10n="menu.save.host"></span>
     <div class="why neg" data-part="game-menu.refused" data-bind-for="e:{{ui.errors}}" data-bind-filter="{{e.kind == 'rejected' || e.why == 'not_host'}}"><span data-bind-if="{{e.why == 'not_host'}}" data-l10n="menu.refused.host"></span><span data-bind-if="{{e.why != 'not_host'}}" data-l10n="menu.refused"></span></div>
     <button class="btn" data-part="game-menu.options" data-on-click="intent options.edit(); set state.opt.tab = 'general'; set state.menu.options = true" data-l10n="menu.options"></button>
     <button class="btn danger" data-part="game-menu.exit" data-bind-if="{{!state.menu.exit}}" data-l10n="menu.exit" data-on-click="set state.menu.exit = true"></button>
     <div class="btns col" data-bind-if="{{state.menu.exit}}"><span class="why" data-l10n="menu.exit.ask"></span><button class="btn" data-part="game-menu.exit-no" data-l10n="menu.cancel" data-on-click="set state.menu.exit = false"></button><button class="btn danger" data-part="game-menu.exit-yes" data-l10n="menu.exit" data-on-click="intent session.op(op: 'leave'); set state.menu.exit = false"></button></div>
    </div>
   </div>
   <div class="det">
    <div class="tabs band"><button class="tab" data-bind-class-toggle="on:{{state.menu.panel == 'details'}}" data-l10n="menu.details" data-on-click="set state.menu.panel = 'details'"></button><button class="tab" data-bind-class-toggle="on:{{state.menu.panel == 'mods'}}" data-bind-if="{{len(game_menu.mods) &gt; 0}}" data-on-click="set state.menu.panel = 'mods'"><span data-l10n="menu.mods"></span><span class="cnt" data-bind-value="{{len(game_menu.mods)}}"></span></button></div>
    <div class="wbd" data-bind-if="{{state.menu.panel == 'details'}}">
     <div class="kv"><div class="r" data-bind-for="d:{{game_menu.details}}"><span class="k" data-bind-value="{{d.label}}"></span><b data-bind-value="{{d.value}}"></b></div></div>
     <div class="sect"><span data-l10n="menu.victories"></span><i class="rule"></i></div><div class="chips"><span class="chip" data-bind-for="v:{{game_menu.victories}}" data-bind-value="{{v.name}}"></span></div>
     <div class="sect"><span data-l10n="menu.rules"></span><i class="rule"></i></div><div class="chips"><span class="chip" data-bind-for="o:{{game_menu.game_options}}" data-bind-value="{{o.name}}"></span></div>
     <div class="btns" data-bind-if="{{session.is_host}}"><button class="btn sm" data-part="game-menu.pause" data-bind-if="{{!session.paused}}" data-l10n="menu.pause" data-on-click="intent session.op(op: 'pause')"></button><button class="btn sm primary" data-part="game-menu.resume" data-bind-if="{{session.paused}}" data-l10n="menu.resume" data-on-click="intent session.op(op: 'resume')"></button></div>
     <div class="sect"><span data-l10n="menu.saves"></span><i class="rule"></i></div>
     <div class="empty" data-bind-if="{{len(session.saves) == 0}}" data-l10n="menu.saves.none"></div>
     <div class="kv"><div class="r" data-part="game-menu.save-row" data-bind-for="v:{{session.saves}}"><span class="k" data-bind-value="{{v.name}}"></span><b data-l10n="menu.saves.turn" data-l10n-args="{{v.turn}}"></b></div></div>
    </div>
    <div class="wbd" data-bind-if="{{state.menu.panel == 'mods'}}"><div class="kv"><div class="r" data-bind-for="m:{{game_menu.mods}}"><span class="k" data-bind-value="{{m.name}}"></span><b data-bind-value="{{m.version}}"></b></div></div></div>
   </div>
  </div>
  <div class="tabs band" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options}}"><button class="tab" data-bind-class-toggle="on:{{state.opt.tab == 'general'}}" data-l10n="menu.general" data-on-click="set state.opt.tab = 'general'"></button><button class="tab" data-bind-class-toggle="on:{{state.opt.tab == 'interface'}}" data-l10n="menu.interface" data-on-click="set state.opt.tab = 'interface'"></button><button class="tab" data-part="game-menu.tab-hotkeys" data-bind-class-toggle="on:{{state.opt.tab == 'hotkeys'}}" data-l10n="menu.hotkeys" data-on-click="set state.opt.tab = 'hotkeys'"></button></div>
  <!-- The client's options (ui.options: drafts until options.accept), a toggle or a stepper each. -->
  <div class="wbd gm-opts" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options &amp;&amp; state.opt.tab != 'hotkeys'}}">
   <div class="lrow" data-part="game-menu.option" data-bind-for="o:{{ui.options}}" data-bind-filter="{{o.tab == state.opt.tab}}" data-bind-class-toggle="dis:{{!o.available}}"><span class="lb" data-bind-value="{{o.name}}"></span><span class="why" data-bind-if="{{!o.available}}" data-bind-value="{{o.why}}"></span><button class="tgl" data-part="game-menu.option-toggle" data-bind-if="{{o.toggle}}" data-bind-disabled="{{!o.available}}" data-bind-class-toggle="on:{{o.value != 0}}" data-on-click="intent options.set(key: o.key, value: 1 - o.value)"></button><span class="step" data-bind-if="{{!o.toggle}}"><button class="ibtn" data-part="game-menu.option-less" data-bind-disabled="{{!o.available || o.value &lt;= o.min}}" data-l10n="menu.less" data-on-click="intent options.set(key: o.key, value: o.value - o.step)"></button><b class="field" data-part="game-menu.option-value" data-bind-value="{{o.value}}"></b><button class="ibtn" data-part="game-menu.option-more" data-bind-disabled="{{!o.available || o.value &gt;= o.max}}" data-l10n="menu.more" data-on-click="intent options.set(key: o.key, value: o.value + o.step)"></button></span></div>
   <div class="lrow dis" data-bind-if="{{state.opt.tab == 'general'}}"><span class="lb" data-l10n="menu.quick"></span><span class="why" data-bind-value="{{game_menu.options.quick_locked_reason}}"></span></div>
  </div>
  <div class="wbd gm-opts" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options &amp;&amp; state.opt.tab == 'hotkeys'}}">
   <div class="why neg" data-part="game-menu.hotkey-clash" data-bind-if="{{ui.hotkey_clash != null}}" data-l10n="menu.hotkeys.clash" data-l10n-args="{{ui.hotkey_clash}}"></div>
   <div class="lrow" data-part="game-menu.hotkey" data-bind-for="k:{{ui.hotkeys}}" data-bind-class-toggle="bad:{{k.key == ui.hotkey_clash}}"><span class="lb" data-bind-value="{{k.name}}"></span><span class="why" data-bind-if="{{k.more &gt; 0}}" data-l10n="menu.hotkeys.more" data-l10n-args="{{k.more}}"></span><button class="btn sm" data-part="game-menu.hotkey-key" data-bind-disabled="{{k.fixed}}" data-on-click="intent hotkey.capture(id: k.id)"><span data-bind-if="{{ui.hotkey_capture != k.id}}" data-bind-value="{{k.label}}"></span><span data-bind-if="{{ui.hotkey_capture == k.id}}" data-l10n="menu.hotkeys.press"></span></button><button class="btn sm" data-part="game-menu.hotkey-default" data-bind-if="{{k.key != k.id}}" data-l10n="menu.hotkeys.default" data-on-click="intent hotkey.clear(id: k.id)"></button></div>
  </div>
  <div class="wft" data-bind-if="{{game_menu != null &amp;&amp; state.menu.options}}"><button class="btn c" data-part="game-menu.reset" data-l10n="menu.reset" data-on-click="intent options.reset()"></button><span class="spacer"></span><button class="btn c" data-part="game-menu.cancel" data-on-click="intent options.cancel(); set state.menu.options = false" data-l10n="menu.cancel"></button><button class="btn primary c" data-part="game-menu.accept" data-on-click="intent options.accept(); set state.menu.options = false" data-l10n="menu.accept"></button></div>
 </section>
</div>
