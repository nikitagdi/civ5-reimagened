<div class="game-menu-screen" data-part="game-menu" data-screen="game_menu" data-esc="intent window.close(window: 'game_menu')" data-bind-if="{{ui.windows.game_menu.open}}">
 <section class="game-menu-window">
  <div class="game-menu-head"><div class="game-menu-titles"><span class="game-menu-kicker" data-bind-if="{{game_menu != null}}" data-bind-value="{{game_menu.turn}}"></span><span class="game-menu-title" data-l10n="menu.title"></span></div><button class="game-menu-button" data-l10n="menu.close" data-on-click="intent window.close(window: 'game_menu')"></button></div>
  <div class="game-menu-body" data-bind-if="{{game_menu == null}}" data-l10n="menu.loading"></div>
  <div class="game-menu-content" data-bind-if="{{game_menu != null}}">
   <div class="game-menu-layout" data-bind-if="{{!state.menu.options}}">
    <div class="game-menu-side">
     <img class="game-menu-icon" data-bind-src="{{game_menu.player.leader_icon}}">
     <span class="game-menu-title" data-part="game-menu.leader" data-bind-value="{{game_menu.player.leader}}"></span>
     <span data-bind-value="{{game_menu.player.civ}}"></span><span class="game-menu-trait" data-bind-value="{{game_menu.player.trait.short}}"></span>
     <div data-bind-for="s:{{game_menu.settings}}" class="game-menu-row"><span data-bind-value="{{s.label}}"></span><b data-bind-value="{{s.value}}"></b></div>
     <button class="game-menu-button game-menu-primary" data-part="game-menu.return" data-bind-hotkey="'Enter'" data-l10n="menu.return" data-on-click="intent window.close(window: 'game_menu')"></button>
     <button class="game-menu-button" data-part="game-menu.save" data-bind-disabled="{{!game_menu.can_save || !session.is_host}}" data-l10n="menu.save" data-on-click="intent session.op(op: 'save')"></button>
     <span class="game-menu-kicker" data-bind-if="{{!session.is_host}}" data-l10n="menu.save.host"></span>
     <div class="game-menu-kicker" data-part="game-menu.refused" data-bind-for="e:{{ui.errors}}" data-bind-filter="{{e.kind == 'rejected' || e.why == 'not_host'}}"><span data-bind-if="{{e.why == 'not_host'}}" data-l10n="menu.refused.host"></span><span data-bind-if="{{e.why != 'not_host'}}" data-l10n="menu.refused"></span></div>
     <button class="game-menu-button" data-part="game-menu.options" data-l10n="menu.options" data-on-click="intent options.edit(); set state.opt.tab = 'general'; set state.menu.options = true"></button>
     <button class="game-menu-button" data-part="game-menu.exit" data-bind-if="{{!state.menu.exit}}" data-l10n="menu.exit" data-on-click="set state.menu.exit = true"></button>
     <div class="game-menu-ask" data-bind-if="{{state.menu.exit}}"><span class="game-menu-kicker" data-l10n="menu.exit.ask"></span><button class="game-menu-button" data-part="game-menu.exit-no" data-l10n="menu.cancel" data-on-click="set state.menu.exit = false"></button><button class="game-menu-button game-menu-primary" data-part="game-menu.exit-yes" data-l10n="menu.exit" data-on-click="intent session.op(op: 'leave'); set state.menu.exit = false"></button></div>
    </div>
    <div class="game-menu-main">
     <div class="game-menu-tabs"><button class="game-menu-tab" data-l10n="menu.details" data-on-click="set state.menu.panel = 'details'"></button><button class="game-menu-tab" data-bind-if="{{len(game_menu.mods) &gt; 0}}" data-l10n="menu.mods" data-on-click="set state.menu.panel = 'mods'"></button></div>
     <div class="game-menu-body" data-bind-if="{{state.menu.panel == 'details'}}">
      <div><div class="game-menu-row" data-bind-for="d:{{game_menu.details}}"><span data-bind-value="{{d.label}}"></span><b data-bind-value="{{d.value}}"></b></div></div>
      <span class="game-menu-kicker" data-l10n="menu.victories"></span><div><span class="game-menu-row" data-bind-for="v:{{game_menu.victories}}" data-bind-value="{{v.name}}"></span></div>
      <span class="game-menu-kicker" data-l10n="menu.rules"></span><div><span class="game-menu-row" data-bind-for="o:{{game_menu.game_options}}" data-bind-value="{{o.name}}"></span></div>
      <div class="game-menu-row"><button class="game-menu-button" data-part="game-menu.pause" data-bind-if="{{session.is_host &amp;&amp; !session.paused}}" data-l10n="menu.pause" data-on-click="intent session.op(op: 'pause')"></button><button class="game-menu-button" data-part="game-menu.resume" data-bind-if="{{session.is_host &amp;&amp; session.paused}}" data-l10n="menu.resume" data-on-click="intent session.op(op: 'resume')"></button></div><span class="game-menu-kicker" data-l10n="menu.saves"></span><span class="game-menu-row" data-bind-if="{{len(session.saves) == 0}}" data-l10n="menu.saves.none"></span><div><div class="game-menu-row" data-part="game-menu.save-row" data-bind-for="v:{{session.saves}}"><span data-bind-value="{{v.name}}"></span><b data-l10n="menu.saves.turn" data-l10n-args="{{v.turn}}"></b></div></div>
     </div>
     <div class="game-menu-body" data-bind-if="{{state.menu.panel == 'mods'}}"><div data-bind-for="m:{{game_menu.mods}}" class="game-menu-row"><span data-bind-value="{{m.name}}"></span><span data-bind-value="{{m.version}}"></span></div></div>
    </div>
   </div>
   <div class="game-menu-options" data-bind-if="{{state.menu.options}}">
    <div class="game-menu-tabs"><button class="game-menu-tab" data-bind-class-toggle="game-menu-active:{{state.opt.tab == 'general'}}" data-l10n="menu.general" data-on-click="set state.opt.tab = 'general'"></button><button class="game-menu-tab" data-bind-class-toggle="game-menu-active:{{state.opt.tab == 'interface'}}" data-l10n="menu.interface" data-on-click="set state.opt.tab = 'interface'"></button><button class="game-menu-tab" data-part="game-menu.tab-hotkeys" data-bind-class-toggle="game-menu-active:{{state.opt.tab == 'hotkeys'}}" data-l10n="menu.hotkeys" data-on-click="set state.opt.tab = 'hotkeys'"></button></div>
    <div class="game-menu-body" data-bind-if="{{state.opt.tab != 'hotkeys'}}">
     <div class="game-menu-row" data-part="game-menu.option" data-bind-for="o:{{ui.options}}" data-bind-filter="{{o.tab == state.opt.tab}}"><span data-bind-value="{{o.name}}"></span><button class="game-menu-toggle" data-part="game-menu.option-toggle" data-bind-if="{{o.toggle}}" data-bind-disabled="{{!o.available}}" data-bind-class-toggle="game-menu-on:{{o.value != 0}}" data-on-click="intent options.set(key: o.key, value: 1 - o.value)"></button><span class="game-menu-steps" data-bind-if="{{!o.toggle}}"><button class="game-menu-button" data-part="game-menu.option-less" data-bind-disabled="{{!o.available || o.value &lt;= o.min}}" data-l10n="menu.less" data-on-click="intent options.set(key: o.key, value: o.value - o.step)"></button><b data-part="game-menu.option-value" data-bind-value="{{o.value}}"></b><button class="game-menu-button" data-part="game-menu.option-more" data-bind-disabled="{{!o.available || o.value &gt;= o.max}}" data-l10n="menu.more" data-on-click="intent options.set(key: o.key, value: o.value + o.step)"></button></span><span class="game-menu-kicker" data-bind-if="{{!o.available}}" data-bind-value="{{o.why}}"></span></div>
     <div class="game-menu-row" data-bind-if="{{state.opt.tab == 'general'}}"><span data-l10n="menu.quick"></span><span data-bind-value="{{game_menu.options.quick_locked_reason}}"></span></div>
    </div>
    <div class="game-menu-body" data-bind-if="{{state.opt.tab == 'hotkeys'}}">
     <span class="game-menu-kicker" data-part="game-menu.hotkey-clash" data-bind-if="{{ui.hotkey_clash != null}}" data-l10n="menu.hotkeys.clash" data-l10n-args="{{ui.hotkey_clash}}"></span>
     <div class="game-menu-row" data-part="game-menu.hotkey" data-bind-for="k:{{ui.hotkeys}}" data-bind-class-toggle="game-menu-active:{{k.key == ui.hotkey_clash}}"><span data-bind-value="{{k.name}}"></span><span class="game-menu-kicker" data-bind-if="{{k.more &gt; 0}}" data-l10n="menu.hotkeys.more" data-l10n-args="{{k.more}}"></span><button class="game-menu-button" data-part="game-menu.hotkey-key" data-bind-disabled="{{k.fixed}}" data-on-click="intent hotkey.capture(id: k.id)"><span data-bind-if="{{ui.hotkey_capture != k.id}}" data-bind-value="{{k.label}}"></span><span data-bind-if="{{ui.hotkey_capture == k.id}}" data-l10n="menu.hotkeys.press"></span></button><button class="game-menu-button" data-part="game-menu.hotkey-default" data-bind-if="{{k.key != k.id}}" data-l10n="menu.hotkeys.default" data-on-click="intent hotkey.clear(id: k.id)"></button></div>
    </div>
    <div class="game-menu-foot"><button class="game-menu-button" data-part="game-menu.reset" data-l10n="menu.reset" data-on-click="intent options.reset()"></button><button class="game-menu-button" data-part="game-menu.cancel" data-l10n="menu.cancel" data-on-click="intent options.cancel(); set state.menu.options = false"></button><button class="game-menu-button game-menu-primary" data-part="game-menu.accept" data-l10n="menu.accept" data-on-click="intent options.accept(); set state.menu.options = false"></button></div>
   </div>
  </div>
 </section>
</div>
