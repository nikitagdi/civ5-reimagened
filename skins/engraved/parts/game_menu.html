<div class="game-menu-screen" data-part="game-menu" data-screen="game-menu" data-esc="intent window.close(window: 'game_menu')" data-bind-if="{{ui.windows.game_menu.open}}">
 <section class="game-menu-window">
  <div class="game-menu-head"><div class="game-menu-titles"><span class="game-menu-kicker" data-bind-if="{{game_menu != null}}" data-bind-value="{{game_menu.turn}}"></span><span class="game-menu-title" data-l10n="menu.title"></span></div><button class="game-menu-button" data-l10n="menu.close" data-on-click="intent window.close(window: 'game_menu')"></button></div>
  <div class="game-menu-body" data-bind-if="{{game_menu == null}}" data-l10n="menu.loading"></div>
  <div class="game-menu-content" data-bind-if="{{game_menu != null}}">
   <div class="game-menu-layout" data-bind-if="{{!state.menu.options}}">
    <div class="game-menu-side">
     <img class="game-menu-icon" data-bind-src="{{game_menu.player.leader_icon}}">
     <span class="game-menu-title" data-part="game-menu.leader" data-bind-value="{{game_menu.player.leader}}"></span>
     <span data-bind-value="{{game_menu.player.civ}}"></span><span class="game-menu-trait" data-bind-value="{{game_menu.player.trait.short}}"></span>
     <div data-bind-for="s:{{game_menu.settings}}" class="game-menu-row"><span data-bind-value="{{s.label}}"></span><b data-bind-value="{{s.value}}"></b></div>
     <button class="game-menu-button game-menu-primary" data-part="game-menu.return" data-hotkey="Enter" data-l10n="menu.return" data-on-click="intent window.close(window: 'game_menu')"></button>
     <button class="game-menu-button" data-bind-disabled="{{!game_menu.can_save}}" data-l10n="menu.save" data-on-click="intent screen.act(screen: 'game_menu', action: 'save')"></button>
     <span class="game-menu-kicker" data-bind-value="{{game_menu.save_reason}}"></span>
     <button class="game-menu-button" data-part="game-menu.options" data-l10n="menu.options" data-on-click="call menu.open()"></button>
     <button class="game-menu-button" disabled data-l10n="menu.exit"></button><span class="game-menu-kicker" data-l10n="menu.exit.reason"></span>
    </div>
    <div class="game-menu-main">
     <div class="game-menu-tabs"><button class="game-menu-tab" data-l10n="menu.details" data-on-click="set state.menu.panel = 'details'"></button><button class="game-menu-tab" data-bind-if="{{len(game_menu.mods) &gt; 0}}" data-l10n="menu.mods" data-on-click="set state.menu.panel = 'mods'"></button></div>
     <div class="game-menu-body" data-bind-if="{{state.menu.panel == 'details'}}">
      <div><div class="game-menu-row" data-bind-for="d:{{game_menu.details}}"><span data-bind-value="{{d.label}}"></span><b data-bind-value="{{d.value}}"></b></div></div>
      <span class="game-menu-kicker" data-l10n="menu.victories"></span><div><span class="game-menu-row" data-bind-for="v:{{game_menu.victories}}" data-bind-value="{{v.name}}"></span></div>
      <span class="game-menu-kicker" data-l10n="menu.rules"></span><div><span class="game-menu-row" data-bind-for="o:{{game_menu.game_options}}" data-bind-value="{{o.name}}"></span></div>
     </div>
     <div class="game-menu-body" data-bind-if="{{state.menu.panel == 'mods'}}"><div data-bind-for="m:{{game_menu.mods}}" class="game-menu-row"><span data-bind-value="{{m.name}}"></span><span data-bind-value="{{m.version}}"></span></div></div>
    </div>
   </div>
   <div class="game-menu-options" data-bind-if="{{state.menu.options}}">
    <div class="game-menu-tabs"><button class="game-menu-tab" data-bind-class-toggle="game-menu-active:{{state.opt.tab == 'general'}}" data-l10n="menu.general" data-on-click="set state.opt.tab = 'general'"></button><button class="game-menu-tab" data-bind-class-toggle="game-menu-active:{{state.opt.tab == 'interface'}}" data-l10n="menu.interface" data-on-click="set state.opt.tab = 'interface'"></button><button class="game-menu-tab" data-bind-class-toggle="game-menu-active:{{state.opt.tab == 'hotkeys'}}" data-l10n="menu.hotkeys" data-on-click="set state.opt.tab = 'hotkeys'"></button></div><div class="game-menu-body" data-bind-if="{{state.opt.tab == 'general'}}"><div class="game-menu-row"><span data-l10n="menu.opt.auto.end.turn"></span><button class="game-menu-toggle" data-part="game-menu.option-auto-end-turn" data-control="toggle" data-bind-model="state.opt.auto_end_turn" data-bind-class-toggle="game-menu-on:{{state.opt.auto_end_turn}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.auto.end.turn.sp"></span><button class="game-menu-toggle" data-part="game-menu.option-auto-end-turn-sp" data-control="toggle" data-bind-model="state.opt.auto_end_turn_sp" data-bind-class-toggle="game-menu-on:{{state.opt.auto_end_turn_sp}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.next.unit.after.orders"></span><button class="game-menu-toggle" data-part="game-menu.option-next-unit-after-orders" data-control="toggle" data-bind-model="state.opt.next_unit_after_orders" data-bind-class-toggle="game-menu-on:{{state.opt.next_unit_after_orders}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.auto.unit.cycle"></span><button class="game-menu-toggle" data-part="game-menu.option-auto-unit-cycle" data-control="toggle" data-bind-model="state.opt.auto_unit_cycle" data-bind-class-toggle="game-menu-on:{{state.opt.auto_unit_cycle}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.air.rebase.rmb"></span><button class="game-menu-toggle" data-part="game-menu.option-air-rebase-rmb" data-control="toggle" data-bind-model="state.opt.air_rebase_rmb" data-bind-class-toggle="game-menu-on:{{state.opt.air_rebase_rmb}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.civilian.yields"></span><button class="game-menu-toggle" data-part="game-menu.option-civilian-yields" data-control="toggle" data-bind-model="state.opt.civilian_yields" data-bind-class-toggle="game-menu-on:{{state.opt.civilian_yields}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.workers.keep.improvements"></span><button class="game-menu-toggle" data-part="game-menu.option-workers-keep-improvements" data-control="toggle" data-bind-model="state.opt.workers_keep_improvements" data-bind-class-toggle="game-menu-on:{{state.opt.workers_keep_improvements}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.workers.keep.features"></span><button class="game-menu-toggle" data-part="game-menu.option-workers-keep-features" data-control="toggle" data-bind-model="state.opt.workers_keep_features" data-bind-class-toggle="game-menu-on:{{state.opt.workers_keep_features}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.no.tile.recs"></span><button class="game-menu-toggle" data-part="game-menu.option-no-tile-recs" data-control="toggle" data-bind-model="state.opt.no_tile_recs" data-bind-class-toggle="game-menu-on:{{state.opt.no_tile_recs}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.skip.reward.popups"></span><button class="game-menu-toggle" data-part="game-menu.option-skip-reward-popups" data-control="toggle" data-bind-model="state.opt.skip_reward_popups" data-bind-class-toggle="game-menu-on:{{state.opt.skip_reward_popups}}"></button></div><label class="game-menu-row"><span data-l10n="menu.opt.music"></span><input class="game-menu-input" type="number" min="0" max="100" step="1" data-bind-model="state.opt.music"></label><label class="game-menu-row"><span data-l10n="menu.opt.effects"></span><input class="game-menu-input" type="number" min="0" max="100" step="1" data-bind-model="state.opt.effects"></label><label class="game-menu-row"><span data-l10n="menu.opt.ambience"></span><input class="game-menu-input" type="number" min="0" max="100" step="1" data-bind-model="state.opt.ambience"></label><label class="game-menu-row"><span data-l10n="menu.opt.speech"></span><input class="game-menu-input" type="number" min="0" max="100" step="1" data-bind-model="state.opt.speech"></label><div class="game-menu-row"><span data-l10n="menu.quick"></span><span data-bind-value="{{game_menu.options.quick_locked_reason}}"></span></div></div><div class="game-menu-body" data-bind-if="{{state.opt.tab == 'interface'}}"><div class="game-menu-row"><span data-l10n="menu.opt.policy.info.full"></span><button class="game-menu-toggle" data-part="game-menu.option-policy-info-full" data-control="toggle" data-bind-model="state.opt.policy_info_full" data-bind-class-toggle="game-menu-on:{{state.opt.policy_info_full}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.score.list"></span><button class="game-menu-toggle" data-part="game-menu.option-score-list" data-control="toggle" data-bind-model="state.opt.score_list" data-bind-class-toggle="game-menu-on:{{state.opt.score_list}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.civ.ribbon"></span><button class="game-menu-toggle" data-part="game-menu.option-civ-ribbon" data-control="toggle" data-bind-model="state.opt.civ_ribbon" data-bind-class-toggle="game-menu-on:{{state.opt.civ_ribbon}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.city.ribbon"></span><button class="game-menu-toggle" data-part="game-menu.option-city-ribbon" data-control="toggle" data-bind-model="state.opt.city_ribbon" data-bind-class-toggle="game-menu-on:{{state.opt.city_ribbon}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.unit.ribbon"></span><button class="game-menu-toggle" data-part="game-menu.option-unit-ribbon" data-control="toggle" data-bind-model="state.opt.unit_ribbon" data-bind-class-toggle="game-menu-on:{{state.opt.unit_ribbon}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.city.advisor.recs"></span><button class="game-menu-toggle" data-part="game-menu.option-city-advisor-recs" data-control="toggle" data-bind-model="state.opt.city_advisor_recs" data-bind-class-toggle="game-menu-on:{{state.opt.city_advisor_recs}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.auto.close.city"></span><button class="game-menu-toggle" data-part="game-menu.option-auto-close-city" data-control="toggle" data-bind-model="state.opt.auto_close_city" data-bind-class-toggle="game-menu-on:{{state.opt.auto_close_city}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.auto.close.tech"></span><button class="game-menu-toggle" data-part="game-menu.option-auto-close-tech" data-control="toggle" data-bind-model="state.opt.auto_close_tech" data-bind-class-toggle="game-menu-on:{{state.opt.auto_close_tech}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.clock"></span><button class="game-menu-toggle" data-part="game-menu.option-clock" data-control="toggle" data-bind-model="state.opt.clock" data-bind-class-toggle="game-menu-on:{{state.opt.clock}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.all.great.people"></span><button class="game-menu-toggle" data-part="game-menu.option-all-great-people" data-control="toggle" data-bind-model="state.opt.all_great_people" data-bind-class-toggle="game-menu-on:{{state.opt.all_great_people}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.warn.unassigned"></span><button class="game-menu-toggle" data-part="game-menu.option-warn-unassigned" data-control="toggle" data-bind-model="state.opt.warn_unassigned" data-bind-class-toggle="game-menu-on:{{state.opt.warn_unassigned}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.no.basic.help"></span><button class="game-menu-toggle" data-part="game-menu.option-no-basic-help" data-control="toggle" data-bind-model="state.opt.no_basic_help" data-bind-class-toggle="game-menu-on:{{state.opt.no_basic_help}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.scroll.inertia"></span><button class="game-menu-toggle" data-part="game-menu.option-scroll-inertia" data-control="toggle" data-bind-model="state.opt.scroll_inertia" data-bind-class-toggle="game-menu-on:{{state.opt.scroll_inertia}}"></button></div><div class="game-menu-row"><span data-l10n="menu.opt.zoom.dynamic"></span><button class="game-menu-toggle" data-part="game-menu.option-zoom-dynamic" data-control="toggle" data-bind-model="state.opt.zoom_dynamic" data-bind-class-toggle="game-menu-on:{{state.opt.zoom_dynamic}}"></button></div><label class="game-menu-row"><span data-l10n="menu.opt.tooltip.delay"></span><input class="game-menu-input" type="number" min="0" max="5000" step="1" data-bind-model="state.opt.tooltip_delay"></label><label class="game-menu-row"><span data-l10n="menu.opt.tooltip.delay.ext"></span><input class="game-menu-input" type="number" min="0" max="10000" step="1" data-bind-model="state.opt.tooltip_delay_ext"></label><label class="game-menu-row"><span data-l10n="menu.opt.ui.scale"></span><input class="game-menu-input" type="number" min="75" max="150" step="1" data-bind-model="state.opt.ui_scale"></label></div><div class="game-menu-body" data-bind-if="{{state.opt.tab == 'hotkeys'}}"><span class="game-menu-prose" data-l10n="menu.hotkeys.reason"></span><div data-bind-for="g:{{game_menu.hotkeys}}"><b data-bind-value="{{g.name}}"></b><div data-bind-for="a:{{g.actions}}" class="game-menu-row"><span data-bind-value="{{a.name}}"></span><span data-bind-value="{{a.default}}"></span></div></div></div>
    <div class="game-menu-foot"><button class="game-menu-button" data-part="game-menu.cancel" data-l10n="menu.cancel" data-on-click="call menu.cancel()"></button><button class="game-menu-button game-menu-primary" data-part="game-menu.accept" data-l10n="menu.accept" data-on-click="call menu.accept()"></button></div>
   </div>
  </div>
 </section>
</div>
