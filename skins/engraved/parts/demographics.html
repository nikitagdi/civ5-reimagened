<div class="ovl" data-part="demographics" data-screen="demographics" data-bind-if="{{ui.windows.demographics.open}}">
<div class="wlayer" data-bind-if="{{demographics == null || !(demographics.whos_winning != null && ui.windows.demographics.a == 1)}}">
<section class="win w-demo" role="dialog" data-part="demographics.window">
<div class="hd">
<img class="gi s48" data-bind-if="{{demographics != null}}" data-bind-src="{{demographics.player.icon}}">
<div class="ttl"><b data-l10n="demographics.title"></b></div>
<div class="facts" data-bind-if="{{demographics != null}}"><span><b data-bind-value="{{demographics.participants}}"></b><span data-l10n="demographics.compared"></span></span></div>
<div class="close"><span class="key" data-l10n="key.escape"></span><button class="x" data-part="demographics.close" data-bind-hotkey="{{'Enter'}}" data-on-click="intent window.close(window: 'demographics')"><svg class="i"><use href="#i-close"/></svg></button></div>
</div>
<div class="empty" data-l10n="demographics.loading" data-bind-if="{{demographics == null}}"></div>
<div class="tbl t-demo" data-bind-if="{{demographics != null}}">
<div class="thead"><span class="h" data-l10n="demographics.column_metric"></span><span class="h" data-l10n="demographics.column_rank"></span><span class="h" data-l10n="demographics.column_own"></span><span class="h" data-l10n="demographics.column_best"></span><span class="h" data-l10n="demographics.column_average"></span><span class="h" data-l10n="demographics.column_worst"></span></div>
<div class="scr">
<div class="trow" data-part="demographics.row" data-bind-for="r:{{demographics.rows}}" data-tooltip="demographics-unit-tip" data-on-pointerenter="set state.demographics.hover = r.key">
<span class="c nm"><span data-l10n="demographics.metric_population" data-bind-if="{{r.key == 'population'}}"></span><span data-l10n="demographics.metric_food" data-bind-if="{{r.key == 'food'}}"></span><span data-l10n="demographics.metric_production" data-bind-if="{{r.key == 'production'}}"></span><span data-l10n="demographics.metric_gold" data-bind-if="{{r.key == 'gold'}}"></span><span data-l10n="demographics.metric_land" data-bind-if="{{r.key == 'land'}}"></span><span data-l10n="demographics.metric_army" data-bind-if="{{r.key == 'army'}}"></span><span data-l10n="demographics.metric_approval" data-bind-if="{{r.key == 'approval'}}"></span><span data-l10n="demographics.metric_literacy" data-bind-if="{{r.key == 'literacy'}}"></span></span>
<span class="c rk"><span data-part="demographics.rank" data-bind-value="{{r.rank}}"></span><small data-l10n="demographics.shared" data-bind-if="{{r.rank_shared}}"></small></span>
<span class="c vw you"><span class="vv"><b data-part="demographics.own-value" data-bind-value="{{fmt.int(r.value)}}"></b><small data-l10n="demographics.unit_own_people" data-bind-if="{{r.unit_key == 'people'}}"></small><small data-l10n="demographics.unit_own_million_bushels" data-bind-if="{{r.unit_key == 'million_bushels'}}"></small><small data-l10n="demographics.unit_own_million_tons" data-bind-if="{{r.unit_key == 'million_tons'}}"></small><small data-l10n="demographics.unit_own_million_gold" data-bind-if="{{r.unit_key == 'million_gold'}}"></small><small data-l10n="demographics.unit_own_square_km" data-bind-if="{{r.unit_key == 'square_km'}}"></small><small data-l10n="demographics.unit_own_soldiers" data-bind-if="{{r.unit_key == 'soldiers'}}"></small><small data-l10n="demographics.unit_own_percent" data-bind-if="{{r.unit_key == 'percent'}}"></small></span></span>
<span class="c vw best"><img class="gi s24 round" data-bind-if="{{r.best.met}}" data-bind-src="{{r.best.icon}}"><span class="gl sm" data-l10n="demographics.unknown_best" data-bind-if="{{!r.best.met}}"></span><span class="vv"><b data-bind-value="{{fmt.int(r.best.value)}}"></b></span></span>
<span class="c vw avg"><span class="vv"><b data-bind-value="{{fmt.int(r.average)}}"></b></span></span>
<span class="c vw worst"><img class="gi s24 round" data-bind-if="{{r.worst.met}}" data-bind-src="{{r.worst.icon}}"><span class="gl sm" data-l10n="demographics.unknown_worst" data-bind-if="{{!r.worst.met}}"></span><span class="vv"><b data-bind-value="{{fmt.int(r.worst.value)}}"></b></span></span>
</div>
</div>
<div class="note"><span data-l10n="demographics.normal_note" data-bind-if="{{!demographics.humans_only}}"></span><span data-l10n="demographics.human_note" data-bind-if="{{demographics.humans_only}}"></span></div>
</div>
</section>
</div>
<div class="wlayer" data-bind-if="{{demographics != null && demographics.whos_winning != null && ui.windows.demographics.a == 1}}">
<section class="win pop w-m w-ww" role="dialog" data-part="demographics.winning">
<div class="hd">
<div class="ttl stack"><span class="kick"><span data-l10n="demographics.presenter_herodotus" data-bind-if="{{demographics.whos_winning.presenter_key == 'herodotus'}}"></span><span data-l10n="demographics.presenter_pliny" data-bind-if="{{demographics.whos_winning.presenter_key == 'pliny'}}"></span><span data-l10n="demographics.presenter_livy" data-bind-if="{{demographics.whos_winning.presenter_key == 'livy'}}"></span><span data-l10n="demographics.presenter_tacitus" data-bind-if="{{demographics.whos_winning.presenter_key == 'tacitus'}}"></span><span data-l10n="demographics.presenter_gibbon" data-bind-if="{{demographics.whos_winning.presenter_key == 'gibbon'}}"></span><span data-l10n="demographics.presenter_bede" data-bind-if="{{demographics.whos_winning.presenter_key == 'bede'}}"></span><span data-l10n="demographics.presenter_toynbee" data-bind-if="{{demographics.whos_winning.presenter_key == 'toynbee'}}"></span></span><b><span data-l10n="demographics.ranking_food" data-bind-if="{{demographics.whos_winning.ranking_key == 'food'}}"></span><span data-l10n="demographics.ranking_production" data-bind-if="{{demographics.whos_winning.ranking_key == 'production'}}"></span><span data-l10n="demographics.ranking_gold" data-bind-if="{{demographics.whos_winning.ranking_key == 'gold'}}"></span><span data-l10n="demographics.ranking_science" data-bind-if="{{demographics.whos_winning.ranking_key == 'science'}}"></span><span data-l10n="demographics.ranking_culture" data-bind-if="{{demographics.whos_winning.ranking_key == 'culture'}}"></span><span data-l10n="demographics.ranking_happiness" data-bind-if="{{demographics.whos_winning.ranking_key == 'happiness'}}"></span><span data-l10n="demographics.ranking_wonders" data-bind-if="{{demographics.whos_winning.ranking_key == 'wonders'}}"></span><span data-l10n="demographics.ranking_military_might" data-bind-if="{{demographics.whos_winning.ranking_key == 'military_might'}}"></span><span data-l10n="demographics.ranking_influence" data-bind-if="{{demographics.whos_winning.ranking_key == 'influence'}}"></span><span data-l10n="demographics.ranking_city_tourism" data-bind-if="{{demographics.whos_winning.ranking_key == 'city_tourism'}}"></span></b></div>
<div class="close"><span class="key" data-l10n="key.escape"></span><button class="x" data-part="demographics.close-winning" data-bind-hotkey="{{'Enter'}}" data-on-click="intent window.close(window: 'demographics')"><svg class="i"><use href="#i-close"/></svg></button></div>
</div>
<div class="tbl t-ww">
<div class="scr">
<div class="trow" data-part="demographics.winning-row" data-bind-for="r:{{demographics.whos_winning.rows}}" data-bind-class-toggle="sel:{{r.is_you}}; unk:{{!r.met}}">
<span class="c rk" data-bind-value="{{r.rank}}"></span>
<span class="c"><img class="gi s32 round" data-bind-if="{{r.met}}" data-bind-src="{{r.icon}}"></span>
<span class="c who"><span class="tx"><b data-l10n="demographics.you" data-bind-if="{{r.is_you}}"></b><b data-l10n="demographics.unknown_player" data-bind-if="{{!r.met}}"></b><b data-bind-if="{{r.met && !r.is_you}}" data-bind-value="{{r.leader_name}}"></b><span data-bind-value="{{r.civ_name}}"></span><span data-bind-value="{{r.city}}"></span></span></span>
<span class="c r val" data-bind-value="{{fmt.fixed(r.value, 1)}}"></span>
</div>
</div>
</div>
</section>
</div>
</div>
