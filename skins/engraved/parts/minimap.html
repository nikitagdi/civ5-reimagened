<div class="minimap-buttons">
  <!-- SIMPLIFIED(SIMP-442): The strategic view (the renderer has none) and timer administration have no client/session intents in this base; the map options are live (minimap_options.html). -->
  <button disabled data-tooltip="minimap-view-tip"><svg class="i"><use href="#i-hex"/></svg></button>
  <button data-part="minimap.options-toggle" data-bind-class-toggle="on:{{state.minimap.options}}" data-on-click="set state.minimap.options = !state.minimap.options" data-tooltip="minimap-options-tip"><svg class="i"><use href="#i-settings"/></svg></button>
  <button data-part="minimap.streamer-toggle" data-bind-class-toggle="on:{{state.minimap.streamer}}" data-on-click="set state.minimap.streamer = !state.minimap.streamer" data-tooltip="minimap-streamer-tip"><svg class="i"><use href="#i-stream"/></svg></button>
  <button disabled data-bind-if="{{turn.timer != null && hud != null && !hud.minimap.observer}}" data-tooltip="minimap-timer-control-tip"><svg class="i"><use href="#i-clock"/></svg></button>
</div>
