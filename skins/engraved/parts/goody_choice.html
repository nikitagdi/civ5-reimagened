<div class="wlayer dimmed" data-part="goody-choice" data-screen="goody_choice" data-bind-if="{{ui.windows.goody_choice.open}}" data-esc="none">
 <section class="win pop w-m">
  <div class="hd"><img class="gi s48" data-bind-if="{{goody_choice != null}}" data-bind-src="{{goody_choice.unit.icon}}"><div class="ttl stack"><span class="kick" data-l10n="goody.explorer"></span><b data-l10n="goody.title"></b></div></div>
  <div class="wbd" data-bind-if="{{goody_choice == null}}"><div class="prose sec" data-l10n="goody.loading"></div></div>
  <div class="scr" data-bind-if="{{goody_choice != null}}">
   <div class="prose sec gc-why" data-part="goody-choice.reason" data-bind-if="{{goody_choice.reason != null}}" data-bind-value="{{goody_choice.reason}}"></div>
   <button class="lrow gc-row" data-part="goody-choice.reward" data-bind-for="r:{{goody_choice.rewards}}" data-bind-class-toggle="sel:{{state.goody.sel == r.id}}" data-on-click="set state.goody.sel = r.id">
    <span class="radio" data-bind-class-toggle="on:{{state.goody.sel == r.id}}"><i></i></span><img class="gi s45 round" data-bind-src="{{r.icon}}">
    <span class="ds"><span class="ln"><span data-bind-for="p:{{r.parts}}" class="ln"><span data-bind-value="{{p.text}}"></span><img class="gi s16" data-bind-if="{{p.icon != null}}" data-bind-src="{{p.icon}}"></span></span><small data-bind-value="{{r.sub}}"></small></span>
   </button>
  </div>
  <div class="wft" data-bind-if="{{goody_choice != null}}"><span class="note" data-bind-if="{{state.goody.sel &lt; 0}}" data-l10n="goody.pick"></span><span class="note" data-bind-if="{{state.goody.sel &gt;= 0}}" data-l10n="goody.required"></span><button class="btn primary c" data-part="goody-choice.take" data-bind-disabled="{{state.goody.sel &lt; 0}}" data-tooltip="goody-reason" data-on-click="intent screen.act(screen: 'goody_choice', action: 'take', a: goody_choice.id, b: state.goody.sel)" data-l10n="goody.take"></button></div>
 </section>
</div>
