<section class="helm plate tl" data-part="helm" data-bind-if="{{!ui.windows.city.open}}">
  <!-- SIMPLIFIED(SIMP-443): The session exposes a primary blocker and readiness; ordered decision targets and soft reminders need additional session data. -->
  <!-- The turn button, as the original's: what blocks the turn (or "Next turn"), how many things wait, its key and
       the thin line of the turn timer. A click (or Enter) does what it says. -->
  <button class="endturn" data-part="helm.dial" data-hotkey="Enter" data-on-click="intent turn.primary()" data-tooltip="end-turn-tip" data-bind-disabled="{{ui.turn_pending != 'none' || turn.state == 'ai_moving' || turn.state == 'game_over' || (turn.state == 'waiting_others' && !turn.can_cancel)}}" data-bind-class-toggle="et-waiting:{{turn.state == 'waiting_others' || turn.state == 'ai_moving' || turn.state == 'ended' || turn.state == 'game_over'}}; et-ready:{{turn.state == 'next_turn'}}; et-choice:{{turn.state == 'city_needs_production' || turn.state == 'research_needed' || turn.state == 'policy_needed' || turn.state == 'other_blocker'}}">
    <span class="lbl" data-part="helm.state">
      <span data-bind-if="{{turn.state == 'next_turn'}}" data-l10n="turn.next">Next turn</span>
      <span data-bind-if="{{turn.state == 'unit_needs_orders'}}" data-l10n="turn.unit">Unit needs orders</span>
      <span data-bind-if="{{turn.state == 'city_needs_production'}}" data-l10n="turn.production">Choose production</span>
      <span data-bind-if="{{turn.state == 'research_needed'}}" data-l10n="turn.research">Choose research</span>
      <span data-bind-if="{{turn.state == 'policy_needed'}}" data-l10n="turn.policy">Choose a policy</span>
      <span data-bind-if="{{turn.state == 'other_blocker'}}" data-l10n="turn.other">Something needs you</span>
      <span data-bind-if="{{turn.state == 'waiting_others'}}" data-l10n="turn.waiting">Waiting for players</span>
      <span data-bind-if="{{turn.state == 'ai_moving'}}" data-l10n="turn.ai">Other civilizations move</span>
      <span data-bind-if="{{turn.state == 'ended'}}" data-l10n="turn.ended">Turn ended</span>
      <span data-bind-if="{{turn.state == 'game_over'}}" data-l10n="turn.over">Game over</span>
    </span>
    <span class="sub" data-bind-if="{{turn.state == 'unit_needs_orders' && hud != null && len(hud.turn.waiting_units) > 0}}" data-l10n="end_turn.waiting" data-l10n-args="{{len(hud.turn.waiting_units)}}">5 waiting</span>
    <span class="key" data-hotkey-label>Enter</span>
    <span class="tl" data-bind-if="{{turn.timer != null && !turn.timer.stopped}}" data-bind-style-width="{{clamp(turn.timer.left_s / max(turn.timer.total_s, 1), 0, 1) * 100}}%"></span>
  </button>

  <!-- Who has ended the turn: one notch per human seat, and who still moves. -->
  <div class="ready" data-part="end-turn.queue">
    <span data-l10n="turn.ready">Ready</span><span data-l10n="turn.ready_of" data-l10n-args="{{turn.ready}}, {{turn.humans}}">3 of 4</span>
    <span class="notches"><i data-bind-for="s:{{turn.seats}}" data-bind-class-toggle="wait:{{!s.finished}}"></i></span>
    <span class="who" data-bind-if="{{hud != null}}"><span class="mv" data-bind-for="s:{{turn.seats}}" data-bind-filter="{{!s.finished && !s.me}}"><span data-bind-for="p:{{hud.turn.queue}}" data-bind-filter="{{p.key == s.player}}" data-bind-value="{{p.name}}"></span></span><span data-bind-if="{{turn.ready < turn.humans}}" data-l10n="end_turn.moving">moving</span></span>
  </div>

  <!-- The minimap is a picture the game draws; a press on it moves the camera (the host does that).
       SIMPLIFIED(SIMP-278): no frame of the camera's view on the minimap; the camera does not give the model the
       rectangle it sees. -->
  <div class="mmwrap">
    <div class="minimap" data-part="helm.minimap" data-slot="hud.minimap">
      <img class="mm" data-asset="render:minimap">
    </div>
    <div data-include="parts/minimap.html"></div>
  </div>
</section>
