<!-- The current research, under the strip on the left: the technology's portrait, its name, turns and a thin scale;
     with nothing researched, the call to choose. -->
<section class="rsch plate br" data-part="top.research" data-bind-if="{{!ui.windows.city.open}}" data-bind-class-toggle="choose:{{research.current == null}}">
  <button class="rsch-now" data-bind-if="{{research.current != null}}" data-bind-disabled="{{hud != null && !hud.top.science_enabled}}" data-on-click="intent window.open(window: 'techs')" data-tooltip="top-panel-tip" data-on-pointerenter="set state.top.hover = 'science'">
    <img class="rpic" data-bind-src="{{research.current.icon}}">
    <span class="b">
      <span class="l1"><span class="nm" data-bind-value="{{research.current.name}}">Education</span><span class="tn" data-bind-if="{{research.current.turns != null}}"><b data-bind-value="{{research.current.turns}}">3</b><span data-l10n="top.turns_word" data-l10n-args="{{research.current.turns}}">turns</span></span></span>
      <span class="scale">
        <span class="fill" data-bind-style-width="{{research.current.fraction * 100}}%" style="width: 62%"></span>
        <span class="ticks" data-bind-style-background-size="{{100 * (1 - research.current.fraction) / max(research.current.turns != null ? research.current.turns : 1, 1)}}% 100%" style="background-size: 12.5% 100%"></span>
      </span>
    </span>
  </button>
  <button class="rsch-pick" data-part="top.research.pick" data-bind-if="{{research.current == null}}" data-bind-disabled="{{hud != null && !hud.top.science_enabled}}" data-on-click="intent window.open(window: 'research')">
    <span class="rph"><img class="yi" data-asset="font:ICON_RESEARCH"></span>
    <span class="b">
      <span class="l1"><span class="nm" data-l10n="research.title">Choose research</span><span class="key" data-l10n="keycap.f6">F6</span></span>
      <span class="l2" data-bind-if="{{state.tech_panel.done}}" data-l10n="tech_panel.researched" data-l10n-args="{{state.tech_panel.last_name}}">Telegraph researched</span>
    </span>
  </button>
</section>
