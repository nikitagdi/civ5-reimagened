<section class="deal-panel deal-ai" data-part="deal" data-screen="deal" data-esc="intent screen.act(screen: 'deal', action: 'cancel')" data-bind-if="{{ui.windows.deal.open &amp;&amp; deal != null &amp;&amp; deal.partner != null &amp;&amp; !deal.partner.is_human}}">
<header class="deal-header"><img data-bind-src="{{deal.partner.icon}}"><b data-part="deal.partner" data-bind-value="{{deal.partner.name}}"></b><span data-bind-value="{{deal.partner.civ}}"></span><span data-bind-value="{{deal.partner.mood_label}}"></span><span data-bind-value="{{deal.partner.gold}}"></span><button data-on-click="intent screen.act(screen: 'deal', action: 'close')" data-l10n="deal.close">Close</button></header>
<div class="deal-columns"><div class="deal-pocket deal-scroll" data-bind-if="{{deal.pockets_visible.them}}"><h2 data-l10n="deal.them_items"></h2><div class="deal-category" data-bind-for="s:{{deal.pockets.them}}"><button data-bind-if="{{s.ref != null}}" data-part="deal.add-them" data-bind-disabled="{{!s.enabled || !deal.editable}}" data-on-click="intent screen.act(screen: 'deal', action: event.shift ? 'add_max' : 'add', a: 1, b: s.ref.type, c: s.ref.data1, d: s.ref.data2)"><b data-bind-value="{{s.label}}"></b><span data-bind-value="{{s.amount}}"></span></button><p class="deal-reason" data-bind-value="{{s.reason}}"></p><b data-bind-if="{{s.kind == 'list'}}" data-bind-value="{{s.label}}"></b><button data-bind-for="i:{{s.items}}" data-bind-disabled="{{!i.enabled || !deal.editable}}" data-on-click="intent screen.act(screen: 'deal', action: event.shift ? 'add_max' : 'add', a: 1, b: i.ref.type, c: i.ref.data1, d: i.ref.data2)"><img data-bind-src="{{i.icon}}"><span data-bind-value="{{i.label}}"></span><span data-bind-value="{{i.amount}}"></span><span class="deal-reason" data-bind-value="{{i.reason}}"></span></button></div></div><div class="deal-table deal-scroll"><h2 data-l10n="deal.them_gives"></h2><div class="deal-item" data-bind-for="i:{{deal.table.them}}"><img data-bind-src="{{i.icon}}"><div><b data-part="deal.item-them" data-bind-value="{{i.label}}"></b><span class="deal-reason" data-bind-value="{{i.sub}}"></span></div><button data-bind-disabled="{{!i.editable}}" data-part="deal.amount-them" data-bind-if="{{i.amount != null}}" data-on-click="set state.deal.side = 1; set state.deal.kind = i.ref.type; set state.deal.item = i.ref.data1; set state.deal.amount = i.amount"><b data-bind-value="{{i.amount}}"></b></button><span data-bind-value="{{i.duration_text}}"></span><button data-bind-disabled="{{!i.removable}}" data-on-click="intent screen.act(screen: 'deal', action: 'remove', a: 1, b: i.ref.type, c: i.ref.data1, d: i.ref.data2)" data-l10n="deal.remove">Remove</button></div></div><div class="deal-table deal-scroll"><h2 data-l10n="deal.us_gives"></h2><div class="deal-item" data-bind-for="i:{{deal.table.us}}"><img data-bind-src="{{i.icon}}"><div><b data-part="deal.item-us" data-bind-value="{{i.label}}"></b><span class="deal-reason" data-bind-value="{{i.sub}}"></span></div><button data-bind-disabled="{{!i.editable}}" data-part="deal.amount-us" data-bind-if="{{i.amount != null}}" data-on-click="set state.deal.side = 0; set state.deal.kind = i.ref.type; set state.deal.item = i.ref.data1; set state.deal.amount = i.amount"><b data-bind-value="{{i.amount}}"></b></button><span data-bind-value="{{i.duration_text}}"></span><button data-bind-disabled="{{!i.removable}}" data-on-click="intent screen.act(screen: 'deal', action: 'remove', a: 0, b: i.ref.type, c: i.ref.data1, d: i.ref.data2)" data-l10n="deal.remove">Remove</button></div></div><div class="deal-pocket deal-scroll" data-bind-if="{{deal.pockets_visible.us}}"><h2 data-l10n="deal.us_items"></h2><div class="deal-category" data-bind-for="s:{{deal.pockets.us}}"><button data-bind-if="{{s.ref != null}}" data-part="deal.add-us" data-bind-disabled="{{!s.enabled || !deal.editable}}" data-on-click="intent screen.act(screen: 'deal', action: event.shift ? 'add_max' : 'add', a: 0, b: s.ref.type, c: s.ref.data1, d: s.ref.data2)"><b data-bind-value="{{s.label}}"></b><span data-bind-value="{{s.amount}}"></span></button><p class="deal-reason" data-bind-value="{{s.reason}}"></p><b data-bind-if="{{s.kind == 'list'}}" data-bind-value="{{s.label}}"></b><button data-bind-for="i:{{s.items}}" data-bind-disabled="{{!i.enabled || !deal.editable}}" data-on-click="intent screen.act(screen: 'deal', action: event.shift ? 'add_max' : 'add', a: 0, b: i.ref.type, c: i.ref.data1, d: i.ref.data2)"><img data-bind-src="{{i.icon}}"><span data-bind-value="{{i.label}}"></span><span data-bind-value="{{i.amount}}"></span><span class="deal-reason" data-bind-value="{{i.reason}}"></span></button></div></div></div>
<footer class="deal-footer"><p data-part="deal.reason" data-bind-value="{{deal.side_note}}"></p><div class="deal-editor" data-bind-if="{{state.deal.kind >= 0 &amp;&amp; deal.editable}}"><input type="number" data-bind-model="state.deal.amount" data-on-submit="intent screen.act(screen: 'deal', action: 'set_amount', a: state.deal.side, b: state.deal.kind, c: state.deal.item, d: state.deal.amount); set state.deal.kind = -1"><button data-on-click="intent screen.act(screen: 'deal', action: 'set_amount', a: state.deal.side, b: state.deal.kind, c: state.deal.item, d: state.deal.amount); set state.deal.kind = -1" data-l10n="deal.apply">Apply amount</button></div><p data-bind-value="{{deal.phrase}}"></p><div class="deal-buttons"><button data-part="deal.clear" data-bind-disabled="{{!deal.left_button.enabled}}" data-on-click="intent screen.act(screen: 'deal', action: deal.left_button.key)" data-bind-value="{{deal.left_button.label}}"></button><button data-bind-disabled="{{!deal.right_button.enabled}}" data-on-click="intent screen.act(screen: 'deal', action: deal.right_button.key)" data-bind-value="{{deal.right_button.label}}"></button><span class="deal-reason" data-bind-value="{{deal.right_button.reason}}"></span></div></footer>
</section>
