<button class="btn primary c" data-part="trade-routes.establish" data-l10n="trade_routes.yes" data-on-click="intent screen.act(screen: 'trade_routes', action: 'establish', a: trade_routes.choose.unit.id, b: d.plot, c: d.connection_id); set state.trade_routes.confirm = -1; intent window.close(window: 'trade_routes')"></button>
</div>
</section>
</div>
</div>
</div>

<div data-bind-if="{{trade_routes != null && !state.trade_routes.overview && trade_routes.choose == null && trade_routes.new_home != null}}">
<div class="wlayer dimmed" data-bind-for="c:{{trade_routes.new_home.cities}}" data-bind-filter="{{state.trade_routes.confirm == c.id}}">
<section class="win pop w-s" role="dialog">
<div class="hd"><div class="ttl"><b data-l10n="trade_routes.make_home"></b><b data-bind-value="{{c.name}}"></b></div></div>
<div class="wft">
<button class="btn c" data-bind-hotkey="{{'Escape'}}" data-on-click="set state.trade_routes.confirm = -1"><span data-l10n="trade_routes.cancel_home"></span><span class="key" data-l10n="key.escape"></span></button>
<button class="btn primary c" data-l10n="trade_routes.rehome" data-bind-if="{{trade_routes.new_home.kind == 'trade_home'}}" data-on-click="intent screen.act(screen: 'trade_routes', action: 'rehome', a: trade_routes.new_home.unit.id, b: c.plot); set state.trade_routes.confirm = -1; intent window.close(window: 'trade_routes')"></button>
<button class="btn primary c" data-l10n="trade_routes.port" data-bind-if="{{trade_routes.new_home.kind == 'admiral_port'}}" data-on-click="intent screen.act(screen: 'trade_routes', action: 'admiral_port', a: trade_routes.new_home.unit.id, b: c.plot); set state.trade_routes.confirm = -1; intent window.close(window: 'trade_routes')"></button>
</div>
</section>
</div>
</div>
</div>
