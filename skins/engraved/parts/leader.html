<section class="leader-panel" data-part="leader" data-screen="leader" data-esc="call leader.escape()" data-bind-if="{{ui.windows.leader.open}}">
  <div class="leader-content" data-bind-if="{{leader != null}}"><aside class="leader-stage" data-bind-if="{{leader.partner != null}}"><div class="leader-mood" data-tooltip="leader-mood-tip" data-bind-value="{{leader.mood.label}}"></div><img class="leader-portrait" data-bind-src="{{leader.partner.icon}}"><div class="leader-caption"><b data-bind-value="{{leader.partner.leader_name}}"></b><span data-bind-value="{{leader.partner.civ}}"></span><span data-bind-value="{{leader.partner.capital}}"></span><span data-bind-value="{{leader.partner.ideology}}"></span><span data-bind-value="{{leader.partner.religion}}"></span></div></aside>
    <div class="leader-dialogue"><header class="leader-header"><div data-bind-if="{{leader.partner != null}}"><b data-part="leader.name" data-bind-value="{{leader.partner.name}}"></b><span data-bind-value="{{leader.partner.title}}"></span></div><button data-bind-if="{{leader.can_close &amp;&amp; (leader.mode == 'main' || leader.mode == 'discussion')}}" data-on-click="intent screen.act(screen: 'leader', action: 'goodbye')" data-l10n="leader.close">Close</button></header>
      <div class="leader-scroll"><span class="leader-speaker" data-bind-value="{{leader.speaker_line}}"></span><p class="leader-phrase" data-bind-value="{{leader.phrase}}"></p><p class="leader-unavailable" data-part="leader.reason" data-bind-if="{{!leader.available}}" data-bind-value="{{leader.unavailable_reason}}"></p><div class="leader-target" data-bind-if="{{leader.phrase_target != null}}"><img data-bind-src="{{leader.phrase_target.emblem}}"><span data-bind-value="{{leader.phrase_target.name}}"></span><span data-bind-value="{{leader.phrase_target.civ}}"></span></div>
        <div class="leader-responses" data-bind-if="{{leader.mode == 'discussion' || leader.mode == 'response'}}"><button data-bind-for="r:{{leader.responses}}" data-bind-disabled="{{!r.enabled}}" data-on-click="intent screen.act(screen: 'leader', action: leader.mode == 'discussion' ? 'topic' : 'respond', a: r.index)"><b data-bind-value="{{r.label}}"></b><span data-bind-value="{{r.hint}}"></span><span data-bind-value="{{r.reason}}"></span></button></div>
        <div class="leader-targets" data-bind-if="{{leader.mode == 'coop_target'}}"><button data-bind-for="t:{{leader.targets}}" data-on-click="intent screen.act(screen: 'leader', action: 'coop_war', a: t.player)"><img data-bind-src="{{t.emblem}}"><span data-bind-value="{{t.name}}"></span><span data-bind-value="{{t.meta}}"></span><b data-bind-value="{{t.score}}"></b></button></div>
        <div class="leader-confirm" data-bind-if="{{leader.confirm != null}}"><p data-bind-value="{{leader.confirm.text}}"></p><p data-bind-for="c:{{leader.confirm.consequences}}" data-bind-value="{{c.text}}"></p><button data-on-click="intent screen.act(screen: 'leader', action: 'confirm', a: 1)" data-l10n="leader.yes">Yes</button><button data-on-click="intent screen.act(screen: 'leader', action: 'confirm', a: 0)" data-l10n="leader.no">No</button></div>
        <div class="leader-relations"><div class="leader-relation" data-bind-for="r:{{leader.relation}}"><span data-bind-value="{{r.label}}"></span><b data-bind-value="{{r.value}}"></b><span data-bind-value="{{r.note}}"></span></div></div>
      </div>
      <footer class="leader-actions"><button data-bind-if="{{leader.mode == 'coop_target' || leader.mode == 'confirm_denounce' || leader.mode == 'confirm_war'}}" data-on-click="intent screen.act(screen: 'leader', action: 'back')" data-l10n="leader.back">Back</button><div class="leader-action-list" data-bind-if="{{leader.mode == 'main' || leader.mode == 'discussion'}}"><button data-part="leader.action" data-bind-for="a:{{leader.main_actions}}" data-bind-filter="{{a.visible}}" data-bind-disabled="{{!a.enabled || len(ui.pending) > 0}}" data-bind-class-toggle="leader-danger:{{a.key == 'declare_war'}}" data-on-pointerenter="set state.leader.hover = a.key" data-tooltip="leader-action-tip" data-on-click="intent screen.act(screen: 'leader', action: a.key)" data-bind-value="{{a.label}}"></button></div><span data-bind-if="{{!leader.can_close}}" data-l10n="leader.required">A reply is required.</span></footer>
    </div>
  </div>
</section>
