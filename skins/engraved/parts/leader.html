<section class="win ld-win" role="dialog" data-part="leader" data-screen="leader" data-esc="call leader.escape()" data-bind-if="{{ui.windows.leader.open}}">
  <div class="ld-content" data-bind-if="{{leader != null}}"><aside class="ld-stage" data-bind-if="{{leader.partner != null}}"><span class="chip ld-mood" data-tooltip="leader-mood-tip" data-bind-value="{{leader.mood.label}}"></span><img class="gi ld-portrait" data-bind-src="{{leader.partner.icon}}"><b class="ld-big" data-bind-value="{{leader.partner.leader_name}}"></b><span class="sec" data-bind-value="{{leader.partner.civ}}"></span><span class="chip" data-bind-if="{{leader.partner.capital != null}}" data-bind-value="{{leader.partner.capital}}"></span><span class="chip" data-bind-if="{{leader.partner.ideology != null}}" data-bind-value="{{leader.partner.ideology}}"></span><span class="chip" data-bind-if="{{leader.partner.religion != null}}" data-bind-value="{{leader.partner.religion}}"></span></aside>
    <div class="ld-dialogue"><div class="hd"><div class="ttl stack" data-bind-if="{{leader.partner != null}}"><b data-part="leader.name" data-bind-value="{{leader.partner.name}}"></b><span class="sub" data-bind-value="{{leader.partner.title}}"></span></div><button class="btn sm ld-close" data-bind-if="{{leader.can_close &amp;&amp; (leader.mode == 'main' || leader.mode == 'discussion')}}" data-on-click="intent screen.act(screen: 'leader', action: 'goodbye')" data-l10n="leader.close">Close</button></div>
      <div class="wbd"><span class="sect" data-bind-value="{{leader.speaker_line}}"></span><p class="ld-phrase" data-bind-value="{{leader.phrase}}"></p><p class="why" data-part="leader.reason" data-bind-if="{{!leader.available}}" data-bind-value="{{leader.unavailable_reason}}"></p><div class="who" data-bind-if="{{leader.phrase_target != null}}"><img class="gi s24" data-bind-src="{{leader.phrase_target.emblem}}"><b data-bind-value="{{leader.phrase_target.name}}"></b></div>
        <div class="btns col" data-bind-if="{{leader.mode == 'discussion' || leader.mode == 'response'}}"><button class="btn tall ld-resp" data-bind-for="r:{{leader.responses}}" data-bind-disabled="{{!r.enabled}}" data-on-click="intent screen.act(screen: 'leader', action: leader.mode == 'discussion' ? 'topic' : 'respond', a: r.index)"><b data-bind-value="{{r.label}}"></b><small data-bind-value="{{r.hint}}"></small><small data-bind-value="{{r.reason}}"></small></button></div>
        <div class="ld-targets" data-bind-if="{{leader.mode == 'coop_target'}}"><button class="card pick ld-tg" data-bind-for="t:{{leader.targets}}" data-on-click="intent screen.act(screen: 'leader', action: 'coop_war', a: t.player)"><img class="gi s32" data-bind-src="{{t.emblem}}"><b data-bind-value="{{t.name}}"></b><span class="sec" data-bind-value="{{t.meta}}"></span><b class="ld-sc" data-bind-value="{{t.score}}"></b></button></div>
        <div class="card" data-bind-if="{{leader.confirm != null}}"><p class="prose sm" data-bind-value="{{leader.confirm.text}}"></p><p class="why" data-bind-for="c:{{leader.confirm.consequences}}" data-bind-value="{{c.text}}"></p><button class="btn danger c" data-on-click="intent screen.act(screen: 'leader', action: 'confirm', a: 1)" data-l10n="leader.yes">Yes</button><button class="btn c" data-on-click="intent screen.act(screen: 'leader', action: 'confirm', a: 0)" data-l10n="leader.no">No</button></div>
        <div class="kv ld-rel"><div class="r" data-bind-for="r:{{leader.relation}}"><span class="k" data-bind-value="{{r.label}}"></span><b data-bind-value="{{r.value}}"></b><span class="sec" data-bind-value="{{r.note}}"></span></div></div>
      </div>
      <div class="wft"><button class="btn" data-bind-if="{{leader.mode == 'coop_target' || leader.mode == 'confirm_denounce' || leader.mode == 'confirm_war'}}" data-on-click="intent screen.act(screen: 'leader', action: 'back')" data-l10n="leader.back">Back</button><div class="ld-acts" data-bind-if="{{leader.mode == 'main' || leader.mode == 'discussion'}}"><button class="btn" data-part="leader.action" data-bind-for="a:{{leader.main_actions}}" data-bind-filter="{{a.visible}}" data-bind-disabled="{{!a.enabled || len(ui.pending) > 0}}" data-bind-class-toggle="danger:{{a.key == 'declare_war'}}; primary:{{a.key == 'trade'}}" data-on-pointerenter="set state.leader.hover = a.enabled ? '' : a.key" data-tooltip="leader-action-tip" data-on-click="intent screen.act(screen: 'leader', action: a.key)" data-bind-value="{{a.label}}"></button></div><span class="note" data-bind-if="{{!leader.can_close}}" data-l10n="leader.required">A reply is required.</span></div>
    </div>
  </div>
</section>
