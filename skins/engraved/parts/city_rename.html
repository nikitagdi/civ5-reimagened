<div class="wlayer dimmed" data-part="city-rename" data-screen="city_rename" data-bind-if="{{ui.windows.city_rename.open}}">
  <section class="win pop w-s" data-bind-if="{{city_rename != null}}">
    <div class="hd">
      <div class="ttl stack"><span class="kick" data-part="city-rename.name" data-bind-value="{{city_rename.name}}"></span><b class="cr-t"><span data-bind-if="{{city_rename.mode == 'rename'}}" data-l10n="city_rename.mode.rename">Rename city</span><span data-bind-if="{{city_rename.mode == 'raze'}}" data-l10n="city_rename.mode.raze">Raze city</span><span data-bind-if="{{city_rename.mode == 'unraze'}}" data-l10n="city_rename.mode.unraze">Stop razing</span><span data-bind-if="{{city_rename.mode == 'annex'}}" data-l10n="city_rename.mode.annex">Annex city</span></b></div>
      <div class="close" data-bind-if="{{city_rename.mode == 'rename'}}"><span class="key" data-l10n="key.escape">Esc</span><button class="x" data-on-click="intent window.close(window: 'city_rename')"><svg class="i"><use href="#i-close"/></svg></button></div>
      <span class="req" data-bind-if="{{city_rename.task != null}}" data-l10n="city_rename.sure">Are you sure?</span>
    </div>
    <div class="wbd" data-bind-if="{{city_rename.mode == 'rename'}}">
      <div class="cr-fld"><span class="sect" data-l10n="city_rename.new_name">New city name</span><input class="field lg" data-bind-class-toggle="bad:{{state.city_rename.touched && !state.city_rename.valid}}" type="text" data-part="city-rename.input" data-bind-model="state.city_rename.draft" data-on-input="call city_rename.validate()"/><span class="why neg" data-bind-value="{{state.city_rename.why}}"></span></div>
    </div>
    <div class="wbd" data-bind-if="{{city_rename.task != null}}"><div class="prose" data-bind-value="{{city_rename.task.explain}}"></div><div class="prose sm sec" data-bind-value="{{city_rename.task.forecast}}"></div></div>
    <div class="cr-why why neg" data-part="city-rename.reason" data-bind-if="{{city_rename.reason != null}}" data-bind-value="{{city_rename.reason}}"></div>
    <div class="wft"><button class="btn c" data-on-click="intent window.close(window: 'city_rename')" data-l10n="city_rename.cancel">Cancel</button><button class="btn primary c" data-part="city-rename.confirm" data-bind-hotkey="'Enter'" data-bind-if="{{city_rename.mode == 'rename'}}" data-bind-disabled="{{!city_rename.enabled || !state.city_rename.valid || !state.city_rename.touched}}" data-on-click="intent screen.act(screen: 'city_rename', action: 'rename', a: city_rename.city, text: state.city_rename.draft)" data-l10n="city_rename.accept">Accept</button><button class="btn c" data-bind-class-toggle="danger:{{city_rename.mode == 'raze'}}; primary:{{city_rename.mode != 'raze'}}" data-bind-if="{{city_rename.task != null}}" data-bind-disabled="{{!city_rename.enabled}}" data-on-click="call city_rename.confirm()" data-l10n="city_rename.yes">Yes</button></div>
  </section>
</div>
