<section class="city_list-panel" data-part="city-list" data-screen="city_list" data-bind-if="{{ui.windows.city_list.open}}">
<div class="hd cl-hd">
<div class="ttl"><b data-l10n="city_list.title"></b><span class="sub" data-bind-if="{{city_list != null}}" data-bind-value="{{city_list.count}}"></span></div>
<div class="close"><span class="key" data-l10n="key.escape"></span><button class="x" data-on-click="intent window.close(window: 'city_list')"><svg class="i"><use href="#i-close"/></svg></button></div>
</div>
<div class="tbl t-cl">
<div class="thead">
<button class="h" data-bind-class-toggle="on:{{state.city_list.sort == 'population'}}" data-on-click="call city_list.sort('population')" data-l10n="city_list.population"></button>
<button class="h" data-bind-class-toggle="on:{{state.city_list.sort == 'name'}}" data-on-click="call city_list.sort('name')" data-l10n="city_list.name"></button>
<button class="h r" data-bind-class-toggle="on:{{state.city_list.sort == 'strength'}}" data-on-click="call city_list.sort('strength')" data-l10n="city_list.strength"></button>
<button class="h" data-bind-class-toggle="on:{{state.city_list.sort == 'production'}}" data-on-click="call city_list.sort('production')" data-l10n="city_list.production"></button>
</div>
<div class="scr" data-bind-if="{{city_list != null}}">
<div class="trow" data-bind-for="c:{{city_list.cities}}" data-bind-sort-desc="{{state.city_list.desc}}" data-bind-sort="{{state.city_list.sort == 'population' ? c.population : (state.city_list.sort == 'strength' ? c.strength : (state.city_list.sort == 'production' ? c.production_sort : c.name))}}">
<div class="c grow"><b data-bind-value="{{c.population}}"></b><span class="g"><span data-bind-if="{{c.growth_state == 'growing'}}" data-l10n="city_list.growth.growing"></span><span data-bind-if="{{c.growth_state == 'stagnant'}}" data-l10n="city_list.growth.stagnant"></span><span data-bind-if="{{c.growth_state == 'starving'}}" data-l10n="city_list.growth.starving"></span><span data-bind-if="{{c.growth_turns != null}}" data-l10n="top.turns" data-l10n-args="{{c.growth_turns}}"></span></span></div>
<button class="c cname" data-part="city-list.row" data-on-click="intent window.close(window: 'city_list'); intent window.open(window: 'city', a: c.city, b: 0)" data-on-contextmenu="intent camera.to_city(city: c.map_city)"><span class="nm ell" data-part="city-list.name" data-bind-value="{{c.name}}"></span><span class="tag mute" data-bind-if="{{c.status == 'capital'}}" data-l10n="city_list.status.capital"></span><span class="tag mute" data-bind-if="{{c.status == 'puppet'}}" data-l10n="city_list.status.puppet"></span><span class="tag neg" data-bind-if="{{c.status == 'occupied'}}" data-l10n="city_list.status.occupied"></span><span class="tag neg" data-bind-if="{{c.can_range_strike}}" data-l10n="city_list.strike"></span></button>
<div class="c r cstr"><b data-bind-value="{{c.strength}}"></b><div class="gauge hp" data-bind-if="{{c.hp_fraction < 1}}"><div class="fill" data-bind-style-width="{{c.hp_fraction * 100}}%"></div></div></div>
<button class="c cprod" data-bind-disabled="{{!c.can_choose}}" data-on-click="intent window.close(window: 'city_list'); intent window.open(window: 'city', a: c.city, b: 2)"><img class="gi s32" data-bind-if="{{c.production != null}}" data-bind-src="{{c.production.icon}}"><span class="ell" data-bind-if="{{c.production != null}}" data-bind-value="{{c.production.name}}"></span><b data-bind-if="{{c.production != null}}" data-bind-value="{{c.production.turns}}"></b><span class="z" data-bind-if="{{c.production == null}}" data-l10n="city_list.empty"></span></button>
</div>
</div>
</div>
</section>
