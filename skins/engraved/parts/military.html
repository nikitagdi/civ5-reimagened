<div class="ovl" data-part="military" data-screen="military" data-bind-if="{{ui.windows.military.open}}">
<section class="win ov w-mil" role="dialog" data-part="military.window">
<div class="hd">
<img class="gi s48" data-bind-if="{{military != null}}" data-bind-src="{{military.player.icon}}">
<div class="ttl"><b data-l10n="military.title"></b></div>
<div class="facts" data-bind-if="{{military != null}}">
<span><b data-bind-value="{{military.counts.military}}"></b><span data-l10n="military.combat_count"></span></span>
<span><b data-bind-value="{{military.counts.civilian}}"></b><span data-l10n="military.civilian_count"></span></span>
<span><b class="sup"><span data-bind-value="{{military.supply.used}}"></span><span data-l10n="military.of"></span><span data-bind-value="{{military.supply.limit}}"></span></b><span data-l10n="military.supply_count"></span></span>
</div>
<div class="close"><span class="key" data-l10n="key.escape"></span><button class="x" data-part="military.close" data-bind-hotkey="{{'Enter'}}" data-on-click="intent window.close(window: 'military')"><svg class="i"><use href="#i-close"/></svg></button></div>
</div>
<div class="empty" data-l10n="military.loading" data-bind-if="{{military == null}}"></div>
<div class="ob side-l" data-bind-if="{{military != null}}">
<aside class="scr aside"><div class="kv led">
<div class="sect lg"><span data-l10n="military.supply"></span><span class="rule"></span></div>
<div class="r gut"><span class="k" data-l10n="military.difficulty"></span><b data-bind-value="{{military.supply.difficulty}}"></b></div>
<div class="r gut"><span class="k" data-l10n="military.cities"></span><b data-bind-value="{{military.supply.cities}}"></b></div>
<div class="r gut"><span class="k" data-l10n="military.population"></span><b data-bind-value="{{military.supply.population}}"></b></div>
<div class="r gut tot"><span class="k" data-l10n="military.limit"></span><b data-bind-value="{{military.supply.limit}}"></b></div>
<div class="r gut"><span class="k" data-l10n="military.used"></span><b data-bind-value="{{military.supply.used}}"></b></div>
<div data-bind-if="{{military.supply.over > 0}}">
<div class="r gut tot"><span class="k" data-l10n="military.over"></span><b data-bind-value="{{military.supply.over}}"></b></div>
<div class="r gut"><span class="k" data-l10n="military.penalty"></span><b data-bind-value="{{military.supply.production_penalty_pct}}"></b></div>
</div>
<div data-bind-if="{{military.supply.over <= 0}}">
<div class="r tot gut"><span class="k" data-l10n="military.remaining"></span><b class="c-food" data-bind-value="{{military.supply.remaining}}"></b></div>
</div>
<div class="sect lg"><span data-l10n="military.great_people"></span><span class="rule"></span></div>
</div>
<div class="gp"><img class="gi s48" data-bind-src="{{military.great_general.icon}}"><div class="bd"><div class="l"><span data-l10n="military.great_general"></span><b><span data-bind-value="{{military.great_general.progress}}"></span><span class="small" data-l10n="military.of"></span><span class="small" data-bind-value="{{military.great_general.threshold}}"></span></b></div><div class="gauge t"><div class="fill gp1" data-bind-style-width="{{clamp(military.great_general.progress / military.great_general.threshold, 0, 1) * 100}}%"></div></div><span class="s"><span data-bind-value="{{military.great_general.threshold - military.great_general.progress}}"></span><span data-l10n="military.xp_remaining"></span></span></div></div>
<div class="gp"><img class="gi s48" data-bind-src="{{military.great_admiral.icon}}"><div class="bd"><div class="l"><span data-l10n="military.great_admiral"></span><b><span data-bind-value="{{military.great_admiral.progress}}"></span><span class="small" data-l10n="military.of"></span><span class="small" data-bind-value="{{military.great_admiral.threshold}}"></span></b></div><div class="gauge t"><div class="fill gp2" data-bind-style-width="{{clamp(military.great_admiral.progress / military.great_admiral.threshold, 0, 1) * 100}}%"></div></div><span class="s"><span data-bind-value="{{military.great_admiral.threshold - military.great_admiral.progress}}"></span><span data-l10n="military.xp_remaining"></span></span></div></div>
<div class="kv led">
<div class="sect lg"><span data-l10n="military.legend"></span><span class="rule"></span></div>
<div class="r"><span class="pr"><svg class="i"><use href="#i-upgrade"/></svg></span><span class="k" data-l10n="military.promotion"></span></div>
<div class="r na gut"><span class="k" data-l10n="military.dim"></span></div>
<div class="r gut"><span class="k" data-l10n="military.select"></span></div>
</div>
</aside>
<div class="tbl t-unit">
<div class="thead">
<span class="h"></span>
<button class="h" data-bind-class-toggle="on:{{state.military.sort == 'name'}}" data-on-click="set state.military.sort_desc = state.military.sort == 'name' ? !state.military.sort_desc : false; set state.military.sort = 'name'" data-l10n="military.col_name"></button>
<button class="h" data-bind-class-toggle="on:{{state.military.sort == 'status_text'}}" data-on-click="set state.military.sort_desc = state.military.sort == 'status_text' ? !state.military.sort_desc : false; set state.military.sort = 'status_text'" data-l10n="military.col_status_text"></button>
<button class="h r" data-bind-class-toggle="on:{{state.military.sort == 'moves'}}" data-on-click="set state.military.sort_desc = state.military.sort == 'moves' ? !state.military.sort_desc : true; set state.military.sort = 'moves'"><img class="gi s16" data-asset="font:ICON_MOVES"></button>
<button class="h r" data-bind-class-toggle="on:{{state.military.sort == 'max_moves'}}" data-on-click="set state.military.sort_desc = state.military.sort == 'max_moves' ? !state.military.sort_desc : true; set state.military.sort = 'max_moves'" data-l10n="military.col_max_moves"></button>
<button class="h r" data-bind-class-toggle="on:{{state.military.sort == 'strength'}}" data-on-click="set state.military.sort_desc = state.military.sort == 'strength' ? !state.military.sort_desc : true; set state.military.sort = 'strength'"><img class="gi s16" data-asset="font:ICON_STRENGTH"></button>
<button class="h r" data-bind-class-toggle="on:{{state.military.sort == 'ranged'}}" data-on-click="set state.military.sort_desc = state.military.sort == 'ranged' ? !state.military.sort_desc : true; set state.military.sort = 'ranged'"><img class="gi s16" data-asset="font:ICON_RANGE_STRENGTH"></button>
<button class="h" data-bind-class-toggle="on:{{state.military.sort == 'health_pct'}}" data-on-click="set state.military.sort_desc = state.military.sort == 'health_pct' ? !state.military.sort_desc : true; set state.military.sort = 'health_pct'" data-l10n="military.col_health_pct"></button>
</div>
<div class="scr">
<div class="sect lg" data-bind-if="{{military.counts.military > 0}}"><span data-l10n="military.group_military"></span><span class="small" data-bind-value="{{military.counts.military}}"></span><span class="rule"></span></div>
<button class="trow" data-part="military.unit-row" data-bind-for="u:{{military.units}}" data-bind-filter="{{u.military}}" data-bind-sort="{{state.military.sort == 'name' ? u.name : state.military.sort == 'status_text' ? u.status_text : state.military.sort == 'moves' ? u.moves : state.military.sort == 'max_moves' ? u.max_moves : state.military.sort == 'strength' ? u.strength : state.military.sort == 'ranged' ? u.ranged : state.military.sort == 'health_pct' ? u.health_pct : u.id}}" data-bind-sort-desc="{{state.military.sort_desc}}" data-bind-class-toggle="dis:{{u.moves == 0}}; sel:{{unit != null && unit.key == u.unit_key}}" data-on-click="intent unit.select(unit: u.unit_key)">
<span class="c pr"><svg class="i" data-bind-if="{{u.can_promote}}"><use href="#i-upgrade"/></svg></span>
<span class="c"><img class="gi s22" data-bind-src="{{u.icon}}"><span class="nm ell" data-part="military.unit-name" data-bind-value="{{u.name}}"></span></span>
<span class="c sec" data-bind-value="{{u.status_text}}"></span>
<span class="c r" data-bind-value="{{u.moves}}"></span>
<span class="c r" data-bind-value="{{u.max_moves}}"></span>
<span class="c r" data-bind-value="{{u.strength == 0 ? '−' : fmt.int(u.strength)}}"></span>
<span class="c r" data-bind-value="{{u.ranged == 0 ? '−' : fmt.int(u.ranged)}}"></span>
<span class="c"><span class="gauge hpb" data-bind-if="{{u.health_pct != null}}"><span class="fill hp-lo" data-bind-class-toggle="hp-hi:{{u.health_pct > 66}}; hp-md:{{u.health_pct > 33 && u.health_pct <= 66}}" data-bind-style-width="{{u.health_pct}}%"></span></span></span>
</button>
<div class="sect lg" data-bind-if="{{military.counts.civilian > 0}}"><span data-l10n="military.group_civilian"></span><span class="small" data-bind-value="{{military.counts.civilian}}"></span><span class="rule"></span></div>
<button class="trow" data-part="military.civilian-row" data-bind-for="u:{{military.units}}" data-bind-filter="{{!u.military}}" data-bind-sort="{{state.military.sort == 'name' ? u.name : state.military.sort == 'status_text' ? u.status_text : state.military.sort == 'moves' ? u.moves : state.military.sort == 'max_moves' ? u.max_moves : state.military.sort == 'strength' ? u.strength : state.military.sort == 'ranged' ? u.ranged : state.military.sort == 'health_pct' ? u.health_pct : u.id}}" data-bind-sort-desc="{{state.military.sort_desc}}" data-bind-class-toggle="dis:{{u.moves == 0}}; sel:{{unit != null && unit.key == u.unit_key}}" data-on-click="intent unit.select(unit: u.unit_key)">
<span class="c pr"><svg class="i" data-bind-if="{{u.can_promote}}"><use href="#i-upgrade"/></svg></span>
<span class="c"><img class="gi s22" data-bind-src="{{u.icon}}"><span class="nm ell" data-part="military.civilian-name" data-bind-value="{{u.name}}"></span></span>
<span class="c sec" data-bind-value="{{u.status_text}}"></span>
<span class="c r" data-bind-value="{{u.moves}}"></span>
<span class="c r" data-bind-value="{{u.max_moves}}"></span>
<span class="c r" data-bind-value="{{u.strength == 0 ? '−' : fmt.int(u.strength)}}"></span>
<span class="c r" data-bind-value="{{u.ranged == 0 ? '−' : fmt.int(u.ranged)}}"></span>
<span class="c"><span class="gauge hpb" data-bind-if="{{u.health_pct != null}}"><span class="fill hp-lo" data-bind-class-toggle="hp-hi:{{u.health_pct > 66}}; hp-md:{{u.health_pct > 33 && u.health_pct <= 66}}" data-bind-style-width="{{u.health_pct}}%"></span></span></span>
</button>
<div class="empty" data-l10n="military.empty" data-bind-if="{{len(military.units) == 0}}"></div>
</div>
</div>
</div>
</section>
</div>
