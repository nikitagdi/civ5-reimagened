<div class="mp-vote-screen" data-part="mp-vote" data-screen="mp-vote" data-esc="intent window.close(window: 'mp_vote')" data-bind-if="{{ui.windows.mp_vote.open}}">
  <section class="mp-vote-window">
    <header class="mp-vote-head"><h1 data-l10n="mp-vote.title">Proposals</h1><span data-bind-if="{{mp_vote != null}}" data-l10n="mp-vote.count" data-l10n-args="{{mp_vote.open_count}}, {{mp_vote.human_count}}"></span><button data-part="mp-vote.close" data-bind-hotkey="'Enter'" data-on-click="intent window.close(window: 'mp_vote')" data-l10n="mp-vote.close">Close</button></header>
    <p class="mp-vote-message" data-bind-if="{{mp_vote == null}}" data-l10n="mp-vote.loading">Loading votes</p>
    <div class="mp-vote-content" data-bind-if="{{mp_vote != null}}">
      <p class="mp-vote-message" data-part="mp-vote.reason" data-bind-if="{{mp_vote.reason != null}}" data-bind-value="{{mp_vote.reason}}"></p>
      <div class="mp-vote-columns" data-bind-if="{{mp_vote.view == 'proposal'}}">
        <section class="mp-vote-proposal" data-bind-if="{{mp_vote.proposal != null}}">
          <h2 data-part="mp-vote.proposal-title" data-bind-value="{{mp_vote.proposal.title}}"></h2>
          <p data-bind-if="{{mp_vote.proposal.author != null}}" data-l10n="mp-vote.author" data-l10n-args="{{mp_vote.proposal.author.leader}}"></p>
          <div class="mp-vote-stats"><div><span data-l10n="mp-vote.ends">Voting ends</span><strong data-bind-value="{{mp_vote.proposal.ends_turn}}"></strong></div><div><span data-l10n="mp-vote.voters">Voters</span><strong data-bind-value="{{mp_vote.proposal.voters}}"></strong></div><div data-bind-if="{{mp_vote.proposal.show_counts}}"><span data-l10n="mp-vote.yescount">Yes so far</span><strong data-bind-value="{{mp_vote.proposal.yes}}"></strong></div><div data-bind-if="{{mp_vote.proposal.show_counts &amp;&amp; mp_vote.proposal.still_needed != null}}"><span data-l10n="mp-vote.needed">Still needed</span><strong data-bind-value="{{mp_vote.proposal.still_needed}}"></strong></div></div>
          <div class="mp-vote-scale" data-bind-if="{{mp_vote.proposal.yes_pct != null}}"><div data-bind-style-width="{{mp_vote.proposal.yes_pct}}%"></div></div>
          <p data-bind-value="{{mp_vote.proposal.waiting_text}}"></p>
          <span class="mp-vote-waiting" data-bind-for="person:{{mp_vote.proposal.waiting}}" data-bind-value="{{person.nick}}"></span>
          <p data-l10n="mp-vote.secret" data-bind-if="{{mp_vote.proposal.secret}}">Individual votes remain private.</p>
          <div class="mp-vote-buttons"><button class="mp-vote-primary" data-part="mp-vote.yes" data-bind-disabled="{{!mp_vote.proposal.can_vote || state.mp_vote.pending}}" data-on-click="call mp-vote.yes()" data-l10n="mp-vote.yes">Vote yes</button><button data-part="mp-vote.no" data-bind-disabled="{{!mp_vote.proposal.can_vote || state.mp_vote.pending}}" data-on-click="call mp-vote.no()" data-l10n="mp-vote.no">Vote no</button></div>
          <p data-part="mp-vote.vote-state" data-bind-value="{{mp_vote.proposal.my_vote}}"></p><p class="mp-vote-message" data-bind-value="{{mp_vote.proposal.vote_reason}}"></p><strong data-bind-if="{{mp_vote.proposal.status != 'open'}}" data-bind-value="{{mp_vote.proposal.status_text}}"></strong>
        </section>
        <aside class="mp-vote-roster"><div data-bind-for="team:{{mp_vote.teams}}"><h3 data-bind-value="{{team.label}}"></h3><div class="mp-vote-player" data-bind-for="player:{{team.players}}"><img data-bind-src="{{player.emblem}}"><div><strong data-part="mp-vote.player" data-bind-value="{{player.leader}}"></strong><span data-bind-value="{{player.civ_name}}"></span><span data-bind-value="{{player.note}}"></span></div><span data-bind-if="{{player.score != null}}" data-bind-value="{{player.score}}"></span><span data-bind-value="{{player.vote_label}}"></span></div></div></aside>
      </div>
      <section class="mp-vote-candidate-list" data-bind-if="{{mp_vote.concede != null}}"><h2 data-l10n="mp-vote.concede">Concede to whom?</h2><p data-bind-value="{{mp_vote.concede.empty_text}}"></p><button class="mp-vote-candidate" data-bind-for="candidate:{{mp_vote.concede.candidates}}" data-bind-disabled="{{state.mp_vote.pending}}" data-on-click="call mp-vote.concede(candidate.player_id)"><img data-bind-src="{{candidate.emblem}}"><span data-bind-value="{{candidate.leader}}"></span><span data-bind-value="{{candidate.sub}}"></span><span data-bind-value="{{candidate.score_text}}"></span></button></section>
      <section class="mp-vote-candidate-list" data-bind-if="{{mp_vote.diplo_vote != null}}"><h2 data-l10n="mp-vote.diplomatic">United Nations vote</h2><button class="mp-vote-candidate" data-bind-for="candidate:{{mp_vote.diplo_vote.candidates}}" data-bind-disabled="{{state.mp_vote.pending || !mp_vote.diplo_vote.blocking}}" data-on-click="call mp-vote.diplo(candidate.player_id)"><img data-bind-src="{{candidate.emblem}}"><span data-bind-value="{{candidate.leader}}"></span><span data-bind-value="{{candidate.civ_name}}"></span></button><p data-bind-if="{{mp_vote.diplo_vote.blocking}}" data-l10n="mp-vote.blocking">Your turn cannot end until you vote. Closing keeps it blocked.</p></section>
    </div>
    <div class="mp-vote-error" data-bind-for="error:{{ui.errors}}"><span data-part="mp-vote.error" data-bind-if="{{error.detail != null}}" data-bind-value="{{error.detail}}"></span></div>
  </section>
</div>
