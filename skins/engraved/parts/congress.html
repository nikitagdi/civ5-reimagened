<div class="congress-screen" data-part="congress" data-screen="congress" data-esc="call congress.back()" data-bind-if="{{ui.windows.congress.open}}">
  <section class="congress-window">
    <header class="congress-head"><h1 data-l10n="congress.title">World Congress</h1><button data-on-click="set state.congress.picker = 'browse'" data-l10n="congress.browse">All resolutions</button><button data-part="congress.close" data-bind-hotkey="'Enter'" data-on-click="call congress.back()" data-l10n="congress.close">Close</button></header>
    <p data-bind-if="{{congress == null}}" data-l10n="congress.loading">Loading Congress</p>
    <div class="congress-content" data-bind-if="{{congress != null}}">
      <div class="congress-league" data-bind-if="{{congress.league != null}}">
        <p class="congress-empty" data-part="congress.empty" data-bind-if="{{!congress.league.exists}}" data-bind-value="{{congress.league.absent_text}}"></p>
        <section class="congress-league-content" data-bind-if="{{congress.league.exists}}">
          <div class="congress-bar"><strong data-bind-value="{{congress.league.name}}"></strong><span data-bind-value="{{congress.league.session_label}}"></span><span data-l10n="congress.session" data-l10n-args="{{congress.league.turns_to_session}}"></span><button data-bind-disabled="{{!congress.league.can_rename}}" data-on-click="set state.congress.rename = true" data-l10n="congress.rename">Rename</button><span data-bind-if="{{congress.league.rename_reason != null}}" data-bind-value="{{congress.league.rename_reason}}"></span></div>
          <div class="congress-columns">
            <aside class="congress-members"><div class="congress-member" data-bind-for="member:{{congress.league.members}}" data-tooltip="congress-tip" data-on-pointerenter="call congress.tip(member.details)"><img data-bind-src="{{member.emblem}}"><div><strong data-bind-value="{{member.name}}"></strong><span data-bind-if="{{member.is_host}}" data-l10n="congress.host">Host</span><span data-bind-value="{{member.civ_name}}"></span></div><strong data-bind-value="{{member.delegates}}"></strong></div></aside>
            <div class="congress-ledger">
              <div class="congress-proposal" data-bind-for="row:{{congress.league.proposals}}">
                <span data-bind-value="{{row.kind}}"></span><div><strong data-part="congress.proposal-name" data-bind-value="{{row.name}}"></strong><span data-bind-value="{{row.effect}}"></span><span data-bind-if="{{row.postponed}}" data-l10n="congress.postponed">Postponed</span>
                  <div class="congress-candidates" data-bind-if="{{row.vote_kind == 'elect' &amp;&amp; congress.league.mode == 'vote'}}"><button data-bind-for="candidate:{{row.candidates}}" data-bind-disabled="{{!candidate.enabled}}" data-on-click="intent screen.act(screen: 'congress', action: 'vote', a: row.resolution_id, b: row.kind == 'repeal' ? 1 : 0, c: 1, d: candidate.player_id)"><span data-bind-value="{{candidate.name}}"></span><span data-bind-value="{{candidate.reason}}"></span></button></div>
                </div>
                <div class="congress-counter" data-bind-if="{{congress.league.mode == 'vote'}}"><button data-part="congress.vote-down" data-bind-disabled="{{!row.can_down || (row.vote_kind == 'elect' &amp;&amp; row.my_votes == 0)}}" data-on-click="intent screen.act(screen: 'congress', action: 'vote', a: row.resolution_id, b: row.kind == 'repeal' ? 1 : 0, c: -1, d: row.candidate != null ? row.candidate.player_id : -1)" data-on-contextmenu="intent screen.act(screen: 'congress', action: 'vote', a: row.resolution_id, b: row.kind == 'repeal' ? 1 : 0, c: -99, d: -1)">−</button><span data-part="congress.votes" data-bind-value="{{row.my_votes}}"></span><button data-part="congress.vote-up" data-bind-disabled="{{!row.can_up || (row.vote_kind == 'elect' &amp;&amp; row.candidate == null)}}" data-on-click="intent screen.act(screen: 'congress', action: 'vote', a: row.resolution_id, b: row.kind == 'repeal' ? 1 : 0, c: 1, d: row.candidate != null ? row.candidate.player_id : -1)" data-on-contextmenu="intent screen.act(screen: 'congress', action: 'vote', a: row.resolution_id, b: row.kind == 'repeal' ? 1 : 0, c: 99, d: row.candidate != null ? row.candidate.player_id : -1)">+</button></div>
              </div>
              <button class="congress-slot" data-bind-for="slot:{{congress.league.slots}}" data-on-click="set state.congress.slot = slot.index; set state.congress.picker = 'slot'"><span data-bind-value="{{slot.name}}"></span><span data-bind-value="{{slot.effect}}"></span></button>
              <h2 data-l10n="congress.effects">Effects in force</h2><p class="congress-effect" data-bind-for="effect:{{congress.league.effects}}" data-bind-value="{{effect.text}}"></p>
            </div>
          </div>
          <footer class="congress-footer">
            <div class="congress-vote-footer" data-bind-if="{{congress.league.mode == 'vote'}}"><strong data-part="congress.free" data-l10n="congress.free" data-l10n-args="{{congress.league.delegates_free}}"></strong><button data-bind-disabled="{{!congress.league.can_reset_votes}}" data-on-click="intent screen.act(screen: 'congress', action: 'vote_reset')" data-l10n="congress.resetvotes">Reset votes</button><button data-part="congress.submit-votes" data-on-click="set state.congress.confirm = 'votes'" data-l10n="congress.submitvotes">Submit votes</button></div>
            <div class="congress-vote-footer" data-bind-if="{{congress.league.mode == 'propose'}}"><span data-bind-value="{{congress.league.submit_reason}}"></span><button data-on-click="intent screen.act(screen: 'congress', action: 'propose_reset')" data-l10n="congress.resetproposals">Reset proposals</button><button data-bind-disabled="{{!congress.league.can_submit_proposals}}" data-on-click="set state.congress.confirm = 'proposals'" data-l10n="congress.submitproposals">Submit proposals</button></div>
          </footer>
        </section>
      </div>
      <section class="congress-splash" data-bind-if="{{congress.splash != null}}"><h2 data-bind-value="{{congress.splash.title}}"></h2><p data-bind-value="{{congress.splash.description}}"></p><div class="congress-era-columns"><div><h3 data-bind-value="{{congress.splash.this_era_title}}"></h3><p data-bind-for="row:{{congress.splash.this_era}}" data-bind-value="{{row.text}}"></p></div><div><h3 data-bind-value="{{congress.splash.next_era_title}}"></h3><p data-bind-for="row:{{congress.splash.next_era}}" data-bind-value="{{row.text}}"></p></div></div></section>
      <section class="congress-project" data-bind-if="{{congress.project != null}}"><h2 data-bind-value="{{congress.project.name}}"></h2><div class="congress-project-columns"><div><div class="congress-ranking" data-bind-for="row:{{congress.project.ranking}}"><span data-bind-value="{{row.rank}}"></span><span data-bind-value="{{row.name}}"></span><strong data-bind-value="{{row.contribution}}"></strong><span data-bind-value="{{row.tier}}"></span></div></div><aside><p data-bind-value="{{congress.project.description}}"></p><div data-bind-for="tier:{{congress.project.tiers}}"><h3 data-bind-value="{{tier.title}}"></h3><p data-bind-value="{{tier.reward}}"></p></div></aside></div></section>
    </div>
    <div class="congress-errors" data-bind-for="error:{{ui.errors}}"><span data-bind-if="{{error.detail != null}}" data-bind-value="{{error.detail}}"></span></div>
    <div class="congress-overlay" data-bind-if="{{state.congress.picker != 'none' &amp;&amp; congress != null &amp;&amp; congress.league != null &amp;&amp; congress.league.choices != null}}"><section class="congress-picker"><header class="congress-head"><h2 data-l10n="congress.choose">Choose a resolution</h2><button data-on-click="set state.congress.picker = 'none'" data-l10n="congress.close">Close</button></header><div class="congress-picker-list" data-include="parts/congress-choices.html"></div></section></div>
    <div class="congress-overlay" data-bind-if="{{state.congress.confirm != 'none'}}"><section class="congress-confirm"><h2 data-l10n="congress.confirm">Submit your decisions?</h2><p data-l10n="congress.final">You cannot change them after submitting. Unassigned delegates abstain.</p><button data-on-click="set state.congress.confirm = 'none'" data-l10n="congress.back">Back</button><button data-part="congress.confirm" data-on-click="call congress.submit()" data-l10n="congress.submit">Submit</button></section></div>
    <div class="congress-overlay" data-bind-if="{{state.congress.rename}}"><section class="congress-confirm"><input type="text" data-bind-model="state.congress.rename_text" data-on-submit="call congress.rename()"><button data-on-click="call congress.rename()" data-l10n="congress.rename">Rename</button><button data-on-click="set state.congress.rename = false" data-l10n="congress.back">Back</button></section></div>
  </section>
</div>
