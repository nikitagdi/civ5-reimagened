<template data-layer="tooltip" id="techs-tip">
  <div class="tip tt-tip" data-part="techs.tip"><div data-bind-if="{{techs != null}}"><div class="tt-tipc" data-bind-for="t:{{techs.techs}}" data-bind-filter="{{t.id == state.techs.hover}}">
    <div class="why" data-bind-if="{{len(ui.pending) > 0}}" data-l10n="techs.pending">Waiting for the server</div>
    <div class="who lg"><img class="gi s48 round" data-bind-src="{{t.icon}}"><span class="tx"><b data-bind-value="{{t.name}}"></b><span data-bind-value="{{t.era_name}}"></span></span></div>
    <div class="kv"><div class="r"><span class="k" data-l10n="prod.cost">Cost</span><b data-bind-value="{{t.cost}}"></b></div><div class="r" data-part="techs.tip.core" data-bind-if="{{rich_tooltips != null && rich_tooltips.tech != null && rich_tooltips.tech.key == t.key}}"><span class="k" data-l10n="rich_tooltips.progress">Progress</span><b data-bind-value="{{rich_tooltips.tech.progress}}"></b></div></div>
    <div class="why neg" data-bind-if="{{t.lock_reason != null}}" data-bind-value="{{t.lock_reason}}"></div>
    <div class="sect" data-l10n="tech_award.unlocks">Unlocks</div>
    <span class="chip lg" data-bind-for="u:{{t.unlocks}}"><img class="gi s22 round" data-bind-src="{{u.icon}}"><span data-bind-value="{{u.name}}"></span></span>
    <div class="prose sm sec" data-bind-value="{{t.help}}"></div>
    <div class="chips" data-bind-if="{{len(t.leads_to) > 0}}"><span class="sect" data-l10n="tech_award.leads">Leads to</span><span class="chip" data-bind-for="n:{{t.leads_to}}" data-bind-value="{{n.name}}"></span></div>
  </div></div></div>
</template>
<template data-layer="tooltip" id="techs-unlock-tip">
  <div class="tip tt-tip" data-part="techs.unlock-tip" data-bind-class-toggle="tt-tip-loading:{{rich_tooltips == null || rich_tooltips.unlock == null || ui.tip.kind != 12 || rich_tooltips.unlock.tech != ui.tip.id || rich_tooltips.unlock.slot != ui.tip.slot}}">
    <div data-bind-if="{{rich_tooltips != null && rich_tooltips.unlock != null}}">
      <div class="who lg" data-bind-if="{{rich_tooltips.unlock.title}}"><img class="gi s48 round" data-bind-src="{{rich_tooltips.unlock.icon}}"><b data-part="techs.unlock-tip.name" data-bind-value="{{rich_tooltips.unlock.title}}"></b></div>
      <div class="tt-unlock-line" data-part="techs.unlock-tip.line" data-bind-for="line:{{rich_tooltips.unlock.lines}}"><span data-bind-for="p:{{line.parts}}"><img class="gi s16" data-bind-if="{{p.icon != null}}" data-bind-src="{{p.icon}}"><span data-bind-value="{{p.text}}"></span></span></div>
    </div>
  </div>
</template>
