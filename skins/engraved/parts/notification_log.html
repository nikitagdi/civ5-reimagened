<div class="wlayer dimmed" data-part="notification-log" data-screen="notification_log" data-esc="intent window.close(window: 'notification_log')" data-bind-if="{{ui.windows.notification_log.open}}">
<section class="win w-nlog" role="dialog" data-part="notification-log.window">
<div class="hd tall">
<div class="ttl stack"><span class="kick" data-bind-if="{{notification_log != null}}" data-bind-value="{{notification_log.total}}"></span><b data-l10n="notification.log"></b></div>
<div class="close"><span class="key" data-l10n="key.escape"></span><button class="x" data-part="notification-log.close-x" data-on-click="intent window.close(window: 'notification_log')"><svg class="i"><use href="#i-close"/></svg></button></div>
</div>
<div class="empty" data-bind-if="{{notification_log == null}}" data-l10n="notification.loading"></div>
<div class="wbd" data-bind-if="{{notification_log != null}}">
<div class="empty" data-part="notification-log.empty" data-bind-if="{{len(notification_log.groups) == 0}}" data-l10n="notification.empty"></div>
<div class="grp" data-bind-for="g:{{notification_log.groups}}">
<div class="sect"><span data-l10n="notification.turn"></span><b data-bind-value="{{g.turn}}"></b><span data-bind-value="{{g.count}}"></span><span class="rule"></span></div>
<button class="lrow nitem" data-part="notification-log.item" data-bind-for="it:{{g.items}}" data-bind-class-toggle="dis:{{!it.active}}" data-bind-disabled="{{!it.active}}" data-on-click="intent note.activate(note: it.id); intent window.close(window: 'notification_log')">
<img class="gi s32 round" data-bind-src="{{it.icon}}"><span class="tx"><span data-bind-value="{{it.text}}"></span><span class="cat" data-bind-value="{{it.category}}"></span></span><span class="tag mute" data-bind-if="{{!it.active}}" data-l10n="notification.dismissed"></span>
</button>
</div>
</div>
<div class="wft" data-bind-if="{{notification_log != null}}"><span class="note" data-l10n="notification.hint"></span><button class="btn primary" data-part="notification-log.close" data-bind-hotkey="'Enter'" data-on-click="intent window.close(window: 'notification_log')"><span data-l10n="notification.close"></span><span class="key" data-l10n="key.enter"></span></button></div>
</section>
</div>
