<section class="unit-lists-panel" data-bind-if="{{hud != null && state.unit_lists.section != '' && !ui.windows.city_list.open}}">
  <div class="thead ulh"><button class="h" data-on-click="set state.unit_lists.sort = 'name'; set state.unit_lists.desc = !state.unit_lists.desc" data-l10n="unit_lists.name"></button><button class="h" data-on-click="set state.unit_lists.sort = 'status'; set state.unit_lists.desc = !state.unit_lists.desc" data-bind-if="{{state.unit_lists.section == 'units'}}" data-l10n="unit_lists.status"></button><button class="h" data-on-click="set state.unit_lists.sort = 'hp'; set state.unit_lists.desc = !state.unit_lists.desc" data-bind-if="{{state.unit_lists.section == 'units'}}" data-l10n="unit_lists.health"></button></div>
  <div class="unit-lists-body" data-bind-if="{{state.unit_lists.section == 'units'}}">
    <button class="sect ulg" data-on-click="set state.unit_lists.military_folded = !state.unit_lists.military_folded" data-l10n="unit_lists.military"></button>
    <div data-bind-if="{{!state.unit_lists.military_folded}}">
    <button class="lrow ulr" data-part="unit-lists.military-unit" data-bind-for="u:{{hud.lists.units}}" data-bind-filter="{{u.military}}" data-bind-sort="{{state.unit_lists.sort == 'hp' ? u.hp : (state.unit_lists.sort == 'status' ? u.status_text : u.name)}}" data-bind-sort-desc="{{state.unit_lists.desc}}" data-tooltip="on-map-unit-tip" data-on-pointerenter="call on_map.hover('unit', u.key)" data-bind-class-toggle="sel:{{ui.selection.unit == u.key}}; dis:{{u.moves <= 0}}; unit-lists-promotable:{{u.can_promote}}" data-on-click="intent unit.select(unit: u.key); intent camera.to_unit(unit: u.key)" data-on-contextmenu="intent camera.to_unit(unit: u.key)">
      <img class="gi s22" data-bind-src="{{u.icon}}"><span class="unit-lists-name" data-bind-value="{{u.name}}"></span><span class="unit-lists-status" data-bind-value="{{u.status_text}}"></span><span data-bind-class-toggle="unit-lists-wounded:{{u.hp < 66}}; unit-lists-critical:{{u.hp < 33}}" data-bind-value="{{u.hp}}"></span>
    </button>
    </div>
    <button class="sect ulg" data-on-click="set state.unit_lists.civilian_folded = !state.unit_lists.civilian_folded" data-l10n="unit_lists.civilian"></button>
    <div data-bind-if="{{!state.unit_lists.civilian_folded}}">
    <button class="lrow ulr" data-part="unit-lists.civilian-unit" data-bind-for="u:{{hud.lists.units}}" data-bind-filter="{{!u.military}}" data-bind-sort="{{state.unit_lists.sort == 'hp' ? u.hp : (state.unit_lists.sort == 'status' ? u.status_text : u.name)}}" data-bind-sort-desc="{{state.unit_lists.desc}}" data-tooltip="on-map-unit-tip" data-on-pointerenter="call on_map.hover('unit', u.key)" data-bind-class-toggle="sel:{{ui.selection.unit == u.key}}; dis:{{u.moves <= 0}}; unit-lists-promotable:{{u.can_promote}}" data-on-click="intent unit.select(unit: u.key); intent camera.to_unit(unit: u.key)" data-on-contextmenu="intent camera.to_unit(unit: u.key)">
      <img class="gi s22" data-bind-src="{{u.icon}}"><span class="unit-lists-name" data-bind-value="{{u.name}}"></span><span class="unit-lists-status" data-bind-value="{{u.status_text}}"></span><span data-bind-class-toggle="unit-lists-wounded:{{u.hp < 66}}; unit-lists-critical:{{u.hp < 33}}" data-bind-value="{{u.hp}}"></span>
    </button>
    </div>
  </div>
  <div class="unit-lists-body" data-part="unit-lists.gp" data-bind-if="{{state.unit_lists.section == 'gp'}}">
    <div class="unit-lists-group" data-bind-for="g:{{hud.lists.great_people}}"><b data-bind-value="{{g.name}}"></b><button class="lrow ulr" data-bind-for="c:{{g.rows}}" data-bind-sort="{{c.turns != null ? c.turns : 2147483647}}" data-on-click="intent window.open(window: 'city', a: c.city_id)"><span class="unit-lists-name" data-bind-value="{{c.name}}"></span><span data-bind-value="{{c.progress}}/{{c.threshold}}"></span><span data-bind-value="{{fmt.signed(c.per_turn)}}"></span><span data-l10n="top.turns" data-l10n-args="{{c.turns}}"></span></button></div>
    <div class="lrow ulr"><span data-l10n="unit_lists.general"></span><span data-bind-value="{{hud.lists.general_xp}}/{{hud.lists.general_threshold}}"></span></div>
    <div class="lrow ulr"><span data-l10n="unit_lists.admiral"></span><span data-bind-value="{{hud.lists.admiral_xp}}/{{hud.lists.admiral_threshold}}"></span></div>
  </div>
  <div class="unit-lists-body" data-part="unit-lists.resources" data-bind-if="{{state.unit_lists.section == 'resources'}}">
    <div class="lrow ulr" data-bind-for="r:{{hud.top.resources}}" data-bind-filter="{{r.revealed}}" data-bind-sort="{{r.name}}" data-tooltip="top-panel-resource-tip" data-on-pointerenter="set state.top.resource = r.id"><img class="gi s22" data-bind-src="{{r.icon}}"><span class="unit-lists-name" data-bind-value="{{r.name}}"></span><span data-bind-value="{{r.available}}" data-bind-class-toggle="unit-lists-critical:{{r.available < 0}}"></span><span data-bind-value="{{r.used}}"></span><span data-bind-value="{{r.imported}}"></span><span data-bind-value="{{r.exported}}"></span></div>
  </div>
</section>
<section class="unit-lists-cities" data-part="unit-lists.cities" data-bind-if="{{!ui.windows.city_list.open && (state.unit_lists.section != '' || state.tech_panel.open)}}">
  <button class="unit-lists-city" data-part="unit-lists.city" data-tooltip="on-map-city-tip" data-on-pointerenter="call on_map.hover('city', c.key)" data-bind-for="c:{{map.cities}}" data-bind-filter="{{c.mine}}" data-on-click="call city.open(c.key)" data-on-contextmenu="intent camera.to_city(city: c.key)"><span class="unit-lists-population" data-bind-value="{{c.size}}"></span><div class="unit-lists-city-body"><span class="unit-lists-name" data-bind-value="{{c.name}}"></span><div class="unit-lists-city-production" data-bind-if="{{c.production != null}}"><span class="unit-lists-name" data-bind-value="{{c.production.name}}"></span><span data-bind-value="{{c.production.turns}}"></span></div></div></button>
</section>
<div class="unit-lists-ribbon" data-part="unit-lists.ribbon" data-bind-if="{{hud != null && (state.unit_lists.section != '' || state.tech_panel.open || ui.windows.city_list.open)}}"><button class="unit-lists-ribbon-unit" data-tooltip="on-map-unit-tip" data-on-pointerenter="call on_map.hover('unit', u.key)" data-bind-for="u:{{hud.lists.units}}" data-bind-filter="{{u.key != ui.selection.unit}}" data-bind-class-toggle="unit-lists-wounded:{{u.hp < 100}}" data-on-click="intent unit.select(unit: u.key); intent camera.to_unit(unit: u.key)" data-on-contextmenu="intent camera.to_unit(unit: u.key)"><img class="unit-lists-ribbon-icon" data-bind-src="{{u.icon}}"><div class="unit-lists-moves"><div class="unit-lists-moves-fill" data-bind-style-width="{{clamp(u.moves / max(u.max_moves, 1), 0, 1) * 100}}%"></div></div></button></div>
