<div class="victory-screen" data-part="victory" data-screen="victory" data-esc="call victory.back()" data-bind-if="{{ui.windows.victory.open}}">
<section class="victory-window">
<header class="victory-head">
<img class="victory-icon" data-bind-if="{{victory != null}}" data-bind-src="{{victory.player.icon}}">
<h1 data-l10n="victory.title" >
</h1>
<div class="victory-facts" data-bind-if="{{victory != null}}">
<span class="victory-value" data-bind-value="{{victory.turn}}" >
</span>
<span data-l10n="victory.turn" >
</span>
<span class="victory-value" data-bind-value="{{victory.time.turns_left}}" >
</span>
<span data-l10n="victory.left" >
</span>
</div>
<button data-l10n="victory.close" data-part="victory.close" data-bind-hotkey="{{'Enter'}}" data-bind-if="{{state.victory.view == 'summary'}}" data-on-click="intent window.close(window: 'victory')">
</button>
</header>
<div data-l10n="victory.loading" data-bind-if="{{victory == null}}">
</div>
<div class="victory-body" data-bind-if="{{victory != null}}">
<aside class="victory-ledger victory-scroll">
<div class="victory-ledger-row">
<span data-l10n="victory.score" >
</span>
<span class="victory-value" data-bind-value="{{fmt.int(victory.score.total)}}" >
</span>
</div>
<div class="victory-ledger-row">
<span data-l10n="victory.rank" >
</span>
<span class="victory-value" data-bind-value="{{victory.score.rank}}" >
</span>
</div>
<div data-bind-if="{{victory.time.enabled}}">
<div class="victory-ledger-row">
<span data-l10n="victory.time_limit" >
</span>
<span class="victory-value" data-bind-value="{{victory.time.max_turn}}" >
</span>
</div>
</div>
<h2 data-l10n="victory.score_category" >
</h2>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'cities'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_cities" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'population'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_population" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'land'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_land" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'wonders'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_wonders" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'technologies'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_technologies" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'future_techs'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_future_techs" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'policies'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_policies" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'great_works'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_great_works" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'religion'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_religion" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'scenario_1'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_scenario_1" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'scenario_2'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_scenario_2" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'scenario_3'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_scenario_3" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div data-bind-for="i:{{victory.score.items}}" data-bind-filter="{{i.key == 'scenario_4'}}">
<div class="victory-ledger-row">
<span data-l10n="victory.score_scenario_4" >
</span>
<span class="victory-value" data-bind-value="{{i.value}}" >
</span>
</div>
</div>
<div class="victory-ledger-row">
<span data-l10n="victory.total" >
</span>
<span class="victory-value" data-bind-value="{{fmt.int(victory.score.total)}}" >
</span>
</div>
<button data-l10n="victory.score_ranking" class="victory-button" data-part="victory.score-ranking" data-bind-if="{{victory.time.enabled}}" data-on-click="set state.victory.view = 'score'">
</button>
<div data-bind-if="{{victory.proposals.visible}}">
<h2 data-l10n="victory.proposals" >
</h2>
<div data-bind-for="p:{{victory.proposals.items}}" data-bind-filter="{{p.key == 'irr'}}">
<button data-l10n="victory.proposal_irr" class="victory-button" data-bind-disabled="{{!p.enabled}}" data-tooltip="victory-proposal-tip" data-on-pointerenter="set state.victory.hover = 'irr'" data-on-click="intent screen.act(screen: 'victory', action: 'propose', a: 0)">
</button>
</div>
<div data-bind-for="p:{{victory.proposals.items}}" data-bind-filter="{{p.key == 'cc'}}">
<button data-l10n="victory.proposal_cc" class="victory-button" data-bind-disabled="{{!p.enabled}}" data-tooltip="victory-proposal-tip" data-on-pointerenter="set state.victory.hover = 'cc'" data-on-click="intent screen.act(screen: 'victory', action: 'propose', a: 1)">
</button>
</div>
<div data-bind-for="p:{{victory.proposals.items}}" data-bind-filter="{{p.key == 'scrap'}}">
<button data-l10n="victory.proposal_scrap" class="victory-button" data-bind-disabled="{{!p.enabled}}" data-tooltip="victory-proposal-tip" data-on-pointerenter="set state.victory.hover = 'scrap'" data-on-click="intent screen.act(screen: 'victory', action: 'propose', a: 2)">
</button>
</div>
</div>
</aside>
<div class="victory-main">
<div class="victory-summary" data-bind-if="{{state.victory.view == 'summary'}}">
<div class="victory-quadrants">
<div class="victory-quadrant victory-scroll">
<h2 data-l10n="victory.domination" >
</h2>
<div data-l10n="victory.disabled_domination" data-bind-if="{{!victory.domination.enabled}}">
</div>
<div data-bind-if="{{victory.domination.enabled}}">
<div class="victory-ledger-row">
<span data-l10n="victory.hold" >
</span>
<span class="victory-value" data-bind-value="{{victory.domination.own_count}}" >
</span>
</div>
<div class="victory-ledger-row" data-part="victory.domination-leader" data-bind-if="{{victory.domination.leader != null}}">
<span data-l10n="victory.leading" data-l10n-args="{{victory.domination.leader.count}}"></span>
<span class="victory-value" data-bind-value="{{victory.domination.leader.name}}"></span>
</div>
<div class="victory-capitals">
<div class="victory-capital" data-bind-for="c:{{victory.domination.capitals}}">
<img class="victory-civ" data-bind-src="{{c.icon}}">
<span class="victory-name" data-bind-value="{{c.capital_name}}" >
</span>
<img class="victory-owner" data-bind-if="{{c.owner_icon != null}}" data-bind-src="{{c.owner_icon}}">
</div>
</div>
</div>
</div>
<div class="victory-quadrant victory-scroll">
<h2 data-l10n="victory.science" >
</h2>
<div data-l10n="victory.disabled_science" data-bind-if="{{!victory.science.enabled}}">
</div>
<div data-bind-if="{{victory.science.enabled}}">
<div data-l10n="victory.apollo_done" data-bind-if="{{victory.science.apollo_built}}">
</div>
<div data-l10n="victory.apollo_not_done" data-bind-if="{{!victory.science.apollo_built}}">
</div>
<div class="victory-line">
<span class="victory-value" data-bind-value="{{victory.science.prereq_done}}" >
</span>
<span data-l10n="victory.of" >
</span>
<span class="victory-value" data-bind-value="{{victory.science.prereq_total}}" >
</span>
</div>
<div class="victory-bar">
<div class="victory-fill" data-bind-style-width="{{victory.science.prereq_total > 0 ? victory.science.prereq_done / victory.science.prereq_total * 100 : 0}}%">
</div>
</div>
<div class="victory-parts">
<div class="victory-part" data-bind-for="p:{{victory.science.parts}}" data-bind-class-toggle="victory-built:{{p.built}}">
<img class="victory-part-icon" data-bind-src="{{p.icon}}">
<span data-l10n="victory.part_booster_1" data-bind-if="{{p.key == 'booster_1'}}">
</span>
<span data-l10n="victory.part_booster_2" data-bind-if="{{p.key == 'booster_2'}}">
</span>
<span data-l10n="victory.part_booster_3" data-bind-if="{{p.key == 'booster_3'}}">
</span>
<span data-l10n="victory.part_cockpit" data-bind-if="{{p.key == 'cockpit'}}">
</span>
<span data-l10n="victory.part_stasis_chamber" data-bind-if="{{p.key == 'stasis_chamber'}}">
</span>
<span data-l10n="victory.part_engine" data-bind-if="{{p.key == 'engine'}}">
</span>
</div>
</div>
<div class="victory-ledger-row">
<span data-l10n="victory.apollo_teams" >
</span>
<span class="victory-value" data-bind-value="{{victory.science.apollo_teams}}" >
</span>
</div>
<button data-l10n="victory.space_details" class="victory-button" data-part="victory.space-details" data-on-click="set state.victory.view = 'space_race'">
</button>
</div>
</div>
</div>
<div class="victory-quadrants">
<div class="victory-quadrant victory-scroll">
<h2 data-l10n="victory.diplomacy" >
</h2>
<div data-l10n="victory.disabled_diplomacy" data-bind-if="{{!victory.diplomatic.enabled}}">
</div>
<div data-bind-if="{{victory.diplomatic.enabled}}">
<div data-l10n="victory.no_league" data-bind-if="{{!victory.diplomatic.league_active}}">
</div>
<div data-l10n="victory.un" data-bind-if="{{victory.diplomatic.un_active}}">
</div>
<div class="victory-ledger-row">
<span data-l10n="victory.session" >
</span>
<span class="victory-value" data-bind-value="{{victory.diplomatic.turns_to_session}}" >
</span>
</div>
<div class="victory-ledger-row">
<span data-l10n="victory.votes" >
</span>
<span class="victory-value" data-bind-value="{{victory.diplomatic.delegates_controlled}}" >
</span>
</div>
<div class="victory-ledger-row">
<span data-l10n="victory.votes_needed" >
</span>
<span class="victory-value" data-bind-value="{{victory.diplomatic.delegates_needed}}" >
</span>
</div>
</div>
</div>
<div class="victory-quadrant victory-scroll">
<h2 data-l10n="victory.culture" >
</h2>
<div data-l10n="victory.disabled_culture" data-bind-if="{{!victory.culture.enabled}}">
</div>
<div data-bind-if="{{victory.culture.enabled}}">
<div class="victory-ledger-row">
<span data-l10n="victory.influential" >
</span>
<span class="victory-value" data-bind-value="{{victory.culture.influential_count}}" >
</span>
</div>
<div class="victory-ledger-row">
<span data-l10n="victory.rivals" >
</span>
<span class="victory-value" data-bind-value="{{victory.culture.rivals_count}}" >
</span>
</div>
<div class="victory-capitals">
<div class="victory-capital" data-bind-for="c:{{victory.culture.civs}}">
<img class="victory-civ" data-bind-src="{{c.icon}}" data-bind-style-opacity="{{clamp(c.influence_pct, 0, 100) / 100}}">
<span class="victory-value" data-bind-value="{{c.influence_pct}}" >
</span>
</div>
</div>
</div>
</div>
</div>
</div>
<div class="victory-details victory-scroll" data-bind-if="{{state.victory.view == 'score'}}">
<h2 data-l10n="victory.ranking_title" >
</h2>
<div class="victory-ranking-row" data-part="victory.ranking-row" data-bind-for="r:{{victory.ranking}}">
<span class="victory-value" data-bind-value="{{r.rank}}" >
</span>
<img class="victory-icon" data-bind-src="{{r.icon}}">
<span data-l10n="victory.you" data-bind-if="{{r.is_you}}">
</span>
<span class="victory-name" data-bind-value="{{r.name}}" data-bind-if="{{!r.is_you}}">
</span>
<span class="victory-name" data-bind-value="{{r.civ_name}}" >
</span>
<span class="victory-score" data-bind-value="{{fmt.int(r.score)}}" data-part="victory.ranking-score">
</span>
<span data-l10n="victory.eliminated" data-bind-if="{{!r.alive}}">
</span>
</div>
</div>
<div class="victory-details victory-scroll" data-bind-if="{{state.victory.view == 'space_race'}}">
<h2 data-l10n="victory.space_title" >
</h2>
<div class="victory-ranking-row" data-bind-for="r:{{victory.space_race}}" data-bind-sort="{{(r.apollo ? 100 : 0) + r.parts_built}}" data-bind-sort-desc="{{true}}">
<img class="victory-icon" data-bind-src="{{r.icon}}">
<span data-l10n="victory.you_space" data-bind-if="{{r.is_you}}">
</span>
<span class="victory-name" data-bind-value="{{r.name}}" data-bind-if="{{!r.is_you}}">
</span>
<span class="victory-value" data-bind-value="{{r.parts_built}}" >
</span>
<span data-l10n="victory.apollo" data-bind-if="{{r.apollo}}">
</span>
</div>
</div>
<button data-l10n="victory.back" class="victory-button" data-part="victory.back-summary" data-bind-hotkey="{{'Enter'}}" data-bind-if="{{state.victory.view != 'summary'}}" data-on-click="set state.victory.view = 'summary'">
</button>
</div>
</div>
</section>
</div>
