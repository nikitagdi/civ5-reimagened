<div class="r sub" data-bind-for="i:{{r.items}}" data-bind-filter="{{state.economy.open_expense_units}}"><span class="k ell" data-bind-value="{{i.name}}"></span><b data-bind-value="{{i.value}}"></b></div>
</div>
<div data-bind-for="r:{{economy.finance.expense}}" data-bind-filter="{{r.key == 'buildings'}}">

<div class="r sub" data-bind-for="i:{{r.items}}" data-bind-filter="{{state.economy.open_expense_buildings}}"><span class="k ell" data-bind-value="{{i.name}}"></span><b data-bind-value="{{i.value}}"></b></div>

<div class="r sub" data-bind-for="i:{{r.items}}" data-bind-filter="{{state.economy.open_expense_improvements}}"><span class="k ell" data-bind-value="{{i.name}}"></span><b data-bind-value="{{i.value}}"></b></div>
</div>
<div data-bind-for="r:{{economy.finance.expense}}" data-bind-filter="{{r.key == 'diplomacy'}}">
<button class="r" data-on-click="toggle state.economy.open_expense_diplomacy" data-on-pointerenter="set state.economy.hover = 'diplomacy'"><span class="tg" data-bind-class-toggle="nil:{{len(r.items) == 0}}" data-bind-value="{{state.economy.open_expense_diplomacy ? '−' : '+'}}">+</span><span class="k" data-l10n="economy.ledger_expense_diplomacy"></span><b data-bind-value="{{r.value}}"></b></button>

<button class="h r" data-bind-class-toggle="on:{{state.economy.sort == 'culture'}}" data-on-click="set state.economy.sort_desc = state.economy.sort == 'culture' ? !state.economy.sort_desc : false; set state.economy.sort = 'culture'"><img class="gi s16" data-asset="font:ICON_CULTURE"></button>

<button class="h" data-bind-class-toggle="on:{{state.economy.sort == 'order'}}" data-on-click="set state.economy.sort_desc = state.economy.sort == 'order' ? !state.economy.sort_desc : false; set state.economy.sort = 'order'" data-l10n="economy.col_order"></button>
</div>
<div class="scr">
<div class="trow" data-part="economy.city-row" data-bind-for="c:{{economy.cities}}" data-bind-sort="{{state.economy.sort == 'population' ? c.population : state.economy.sort == 'growth_turns' ? c.growth_turns : state.economy.sort == 'name' ? c.name : state.economy.sort == 'defense' ? c.defense : state.economy.sort == 'food_per_turn' ? c.food_per_turn : state.economy.sort == 'production' ? c.production : state.economy.sort == 'science' ? c.science : state.economy.sort == 'gold' ? c.gold : state.economy.sort == 'culture' ? c.culture : state.economy.sort == 'faith' ? c.faith : state.economy.sort == 'golden_age' ? c.golden_age : state.economy.sort == 'order' ? c.order.name : c.name}}" data-bind-sort-desc="{{state.economy.sort_desc}}">
<div class="c pop"><b data-bind-value="{{c.population}}"></b><div class="scale food"><div class="fill fc" data-bind-style-width="{{clamp((c.food_stored + c.food_per_turn) / c.food_threshold, 0, 1) * 100}}%"></div><div class="fill" data-bind-style-width="{{clamp(c.food_stored / c.food_threshold, 0, 1) * 100}}%"></div><div class="ticks" data-bind-if="{{c.growth_turns != null && c.growth_turns > 0}}" data-bind-style-background-size="{{100 / c.growth_turns}}% 100%"></div></div></div>
<span class="c r" data-bind-class-toggle="c-neg:{{c.starving}}" data-bind-value="{{c.starving ? '−' : (c.growth_turns == null ? '−' : fmt.int(c.growth_turns))}}"></span>
<div class="c cty"><div class="l"><span class="nm ell" data-part="economy.city-name" data-bind-value="{{c.name}}"></span><svg class="i fill capi" data-bind-if="{{c.capital}}"><use href="#i-star"/></svg><span class="tag" data-l10n="economy.puppet" data-bind-if="{{c.puppet}}"></span><span class="tag neg" data-l10n="economy.occupied" data-bind-if="{{c.occupied}}"></span></div><div class="gauge hpb" data-bind-if="{{c.health_pct != null}}"><div class="fill hp-lo" data-bind-class-toggle="hp-hi:{{c.health_pct > 66}}; hp-md:{{c.health_pct > 33 && c.health_pct <= 66}}" data-bind-style-width="{{c.health_pct}}%"></div></div></div>
<span class="c r" data-bind-value="{{c.defense}}"></span>
<span class="c r" data-bind-class-toggle="c-neg:{{c.food_per_turn < 0}}" data-bind-value="{{fmt.signed(c.food_per_turn)}}"></span>
<span class="c r"><span data-bind-value="{{c.production}}"></span><span class="mod" data-bind-if="{{c.production_mod_pct != 0}}" data-bind-value="{{fmt.signed(c.production_mod_pct)}}"></span></span>
<span class="c r" data-bind-value="{{economy.options.science ? fmt.int(c.science) : '−'}}"></span>
<span class="c r" data-bind-value="{{c.gold}}"></span>
<span class="c r" data-bind-value="{{fmt.fixed(c.culture, 2)}}"></span>
<span class="c r" data-bind-value="{{economy.options.religion ? fmt.int(c.faith) : '−'}}"></span>
<span class="c r" data-part="economy.golden-age" data-bind-value="{{c.golden_age == null ? '−' : fmt.int(c.golden_age)}}"></span>
<button class="c ord" data-part="economy.production" data-bind-disabled="{{c.puppet}}" data-tooltip="economy-puppet" data-on-click="intent window.close(window: 'economy'); intent window.open(window: 'production', city: c.city_key)">
<div class="l" data-bind-if="{{c.order != null}}"><img class="gi s22" data-bind-src="{{c.order.icon}}"><span class="ell" data-bind-value="{{c.order.name}}"></span><span class="t" data-bind-value="{{c.order.turns}}"></span></div>
<div class="scale prod" data-bind-if="{{c.order != null && c.order.cost != null && c.order.cost > 0}}"><div class="fill fc" data-bind-style-width="{{clamp((c.order.stored + c.order.per_turn) / c.order.cost, 0, 1) * 100}}%"></div><div class="fill" data-bind-style-width="{{clamp(c.order.stored / c.order.cost, 0, 1) * 100}}%"></div><div class="ticks" data-bind-if="{{c.order.turns != null && c.order.turns > 0}}" data-bind-style-background-size="{{100 / c.order.turns}}% 100%"></div></div>
<span class="z" data-l10n="economy.choose" data-bind-if="{{c.order == null}}"></span>
</button>
</div>

</div>

<span class="c r" data-bind-value="{{fmt.signed(economy.totals.food)}}"></span>
<span class="c r" data-bind-value="{{economy.totals.production}}"></span>
<span class="c r" data-bind-value="{{economy.totals.science}}"></span>
<span class="c r" data-bind-value="{{economy.totals.gold}}"></span>
<span class="c r" data-bind-value="{{fmt.fixed(economy.totals.culture, 2)}}"></span>
<span class="c r" data-bind-value="{{economy.totals.faith}}"></span>
<span class="c r" data-bind-value="{{economy.totals.golden_age}}"></span>
<span class="c"></span>
</div>
