<span class="economy-value" data-bind-value="{{c.population}}" >
</span>
<div class="economy-bar">

</div>
</div>

<span class="economy-value" data-bind-value="{{c.starving ? 'в€’' : (c.growth_turns == null ? 'в€’' : fmt.int(c.growth_turns))}}" >

<small data-l10n="economy.puppet" data-bind-if="{{c.puppet}}">
</small>
<small data-l10n="economy.occupied" data-bind-if="{{c.occupied}}">

</div>
</div>
</div>
<span class="economy-value" data-bind-value="{{c.defense}}" >
</span>
<span class="economy-value" data-bind-value="{{c.food_per_turn}}" >
</span>
<div class="economy-cell">
<span class="economy-value" data-bind-value="{{c.production}}" >
</span>
<span class="economy-modifier" data-bind-value="{{fmt.signed(c.production_mod_pct)}}" >
</span>
</div>
<span class="economy-value" data-bind-value="{{economy.options.science ? fmt.int(c.science) : 'в€’'}}" >
</span>
<span class="economy-value" data-bind-value="{{c.gold}}" >
</span>
<span class="economy-value" data-bind-value="{{fmt.fixed(c.culture, 2)}}" >
</span>
<span class="economy-value" data-bind-value="{{economy.options.religion ? fmt.int(c.faith) : 'в€’'}}" >
</span>
<span class="economy-value" data-bind-value="{{c.golden_age == null ? 'в€’' : fmt.int(c.golden_age)}}" >
</span>
<button class="economy-order" data-part="economy.production" data-bind-disabled="{{c.puppet}}" data-tooltip="economy-puppet" data-on-click="intent window.close(window: 'economy'); intent window.open(window: 'production', city: c.city_key)">
<div data-bind-if="{{c.order != null}}">

</div>
<div class="economy-bar" data-bind-if="{{c.order.cost != null && c.order.cost > 0}}">

</div>
</div>
</div>
<span data-l10n="economy.choose" data-bind-if="{{c.order == null}}">

</button>
