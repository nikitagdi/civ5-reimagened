<template id="civ-ribbon-tip" data-layer="tooltip"><div class="civ_ribbon-tip"><div data-bind-if="{{civ_ribbon != null}}"><div data-bind-for="r:{{civ_ribbon.majors}}" data-bind-filter="{{r.id == state.civ_ribbon.hover}}"><b data-bind-value="{{r.name}}"></b><span data-bind-value="{{r.civ}}"></span><span data-bind-value="{{r.mood}}"></span><span data-bind-value="{{r.peace_block_reason}}"></span><span data-bind-value="{{r.action_reason}}"></span><div data-bind-if="{{r.treaty_turns != null}}"><span data-l10n="civ_ribbon.friendship">Friendship turns remaining</span><span data-bind-value="{{r.treaty_turns.friendship}}"></span></div></div><span data-bind-value="{{civ_ribbon.session_reason}}"></span></div></div></template>
<template data-layer="tooltip" id="tip-diplo-action"><div class="diplo-tip"><div data-bind-if="{{diplo != null}}"><div data-bind-for="m:{{diplo.majors}}" data-bind-filter="{{m.id == state.diplo.hover}}" data-bind-value="{{m.action_reason}}"></div></div></div></template>
<template data-layer="tooltip" id="tip-diplo-embassy"><div class="diplo-tip" data-l10n="diplo.embassy">Embassies</div></template>
<template data-layer="tooltip" id="tip-diplo-borders"><div class="diplo-tip" data-l10n="diplo.borders">Open borders</div></template>
<template id="leader-mood-tip" data-layer="tooltip"><div class="leader-tip"><div data-bind-if="{{leader != null}}"><b data-bind-value="{{leader.mood.label}}"></b><div class="leader-opinion" data-bind-for="r:{{leader.mood.reasons}}"><span data-bind-value="{{r.text}}"></span><span data-bind-value="{{r.value}}"></span></div></div></div></template>
<template id="leader-action-tip" data-layer="tooltip"><div class="leader-tip"><div data-bind-if="{{leader != null}}"><div data-bind-for="a:{{leader.main_actions}}" data-bind-filter="{{a.key == state.leader.hover}}"><span data-bind-value="{{a.reason}}"></span><span data-bind-value="{{a.tooltip}}"></span></div></div></div></template>
