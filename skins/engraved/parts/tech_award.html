<div class="wlayer dimmed" data-screen="tech_award" data-part="tech-award" data-bind-if="{{ui.windows.tech_award.open && tech_award != null && tech_award.tech != null}}">
  <section class="win pop w-m">
    <div class="hd">
      <div class="ttl"><b data-l10n="tech_panel.complete">Research complete</b><span class="sub" data-bind-value="{{tech_award.turn}}"></span></div>
      <div class="close"><span class="key" data-l10n="key.escape">Esc</span><button class="x" data-part="tech-award.close" data-on-click="intent window.close(window: 'tech_award')"><svg class="i"><use href="#i-close"/></svg></button></div>
    </div>
    <div class="scr">
      <div class="ta-hero"><img class="gi s80 ring" data-bind-src="{{tech_award.tech.icon}}"><div class="tx"><span class="ae" data-bind-value="{{tech_award.era}}"></span><b data-part="tech-award.name" data-bind-value="{{tech_award.tech.name}}"></b><div class="quote" data-bind-if="{{tech_award.quote != null}}"><span class="q" data-bind-value="{{tech_award.quote}}"></span><span class="by" data-bind-if="{{tech_award.quote_by != null}}" data-bind-value="{{tech_award.quote_by}}"></span></div></div></div>
      <div class="prose sm ta-help" data-bind-value="{{tech_award.help}}"></div><div class="chips ta-help" data-bind-if="{{len(tech_award.leads_to) > 0}}"><span class="sect" data-l10n="tech_award.leads">Leads to</span><span class="chip" data-bind-for="n:{{tech_award.leads_to}}" data-bind-value="{{n.name}}"></span></div>
      <div class="ta-ulk"><div class="sect" data-l10n="tech_award.unlocks">Unlocks</div><div class="ta-tiles"><div class="card pick ta-tile" data-part="tech-award.unlock" data-bind-for="u:{{tech_award.unlocks}}" data-tooltip="tech_award-tip" data-on-pointerenter="set state.tech_award.hover = u.key"><img class="gi s48" data-bind-src="{{u.icon}}"><span class="nm" data-bind-value="{{u.name}}"></span><span class="kd" data-bind-value="{{u.kind_name}}"></span></div></div></div>
    </div>
    <div class="wft"><button class="btn primary" data-part="tech-award.continue" data-hotkey="Enter" data-on-click="intent window.close(window: 'tech_award')"><span data-l10n="tech_award.continue">Continue</span><span class="key" data-hotkey-label>Enter</span></button></div>
  </section>
</div>
