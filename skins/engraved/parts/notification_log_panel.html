<div class="notification-log-panel" data-part="notes">
 <div class="notification-log-cards" data-part="notes.list"><div class="notification-log-card" data-bind-for="n:{{notes}}" data-bind-sort="{{n.turn}}" data-bind-sort-desc="{{true}}" data-on-click="intent note.activate(note: n.id)" data-on-pointerenter="set state.notification.hover = n.summary" data-tooltip="notification-card-tip">
  <span class="notification-log-lines"><span class="notification-log-summary" data-bind-value="{{n.summary}}"></span><span class="notification-log-kicker" data-bind-value="{{n.category}}"></span></span>
  <button class="notification-log-dismiss" data-l10n="notification.dismiss" data-on-click="intent note.dismiss(note: n.id); stop"></button>
 </div></div>
 <button class="notification-log-log" data-part="notes.log" data-hotkey="F7" data-l10n="notification.log" data-on-click="intent window.toggle(window: 'notification_log')"></button>
 <div data-include="parts/notes-extra.html"></div>
</div>
