<div class="wlayer dimmed" data-part="message" data-screen="message" data-bind-if="{{ui.windows.message.open}}" data-esc="intent screen.act(screen: 'message', action: 'ok', a: ui.windows.message.a)">
  <section class="win pop w-m" data-bind-class-toggle="w-s:{{message != null &amp;&amp; message.width == 'narrow'}}; w-l:{{message != null &amp;&amp; message.width == 'wide'}}">
    <div class="wbd prose sec" data-bind-if="{{message == null}}" data-l10n="message.loading"></div>
    <div class="hd" data-bind-if="{{message != null &amp;&amp; message.title != null}}">
      <img class="gi s48" data-bind-src="{{message.civ != null ? message.civ.icon : message.icon}}">
      <div class="ttl stack"><span class="kick" data-bind-value="{{message.kicker}}"></span><b data-part="message.title" data-bind-value="{{message.title}}"></b></div>
      <div class="close"><span class="key" data-l10n="key.escape">Esc</span><button class="x" data-on-click="intent screen.act(screen: 'message', action: 'ok', a: message.id)"><svg class="i"><use href="#i-close"/></svg></button></div>
    </div>
    <div class="msg-art" data-bind-if="{{message != null &amp;&amp; message.art != null}}">
      <img class="gi s128 mark" data-bind-src="{{message.art}}">
      <div class="cap" data-bind-if="{{message.band != null}}"><b data-bind-value="{{message.band.name}}"></b><span data-bind-value="{{message.band.note}}"></span></div>
    </div>
    <div class="wbd" data-bind-if="{{message != null}}" data-bind-class-toggle="msg-text:{{message.title == null}}">
      <div class="quote" data-bind-if="{{message.quote != null}}"><span class="q" data-bind-value="{{message.quote.text}}"></span><span class="by" data-bind-value="{{message.quote.by}}"></span></div>
      <div class="prose" data-part="message.text" data-bind-if="{{message.text != null}}" data-bind-value="{{message.text}}"></div>
      <div class="sect" data-bind-if="{{message.facts_title != null}}"><span data-bind-value="{{message.facts_title}}"></span><i class="rule"></i></div>
      <div class="kv">
        <div class="r" data-bind-for="f:{{message.facts}}"><span class="k" data-bind-value="{{f.label}}"></span><b><span data-bind-value="{{f.value}}"></span><span class="yv" data-bind-for="y:{{f.yields}}"><span data-bind-value="{{y.value}}"></span><img class="gi" data-bind-src="{{y.yield == 'gold' ? 'font:ICON_GOLD' : y.yield == 'faith' ? 'font:ICON_PEACE' : y.yield == 'culture' ? 'font:ICON_CULTURE' : y.yield == 'science' ? 'font:ICON_RESEARCH' : y.yield == 'production' ? 'font:ICON_PRODUCTION' : y.yield == 'food' ? 'font:ICON_FOOD' : y.yield == 'tourism' ? 'font:ICON_TOURISM' : y.yield == 'influence' ? 'font:ICON_INFLUENCE' : 'font:ICON_HAPPINESS_1'}}"></span></b></div>
      </div>
    </div>
    <div class="wft" data-bind-if="{{message != null}}"><button class="btn primary" data-part="message.ok" data-bind-hotkey="'Enter'" data-bind-disabled="{{!message.available}}" data-on-click="intent screen.act(screen: 'message', action: 'ok', a: message.id)"><span data-bind-value="{{message.button}}"></span><span class="key" data-hotkey-label>Enter</span></button></div>
  </section>
</div>
