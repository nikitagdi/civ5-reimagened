<div class="religion-screen" data-screen="religion" data-part="religion" data-bind-if="{{ui.windows.religion.open && religion != null}}">
<section class="religion-window">
<div class="religion-head"><b class="religion-title" data-bind-if="{{religion.mode == 'found'}}" data-l10n="religion.found">Found a religion</b><b class="religion-title" data-bind-if="{{religion.mode == 'enhance'}}" data-l10n="religion.enhance">Enhance a religion</b><span data-bind-if="{{religion.city != null}}" data-bind-value="{{religion.city.name}}"></span><span data-bind-value="{{religion.date}}"></span></div>
<div class="religion-symbols"><button class="religion-symbol" data-part="religion.symbol" data-bind-for="s:{{religion.symbols}}" data-bind-disabled="{{s.taken || religion.mode == 'enhance'}}" data-bind-class-toggle="religion-selected:{{s.id == state.religion.symbol}}" data-tooltip="religion-symbol-tip" data-on-pointerenter="set state.religion.hover = s.id" data-on-click="call religion.symbol(s.id)"><img data-bind-src="{{s.icon}}"><span data-part="religion.name" data-bind-value="{{s.name}}"></span></button></div>
<div class="religion-body"><div class="religion-main"><b class="religion-title" data-bind-value="{{state.religion.symbol_name}}"></b><button class="religion-button" data-bind-if="{{religion.mode == 'found'}}" data-on-click="set state.religion.rename = true" data-l10n="religion.rename">Rename religion</button>
<div class="religion-grid"><div class="religion-slot" data-bind-for="s:{{religion.slots}}" data-bind-class-toggle="religion-fixed:{{s.state == 'fixed'}}">
<span data-bind-if="{{s.key == 'pantheon'}}" data-l10n="religion.pantheon">pantheon</span><b data-bind-if="{{s.key == 'pantheon'}}" data-bind-value="{{state.religion.label.pantheon}}"></b>
<span data-bind-if="{{s.key == 'founder'}}" data-l10n="religion.founder">founder</span><b data-bind-if="{{s.key == 'founder'}}" data-bind-value="{{state.religion.label.founder}}"></b>
<span data-bind-if="{{s.key == 'follower'}}" data-l10n="religion.follower">follower</span><b data-bind-if="{{s.key == 'follower'}}" data-bind-value="{{state.religion.label.follower}}"></b>
<span data-bind-if="{{s.key == 'follower2'}}" data-l10n="religion.follower2">follower2</span><b data-bind-if="{{s.key == 'follower2'}}" data-bind-value="{{state.religion.label.follower2}}"></b>
<span data-bind-if="{{s.key == 'enhancer'}}" data-l10n="religion.enhancer">enhancer</span><b data-bind-if="{{s.key == 'enhancer'}}" data-bind-value="{{state.religion.label.enhancer}}"></b>
<span data-bind-if="{{s.key == 'bonus'}}" data-l10n="religion.bonus">bonus</span><b data-bind-if="{{s.key == 'bonus'}}" data-bind-value="{{state.religion.label.bonus}}"></b>
<div data-bind-if="{{s.fixed != null}}"><b data-bind-value="{{s.fixed.name}}"></b><p data-bind-value="{{s.fixed.effect}}"></p></div><span data-bind-if="{{s.reason != null}}" data-bind-value="{{s.reason}}"></span><button class="religion-button" data-part="religion.slot.pantheon" data-bind-if="{{s.state == 'choose' && s.key == 'pantheon'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="religion-button" data-part="religion.slot.founder" data-bind-if="{{s.state == 'choose' && s.key == 'founder'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="religion-button" data-part="religion.slot.follower" data-bind-if="{{s.state == 'choose' && s.key == 'follower'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="religion-button" data-part="religion.slot.follower2" data-bind-if="{{s.state == 'choose' && s.key == 'follower2'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="religion-button" data-part="religion.slot.enhancer" data-bind-if="{{s.state == 'choose' && s.key == 'enhancer'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="religion-button" data-part="religion.slot.bonus" data-bind-if="{{s.state == 'choose' && s.key == 'bonus'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button></div></div></div>
<div class="religion-side"><div data-bind-if="{{state.religion.list == ''}}"><span class="religion-reason" data-bind-if="{{religion.reason != null}}" data-bind-value="{{religion.reason}}"></span><span data-bind-if="{{!state.religion.ready}}" data-l10n="religion.missing">Choose a symbol and every required belief first.</span></div>
<div data-bind-for="s:{{religion.slots}}" data-bind-filter="{{s.key == state.religion.list}}"><button class="religion-option" data-part="religion.option" data-bind-disabled="{{(b.id == state.religion.pick.pantheon && s.key != 'pantheon') || (b.id == state.religion.pick.founder && s.key != 'founder') || (b.id == state.religion.pick.follower && s.key != 'follower') || (b.id == state.religion.pick.follower2 && s.key != 'follower2') || (b.id == state.religion.pick.enhancer && s.key != 'enhancer') || (b.id == state.religion.pick.bonus && s.key != 'bonus')}}" data-bind-for="b:{{s.options}}" data-on-click="call religion.pick(s.key, b.id)"><b data-bind-value="{{b.name}}"></b><span data-bind-value="{{b.effect}}"></span></button></div><button class="religion-button" data-bind-if="{{state.religion.list != '' && !state.religion.confirm && !state.religion.rename}}" data-on-click="set state.religion.list = ''" data-l10n="religion.back">Back</button></div></div>
<div class="religion-footer"><button class="religion-button" data-on-click="intent window.close(window: 'religion')" data-l10n="religion.close">Close</button><button class="religion-button" data-part="religion.finish" data-bind-if="{{state.religion.list == ''}}" data-bind-disabled="{{!state.religion.ready}}" data-on-click="set state.religion.confirm = true" data-l10n="religion.submit">Confirm</button></div>
<div class="religion-overlay" data-bind-if="{{state.religion.rename}}"><div class="religion-dialog"><b class="religion-title" data-l10n="religion.rename">Rename religion</b><input class="religion-input" type="text" data-bind-model="state.religion.name"><span class="religion-reason" data-bind-value="{{religion.custom_name_reason}}"></span><button class="religion-button" data-on-click="set state.religion.name = ''; set state.religion.rename = false" data-l10n="religion.default">Use default name</button><button class="religion-button" data-on-click="set state.religion.rename = false" data-l10n="religion.back">Back</button></div></div>
<div class="religion-overlay" data-bind-if="{{state.religion.confirm && !state.religion.rename}}"><div class="religion-dialog"><b class="religion-title" data-l10n="religion.confirm">Confirm religion choices?</b><span data-bind-value="{{state.religion.symbol_name}}"></span><button class="religion-button" data-part="religion.confirm" data-on-click="call religion.submit()" data-l10n="religion.submit">Confirm</button><button class="religion-button" data-on-click="set state.religion.confirm = false" data-l10n="religion.back">Back</button></div></div>
</section></div>
<template data-layer="tooltip" id="religion-symbol-tip"><div class="religion-tip" data-bind-if="{{religion != null}}"><div data-bind-for="s:{{religion.symbols}}" data-bind-filter="{{s.id == state.religion.hover}}"><b data-bind-value="{{s.name}}"></b><p data-bind-value="{{s.tooltip}}"></p><span data-bind-if="{{s.founder != null}}" data-bind-value="{{s.founder}}"></span></div></div></template>
