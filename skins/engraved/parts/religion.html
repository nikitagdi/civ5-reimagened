<div class="wlayer dimmed" data-screen="religion" data-esc="call policies.escape()" data-part="religion" data-bind-if="{{ui.windows.religion.open && religion != null}}">
<section class="win w-xxl rel-win">
<div class="hd"><img class="gi s48" data-bind-src="{{religion.emblem}}"><div class="ttl stack"><span class="kick"><span data-bind-if="{{religion.city != null}}" data-bind-value="{{religion.city.name}}"></span><span data-bind-value="{{religion.date}}"></span></span><b data-bind-if="{{religion.mode == 'found'}}" data-l10n="religion.found">Found a religion</b><b data-bind-if="{{religion.mode == 'enhance'}}" data-l10n="religion.enhance">Enhance a religion</b></div><div class="close"><span class="key" data-l10n="key.escape">Esc</span><button class="x" data-on-click="intent window.close(window: 'religion')"><svg class="i"><use href="#i-close"/></svg></button></div></div>
<div class="rel-sym"><button class="rel-s" data-part="religion.symbol" data-bind-for="s:{{religion.symbols}}" data-bind-disabled="{{s.taken || religion.mode == 'enhance'}}" data-bind-class-toggle="on:{{s.id == state.religion.symbol}}" data-tooltip="religion-symbol-tip" data-on-pointerenter="set state.religion.hover = s.id" data-on-click="call religion.symbol(s.id)"><img class="gi s48" data-bind-src="{{s.icon}}"><span data-part="religion.name" data-bind-value="{{s.name}}"></span></button></div>
<div class="rel-body"><div class="rel-main"><b class="rel-nm" data-bind-value="{{state.religion.symbol_name}}"></b><button class="btn sm" data-bind-if="{{religion.mode == 'found'}}" data-on-click="set state.religion.rename = true" data-l10n="religion.rename">Rename religion</button>
<div class="rel-grid"><div class="card rel-slot" data-bind-for="s:{{religion.slots}}" data-bind-class-toggle="lock:{{s.state == 'locked'}}"><span class="k" data-bind-value="{{s.label}}"></span>
<b data-bind-if="{{s.key == 'pantheon'}}" data-bind-value="{{state.religion.label.pantheon}}"></b>
<b data-bind-if="{{s.key == 'founder'}}" data-bind-value="{{state.religion.label.founder}}"></b>
<b data-bind-if="{{s.key == 'follower'}}" data-bind-value="{{state.religion.label.follower}}"></b>
<b data-bind-if="{{s.key == 'follower2'}}" data-bind-value="{{state.religion.label.follower2}}"></b>
<b data-bind-if="{{s.key == 'enhancer'}}" data-bind-value="{{state.religion.label.enhancer}}"></b>
<b data-bind-if="{{s.key == 'bonus'}}" data-bind-value="{{state.religion.label.bonus}}"></b>
<img class="gi s48 round" data-bind-if="{{s.fixed != null}}" data-bind-src="{{s.fixed.icon}}"><b class="fx" data-bind-if="{{s.fixed != null}}" data-bind-value="{{s.fixed.name}}"></b><div class="cs" data-bind-if="{{s.fixed != null}}" data-bind-value="{{s.fixed.effect}}"></div><span class="why" data-bind-if="{{s.reason != null}}" data-bind-value="{{s.reason}}"></span><button class="btn sm" data-part="religion.slot.pantheon" data-bind-if="{{s.state == 'choose' && s.key == 'pantheon'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="btn sm" data-part="religion.slot.founder" data-bind-if="{{s.state == 'choose' && s.key == 'founder'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="btn sm" data-part="religion.slot.follower" data-bind-if="{{s.state == 'choose' && s.key == 'follower'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="btn sm" data-part="religion.slot.follower2" data-bind-if="{{s.state == 'choose' && s.key == 'follower2'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="btn sm" data-part="religion.slot.enhancer" data-bind-if="{{s.state == 'choose' && s.key == 'enhancer'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button><button class="btn sm" data-part="religion.slot.bonus" data-bind-if="{{s.state == 'choose' && s.key == 'bonus'}}" data-on-click="set state.religion.list = s.key" data-l10n="religion.pick">Choose a belief</button></div></div></div>
<div class="rel-side"><div data-bind-if="{{state.religion.list == ''}}"><span class="why neg" data-bind-if="{{religion.reason != null}}" data-bind-value="{{religion.reason}}"></span><span class="why" data-bind-if="{{!state.religion.ready}}" data-l10n="religion.missing">Choose a symbol and every required belief first.</span></div>
<div data-bind-for="s:{{religion.slots}}" data-bind-filter="{{s.key == state.religion.list}}"><button class="lrow rel-opt" data-part="religion.option" data-bind-disabled="{{(b.id == state.religion.pick.pantheon && s.key != 'pantheon') || (b.id == state.religion.pick.founder && s.key != 'founder') || (b.id == state.religion.pick.follower && s.key != 'follower') || (b.id == state.religion.pick.follower2 && s.key != 'follower2') || (b.id == state.religion.pick.enhancer && s.key != 'enhancer') || (b.id == state.religion.pick.bonus && s.key != 'bonus')}}" data-bind-for="b:{{s.options}}" data-on-click="call religion.pick(s.key, b.id)"><img class="gi s45 round" data-bind-src="{{b.icon}}"><span class="tx"><b data-bind-value="{{b.name}}"></b><span data-bind-value="{{b.effect}}"></span></span></button></div><button class="btn c" data-bind-if="{{state.religion.list != '' && !state.religion.confirm && !state.religion.rename}}" data-on-click="set state.religion.list = ''" data-l10n="religion.back">Back</button></div></div>
<div class="wft"><button class="btn c" data-on-click="intent window.close(window: 'religion')" data-l10n="religion.close">Close</button><button class="btn primary c" data-part="religion.finish" data-bind-if="{{state.religion.list == ''}}" data-bind-disabled="{{!state.religion.ready}}" data-on-click="set state.religion.confirm = true" data-l10n="religion.submit">Confirm</button></div>
<div class="wlayer in" data-bind-if="{{state.religion.rename}}"><div class="win pop w-s"><div class="hd"><div class="ttl"><b data-l10n="religion.rename">Rename religion</b></div></div><div class="wbd"><input class="field lg rel-in" type="text" data-bind-model="state.religion.name"><span class="why neg" data-bind-value="{{religion.custom_name_reason}}"></span></div><div class="wft"><button class="btn c" data-on-click="set state.religion.name = ''; set state.religion.rename = false" data-l10n="religion.default">Use default name</button><button class="btn primary c" data-on-click="set state.religion.rename = false" data-l10n="religion.back">Back</button></div></div></div>
<div class="wlayer in" data-bind-if="{{state.religion.confirm && !state.religion.rename}}"><div class="win pop w-s"><div class="hd"><div class="ttl stack"><span class="kick" data-bind-value="{{state.religion.symbol_name}}"></span><b data-l10n="religion.confirm">Confirm religion choices?</b></div></div><div class="wft"><button class="btn c" data-on-click="set state.religion.confirm = false" data-l10n="religion.back">Back</button><button class="btn primary c" data-part="religion.confirm" data-bind-hotkey="'Enter'" data-on-click="call religion.submit()"><span data-l10n="religion.submit">Confirm</span><span class="key" data-hotkey-label>Enter</span></button></div></div></div>
</section></div>
