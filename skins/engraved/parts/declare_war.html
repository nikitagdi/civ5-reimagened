<section class="declare_war-panel" data-part="declare-war" data-screen="declare_war" data-esc="intent screen.act(screen: 'declare_war', action: 'cancel')" data-bind-if="{{ui.windows.declare_war.open}}">
  <p class="declare_war-reason" data-part="declare-war.unavailable" data-bind-if="{{declare_war == null}}" data-l10n="declare_war.unavailable"></p>
  <div class="declare_war-body" data-bind-if="{{declare_war != null}}">
    <div class="declare_war-sides" data-bind-if="{{declare_war.me != null &amp;&amp; declare_war.target != null}}"><div class="declare_war-side"><img data-bind-src="{{declare_war.me.icon_leader}}"><div><b data-bind-value="{{declare_war.me.name}}"></b><span data-bind-value="{{declare_war.me.civ}}"></span></div></div><span class="declare_war-swords" data-l10n="declare_war.war_mark">⚔</span><div class="declare_war-side"><div><b data-part="declare-war.target" data-bind-value="{{declare_war.target.name}}"></b><span data-bind-value="{{declare_war.target.civ}}"></span></div><img data-bind-src="{{declare_war.target.icon_civ}}"></div></div>
    <h1 data-bind-if="{{declare_war.kind == 'declare_war'}}" data-l10n="declare_war.title">Declare war?</h1><h1 data-bind-if="{{declare_war.kind == 'plunder_confirm'}}" data-l10n="declare_war.plunder_title">Plunder this caravan?</h1>
    <p data-bind-value="{{declare_war.question}}"></p><p class="declare_war-hint" data-bind-if="{{declare_war.peaceful_hint != null}}" data-bind-value="{{declare_war.peaceful_hint}}"></p>
    <div class="declare_war-section"><button data-on-click="set state.declare_war.diplomacy = !state.declare_war.diplomacy" data-l10n="declare_war.diplomacy">Diplomacy</button><div data-bind-if="{{!state.declare_war.diplomacy}}"><div class="declare_war-line" data-bind-for="d:{{declare_war.diplomacy}}"><span data-bind-value="{{d.text}}"></span><span data-bind-value="{{d.turns}}"></span></div><p class="declare_war-muted" data-bind-if="{{len(declare_war.diplomacy) == 0}}" data-l10n="declare_war.none">None</p></div></div>
    <div class="declare_war-section" data-bind-if="{{len(declare_war.protectors) > 0}}"><button data-on-click="set state.declare_war.protectors = !state.declare_war.protectors" data-l10n="declare_war.protectors">Under protection of</button><div class="declare_war-icons" data-bind-if="{{!state.declare_war.protectors}}"><div class="declare_war-side" data-bind-for="p:{{declare_war.protectors}}"><img data-bind-src="{{p.icon_civ}}"><b data-bind-value="{{p.name}}"></b></div></div></div>
    <div class="declare_war-section" data-bind-if="{{len(declare_war.allied_city_states) > 0}}"><button data-on-click="set state.declare_war.allies = !state.declare_war.allies" data-l10n="declare_war.allies">Their allied city-states</button><div class="declare_war-icons" data-bind-if="{{!state.declare_war.allies}}"><div class="declare_war-side" data-bind-for="a:{{declare_war.allied_city_states}}"><img data-bind-src="{{a.icon}}"><b data-bind-value="{{a.name}}"></b></div></div></div>
    <div class="declare_war-section"><button data-on-click="set state.declare_war.deals = !state.declare_war.deals" data-l10n="declare_war.deals">Active deals — cancelled by war</button><div data-bind-if="{{!state.declare_war.deals}}"><p class="declare_war-muted" data-bind-value="{{declare_war.deals_reason}}"></p><div class="declare_war-deals"><div><b data-l10n="declare_war.from_them">From them</b><div class="declare_war-line" data-bind-for="d:{{declare_war.deals_from_them}}"><span data-bind-value="{{d.text}}"></span><span data-bind-value="{{d.turns_left}}"></span></div></div><div><b data-l10n="declare_war.from_you">From you</b><div class="declare_war-line" data-bind-for="d:{{declare_war.deals_from_you}}"><span data-bind-value="{{d.text}}"></span><span data-bind-value="{{d.turns_left}}"></span></div></div></div></div></div>
    <div class="declare_war-section"><button data-on-click="set state.declare_war.routes = !state.declare_war.routes" data-l10n="declare_war.routes">Trade routes — will be cut</button><div data-bind-if="{{!state.declare_war.routes}}"><div class="declare_war-route" data-bind-for="r:{{declare_war.routes}}"><div><span data-bind-value="{{r.from_city}}"></span><span data-l10n="declare_war.arrow">→</span><span data-bind-value="{{r.to_city}}"></span></div><div><span data-bind-for="y:{{r.ours}}"><span data-bind-value="{{y.yield}}"></span><span data-bind-value="{{fmt.fixed(y.value, 2)}}"></span></span></div><div><span data-bind-for="y:{{r.theirs}}"><span data-bind-value="{{y.yield}}"></span><span data-bind-value="{{fmt.fixed(y.value, 2)}}"></span></span></div></div></div></div>
    <div class="declare_war-section" data-bind-if="{{declare_war.route != null}}"><div class="declare_war-line"><span data-l10n="declare_war.route">Route</span><span data-bind-value="{{declare_war.route.from_city}}"></span><span data-bind-value="{{declare_war.route.to_city}}"></span></div><div class="declare_war-line"><span data-l10n="declare_war.owner">Owner</span><span data-bind-value="{{declare_war.route.owner_name}}"></span></div><div class="declare_war-line" data-bind-if="{{declare_war.affected != null}}"><span data-l10n="declare_war.affected">Also affects</span><span data-bind-value="{{declare_war.affected.civ}}"></span><span data-bind-value="{{declare_war.affected.name}}"></span></div><div class="declare_war-line"><span data-l10n="declare_war.loot">Loot</span><b data-bind-value="{{declare_war.route.loot_gold}}"></b></div></div>
    <p class="declare_war-reason" data-part="declare-war.reason" data-bind-value="{{declare_war.disabled_reason}}"></p>
  </div>
  <footer class="declare_war-footer"><button class="declare_war-enter" data-bind-hotkey="'Enter'" data-on-click="set state.declare_war.routes = state.declare_war.routes" data-l10n="declare_war.enter">Enter does not confirm.</button><button data-part="declare-war.cancel" data-on-click="intent screen.act(screen: 'declare_war', action: 'cancel')" data-l10n="declare_war.cancel">Keep the peace</button><div data-bind-if="{{declare_war != null}}"><button class="declare_war-confirm" data-part="declare-war.confirm" data-bind-disabled="{{!declare_war.enabled || len(ui.pending) > 0}}" data-bind-if="{{declare_war.kind == 'declare_war' &amp;&amp; declare_war.target != null}}" data-on-click="intent screen.act(screen: 'declare_war', action: 'confirm', a: declare_war.target.team, b: -1)" data-l10n="declare_war.confirm">Declare war</button><button class="declare_war-confirm" data-bind-if="{{declare_war.kind == 'plunder_confirm'}}" data-bind-disabled="{{!declare_war.enabled || len(ui.pending) > 0}}" data-on-click="intent screen.act(screen: 'declare_war', action: 'plunder', a: declare_war.unit != null ? declare_war.unit.id : -1, b: declare_war.ignore_warning_team != null ? declare_war.ignore_warning_team : -1)" data-l10n="declare_war.plunder">Plunder</button></div></footer>
</section>
