<div class="pantheon-screen" data-screen="pantheon" data-esc="call policies.escape()" data-part="pantheon" data-bind-if="{{ui.windows.pantheon.open && pantheon != null}}">
  <section class="pantheon-window">
    <div class="pantheon-head"><img class="pantheon-emblem" data-bind-src="{{pantheon.emblem}}"><div><b class="pantheon-title" data-bind-if="{{pantheon.mode == 'pantheon'}}" data-l10n="pantheon.title">Found a pantheon</b><b class="pantheon-title" data-bind-if="{{pantheon.mode == 'reformation'}}" data-l10n="pantheon.reform">Add a Reformation belief</b><p data-l10n="pantheon.subtitle">Choose one belief for your people. Beliefs taken by other civilizations are not listed.</p></div></div>
    <span class="pantheon-reason" data-bind-if="{{pantheon.reason != null}}" data-bind-value="{{pantheon.reason}}"></span>
    <div class="pantheon-list"><button class="pantheon-row" data-part="pantheon.row" data-bind-for="b:{{pantheon.beliefs}}" data-bind-disabled="{{!pantheon.enabled}}" data-on-click="set state.pantheon.confirm = b.id; set state.pantheon.name = b.name; set state.pantheon.effect = b.effect"><img class="pantheon-icon" data-bind-src="{{b.icon}}"><div class="pantheon-label"><b data-part="pantheon.name" data-bind-value="{{b.name}}"></b><span data-bind-value="{{b.effect}}"></span></div></button></div>
    <div class="pantheon-footer"><button class="pantheon-button" data-on-click="intent window.close(window: 'pantheon')" data-l10n="pantheon.back">Back</button><span data-l10n="pantheon.waiting">The turn cannot end until you choose</span></div>
    <div class="pantheon-overlay" data-bind-if="{{state.pantheon.confirm >= 0}}"><div class="pantheon-dialog"><b class="pantheon-title" data-l10n="pantheon.confirm" data-l10n-args="{{state.pantheon.name}}">Choose belief?</b><p data-bind-value="{{state.pantheon.effect}}"></p><button class="pantheon-button pantheon-confirm-control" data-part="pantheon.confirm" data-bind-hotkey="'Enter'" data-on-click="intent screen.act(screen: 'pantheon', action: 'choose', a: state.pantheon.confirm); set state.pantheon.confirm = -1" data-l10n="pantheon.choose">Choose</button><button class="pantheon-button" data-on-click="set state.pantheon.confirm = -1" data-l10n="pantheon.back">Back</button></div></div>
  </section>
</div>
