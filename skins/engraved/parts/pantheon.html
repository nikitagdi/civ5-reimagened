<div class="wlayer dimmed" data-screen="pantheon" data-esc="call policies.escape()" data-part="pantheon" data-bind-if="{{ui.windows.pantheon.open && pantheon != null}}">
  <section class="win w-l pan-win">
    <div class="hd tall"><img class="gi s48" data-bind-src="{{pantheon.emblem}}"><div class="ttl stack"><b data-bind-if="{{pantheon.mode == 'pantheon'}}" data-l10n="pantheon.title">Found a pantheon</b><b data-bind-if="{{pantheon.mode == 'reformation'}}" data-l10n="pantheon.reform">Add a Reformation belief</b><span class="sub" data-l10n="pantheon.subtitle">Choose one belief for your people. Beliefs taken by other civilizations are not listed.</span></div><span class="req" data-l10n="pantheon.waiting">The turn cannot end until you choose</span></div>
    <span class="why neg pan-why" data-bind-if="{{pantheon.reason != null}}" data-bind-value="{{pantheon.reason}}"></span>
    <div class="scr"><button class="lrow pan-row" data-part="pantheon.row" data-bind-for="b:{{pantheon.beliefs}}" data-bind-disabled="{{!pantheon.enabled}}" data-on-click="set state.pantheon.confirm = b.id; set state.pantheon.name = b.name; set state.pantheon.effect = b.effect"><img class="gi s48 round" data-bind-src="{{b.icon}}"><span class="tx"><b data-part="pantheon.name" data-bind-value="{{b.name}}"></b><span data-bind-value="{{b.effect}}"></span></span></button></div>
    <div class="wft"><button class="btn c" data-on-click="intent window.close(window: 'pantheon')" data-l10n="pantheon.back">Back</button></div>
    <div class="wlayer in" data-bind-if="{{state.pantheon.confirm >= 0}}"><div class="win pop w-s"><div class="hd"><div class="ttl"><b data-l10n="pantheon.confirm" data-l10n-args="{{state.pantheon.name}}">Choose belief?</b></div></div><div class="wbd"><div class="prose sm" data-bind-value="{{state.pantheon.effect}}"></div></div><div class="wft"><button class="btn c" data-on-click="set state.pantheon.confirm = -1" data-l10n="pantheon.back">Back</button><button class="btn primary c" data-part="pantheon.confirm" data-bind-hotkey="'Enter'" data-on-click="intent screen.act(screen: 'pantheon', action: 'choose', a: state.pantheon.confirm); set state.pantheon.confirm = -1"><span data-l10n="pantheon.choose">Choose</span><span class="key" data-hotkey-label>Enter</span></button></div></div></div>
  </section>
</div>
