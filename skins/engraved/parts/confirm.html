<div class="wlayer dimmed" data-part="confirm" data-screen="confirm" data-bind-if="{{ui.windows.confirm.open}}" data-esc="intent screen.act(screen: 'confirm', action: 'choose', a: confirm.id, b: confirm.esc_choice == null ? -1 : confirm.esc_choice, c: 0)">
  <section class="win pop w-m">
    <div class="wbd prose sec" data-bind-if="{{confirm == null}}" data-l10n="confirm.loading"></div>
    <div class="hd" data-bind-if="{{confirm != null}}">
      <img class="gi s64" data-bind-if="{{confirm.icon != null}}" data-bind-src="{{confirm.icon}}">
      <div class="ttl stack"><span class="kick" data-bind-value="{{confirm.kicker}}"></span><b data-part="confirm.title" data-bind-value="{{confirm.title}}"></b></div>
      <div class="who cf-who" data-bind-if="{{confirm.advisor != null}}"><img class="gi s48 round" data-bind-src="{{confirm.advisor.portrait}}"><span class="tx" data-bind-value="{{confirm.advisor.name}}"></span></div>
    </div>
    <div class="wbd" data-bind-if="{{confirm != null}}">
      <div class="prose" data-part="confirm.text" data-bind-value="{{confirm.text}}"></div>
      <div class="cf-conseq" data-bind-if="{{confirm.consequence != null}}" data-bind-value="{{confirm.consequence.text}}"></div>
      <div class="kv"><div class="r" data-bind-for="f:{{confirm.facts}}"><span class="k" data-bind-value="{{f.label}}"></span><b><span data-bind-value="{{f.value}}"></span><img class="gi s16" data-bind-if="{{f.yield != null}}" data-bind-src="{{f.yield == 'gold' ? 'font:ICON_GOLD' : f.yield == 'faith' ? 'font:ICON_PEACE' : f.yield == 'culture' ? 'font:ICON_CULTURE' : f.yield == 'science' ? 'font:ICON_RESEARCH' : f.yield == 'production' ? 'font:ICON_PRODUCTION' : f.yield == 'food' ? 'font:ICON_FOOD' : f.yield == 'tourism' ? 'font:ICON_TOURISM' : f.yield == 'influence' ? 'font:ICON_INFLUENCE' : 'font:ICON_HAPPINESS_1'}}"></b></div></div>
      <button class="opt" data-bind-if="{{confirm.dont_warn != null}}" data-control="checkbox" data-bind-model="state.confirm.dont_warn" data-bind-class-toggle="on:{{state.confirm.dont_warn}}"><span class="chk"><svg class="i"><use href="#i-check"/></svg></span><span data-bind-value="{{confirm.dont_warn.label}}"></span></button>
    </div>
    <div class="wft" data-bind-if="{{confirm != null}}">
      <span class="note" data-bind-if="{{!confirm.closable}}" data-l10n="confirm.required"></span>
      <button class="btn c" data-part="confirm.choice" data-bind-for="c:{{confirm.choices}}" data-bind-filter="{{confirm.kind != 'exit_game' || c.id != 0}}" data-bind-class-toggle="primary:{{c.primary}}" data-bind-disabled="{{!c.enabled}}" data-on-pointerenter="set state.confirm.hover = c.id" data-tooltip="confirm-choice-tip" data-bind-hotkey="{{confirm.enter_choice != null &amp;&amp; c.id == confirm.enter_choice ? 'Enter' : ''}}" data-on-click="intent screen.act(screen: 'confirm', action: 'choose', a: confirm.id, b: c.id, c: state.confirm.dont_warn ? 1 : 0)" data-bind-value="{{c.label}}"></button>
      <button class="btn primary c" data-part="confirm.leave" data-bind-for="c:{{confirm.choices}}" data-bind-filter="{{confirm.kind == 'exit_game' &amp;&amp; c.id == 0}}" data-bind-disabled="{{!c.enabled}}" data-bind-value="{{c.label}}" data-on-click="intent screen.act(screen: 'confirm', action: 'choose', a: confirm.id, b: 0, c: 0, then: 'leave')"></button>
    </div>
  </section>
</div>
