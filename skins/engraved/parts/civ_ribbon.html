<aside class="civ_ribbon-panel" data-part="civ-ribbon" data-bind-class-toggle="civ_ribbon-left:{{state.civ_ribbon.left}}; civ_ribbon-folded:{{!state.civ_ribbon.visible}}">
  <nav class="civ_ribbon-corner"><button class="civ_ribbon-toggle" data-part="civ-ribbon.toggle" data-hotkey="Digit1" data-on-click="call civ_ribbon.toggle()" data-l10n="civ_ribbon.toggle">Civilizations</button><button data-part="civ-ribbon.diplo" data-on-click="intent window.open(window: 'diplo')" data-l10n="civ_ribbon.diplo">Diplomacy</button><button data-on-click="set state.civ_ribbon.left = !state.civ_ribbon.left" data-l10n="civ_ribbon.side">⇄</button></nav>
  <div class="civ_ribbon-scroll" data-bind-if="{{civ_ribbon != null && state.civ_ribbon.visible}}"><div class="civ_ribbon-major" data-bind-for="r:{{civ_ribbon.majors}}" data-bind-class-toggle="civ_ribbon-war:{{r.at_war}}" data-on-pointerenter="set state.civ_ribbon.hover = r.id" data-tooltip="civ-ribbon-tip">
    <i class="civ_ribbon-notch" data-bind-class-toggle="civ_ribbon-done:{{r.turn_state == 'done'}}"></i><img class="civ_ribbon-portrait" data-bind-src="{{r.icon_leader}}"><div class="civ_ribbon-who"><b data-part="civ-ribbon.name" data-bind-value="{{r.name}}"></b><span data-bind-if="{{r.turn_state == 'moving'}}" data-l10n="civ_ribbon.moving"></span><span data-bind-if="{{r.turn_state == 'done'}}" data-l10n="civ_ribbon.done"></span><span data-bind-if="{{r.turn_state == 'waiting'}}" data-l10n="civ_ribbon.waiting"></span><span data-bind-if="{{r.turn_state == 'dead'}}" data-l10n="civ_ribbon.dead"></span></div><div class="civ_ribbon-values"><b data-bind-value="{{r.score}}"></b><span data-bind-value="{{r.gold}}"></span></div><button class="civ_ribbon-war-button" data-part="civ-ribbon.war" data-bind-if="{{r.can_declare_war}}" data-on-click="intent window.open(window: 'declare_war', a: r.team, b: -1)" data-l10n="civ_ribbon.war">War?</button>
    <div class="civ_ribbon-connection" data-bind-for="s:{{turn.seats}}" data-bind-filter="{{s.player == r.player_key}}"><span data-bind-if="{{s.online}}" data-l10n="civ_ribbon.online">Connected</span><span data-bind-if="{{!s.online}}" data-l10n="civ_ribbon.offline">Disconnected</span><span data-bind-if="{{s.finished}}" data-l10n="civ_ribbon.done">Ready</span></div>
  </div><div class="civ_ribbon-minor" data-bind-for="c:{{civ_ribbon.city_states}}"><img data-bind-src="{{c.icon}}"><b data-bind-value="{{c.name}}"></b><span data-bind-value="{{c.influence}}"></span></div></div>
</aside>
