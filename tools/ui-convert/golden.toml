# Golden images of UI v2: the pixels of our own rendering against references recorded by our own rendering
# (`cargo xtask playtest --scenario ui2-golden --record`, then looked at once next to the Chrome frame of the same
# skin). Geometry is checked against Chrome elsewhere (`cargo xtask ui verify`); pixels never are, as small text is
# rasterised differently there.
#
# The references are not in the repository (as for `tools/golden`): they live in `<cache>/ui2-golden/<skin>/`, where
# `<cache>` is `CIV5_CACHE` or the `cache` folder next to the repository (`CIV5_UI2_GOLDEN_DIR` names another folder).
# Headless Chrome draws them on SwiftShader (the CPU), so the frames do not depend on the machine's GPU.
#
# The metric is LDR-FLIP over the interface only: the pixels that differ from the solid background in either frame,
# grown by `[compare] grow` pixels. Per metric (`mean`, `over02` = the share of those pixels with an error over 0.2):
#   threshold = max(factor * noise, noise + margin, floor)
# where noise is the larger of the case's `noise_<metric>` here and the noise measured by the last `--record` (it
# records each case twice, in two fresh sessions, and compares the two).

#
# Calibration (SwiftShader, 2026-11-12, G1 and G3): two recordings in two fresh sessions differ by exactly 0 on both
# backends, and WebGPU against WebGL2 differs by 0 too, so the floors decide. Faults put into G1 by hand give
# (mean / over02): the frame moved by 1 px 0.0254 / 0.0506; the notification log button gone 0.0112 / 0.0230; one
# digit of the turn number gone 0.0014 / 0.0018. `over02` catches all three; `mean` (as in tools/golden) none, so it
# guards against large breakage only.
# The full set G1-G12 (2026-11-12): every sample case recorded twice in fresh sessions differs by exactly 0 on both
# backends; the game cases with the mod (G8-G10) differ by up to 0.0009 / 0.0017, the random nick of the game in the
# helm's seats, which their declared noise covers.

[threshold.mean]
factor = 1.5
margin = 0.02
# The floor of `flip_mean` in tools/golden/thresholds.toml.
floor = 0.05

[threshold.over02]
factor = 1.5
margin = 0.001
# 0.1 % of the interface pixels (about 100 px at 1920x1200).
floor = 0.001

[compare]
# Colour distance (largest channel difference) under which a pixel counts as the background.
background_tolerance = 2
# How far the interface mask grows around what differs from the background (antialiased edges, shadows).
grow = 2

# Defaults of every case.
[defaults]
skin = "engraved"
# The solid background under the skin (`?ui2bg=`).
background = "202020"
# `sample`: the skin's sample model (`?ui2sample=<state>`, no game): the content is the same in every run. `game`: a
# live game (seed 7, turn 0, real-core server, `--attach`) with the world hidden under the solid background, for what
# only a game has (the panels of mods).
source = "sample"
# Rendering backends; one reference per case and backend.
backends = ["webgpu", "webgl2"]
scale = 1.0

# The cases. `id` is the number in the list of golden frames of the screens; `name` names the files.
# In the `game` source only the state `hud` exists (the game screen as it comes up, nothing opened). Optional:
# `hover = { part = "<data-part>", row = <n> }` puts the pointer on a part (or its n-th list instance, from 0);
# `mods = "<id>"` plays the game with that mod (its server: `UI2_MODS_ATTACH`, else `--attach`);
# `broken_mod = "<id>"` gives the page that mod's panels with a script that throws (the placeholder).
# A case may set `noise_mean` / `noise_over02` when its frames are known to vary; none is set (see the calibration).

[[case]]
id = "G1"
name = "hud-1920x1200"
state = "hud"
viewport = [1920, 1200]

[[case]]
id = "G2"
name = "production-1920x1200"
state = "production"
viewport = [1920, 1200]

[[case]]
id = "G3"
name = "hud-1280x720"
state = "hud"
viewport = [1280, 720]

[[case]]
id = "G4"
name = "hud-3440x1440"
state = "hud"
viewport = [3440, 1440]

[[case]]
id = "G5"
name = "hud-5120x1440"
state = "hud"
viewport = [5120, 1440]

[[case]]
id = "G6"
name = "production-1280x720"
state = "production"
viewport = [1280, 720]

[[case]]
id = "G7"
name = "vellum-hud-1920x1200"
skin = "vellum"
state = "hud"
viewport = [1920, 1200]

# The mod's panel in the point it asks for (`hud.right`, which engraved has) and in the slot `mods` (vellum).
[[case]]
id = "G8"
name = "hello-hud-right"
source = "game"
# A game's frames carry its random nick in the seats of the helm (measured 0.0009 / 0.0017 at most).
noise_mean = 0.001
noise_over02 = 0.002
mods = "hello"
state = "hud"
viewport = [1920, 1200]

[[case]]
id = "G9"
name = "vellum-hello-mods"
source = "game"
# A game's frames carry its random nick in the seats of the helm (measured 0.0009 / 0.0017 at most).
noise_mean = 0.001
noise_over02 = 0.002
mods = "hello"
skin = "vellum"
state = "hud"
viewport = [1920, 1200]

# A panel whose mod script fails shows its placeholder.
[[case]]
id = "G10"
name = "hello-placeholder"
source = "game"
# A game's frames carry its random nick in the seats of the helm (measured 0.0009 / 0.0017 at most).
noise_mean = 0.001
noise_over02 = 0.002
mods = "hello"
broken_mod = "hello"
state = "hud"
viewport = [1920, 1200]

# Hover: a row of the production list (the fourth option), and the policies button of the top strip with its
# tooltip (the skin gives the button no `data-tooltip` yet, so the frame shows the hover style alone).
[[case]]
id = "G11"
name = "production-row-hover"
state = "production"
viewport = [1920, 1200]
hover = { part = "production.list", row = 3 }

[[case]]
id = "G11"
name = "policies-tooltip"
state = "hud"
viewport = [1920, 1200]
hover = { part = "top.menu.policies" }

# The player's scale of 150 %: 1280 x 720 CSS px at a device scale of 1.5.
[[case]]
id = "G12"
name = "hud-1280x720-150"
state = "hud"
viewport = [1280, 720]
scale = 1.5
