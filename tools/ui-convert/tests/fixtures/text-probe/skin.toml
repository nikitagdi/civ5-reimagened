# Text cases the text spike did not cover, checked against Chromium by the `text_probe` test (tests/e2e.rs).
# The probe fonts are generated by make_fonts.py into target/ui2/text-probe-fonts/ before the fixture is built.

[skin]
id = "text-probe"
version = "0.1.0"
title = "skin.title"
model = "1.0"
api = "1.0"

[fonts]
subset = ["latin"]

[fonts.files]
"fonts/FiraSans-Regular.ttf" = "third_party/fonts/fira-sans/FiraSans-Regular.ttf"
"fonts/FiraSans-Medium.ttf" = "third_party/fonts/fira-sans/FiraSans-Medium.ttf"
"fonts/ProbeHhea.ttf" = "target/ui2/text-probe-fonts/ProbeHhea.ttf"
"fonts/ProbeTypo.ttf" = "target/ui2/text-probe-fonts/ProbeTypo.ttf"

[verify]
states = ["probe"]
