<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text probe</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/a.css">
</head>
<body>
  <div class="layer" data-layer="map"></div>
  <div class="layer" data-layer="hud">
    <div class="probe" data-slot="mods">
      <div class="row ell c1" data-part="probe.ellipsis" data-l10n="p.long"></div>
      <div class="row ell narrow c2" data-part="probe.ellipsis-narrow" data-l10n="p.long"></div>
      <div class="row hhea c3" data-part="probe.hhea" data-l10n="p.metric"></div>
      <div class="row hhea big c4" data-part="probe.hhea-48" data-l10n="p.metric"></div>
      <div class="row typo c5" data-part="probe.typo" data-l10n="p.metric"></div>
      <div class="row typo big c6" data-part="probe.typo-48" data-l10n="p.metric"></div>
      <div class="row mix c7" data-part="probe.span-weight"><span data-l10n="p.a"></span><span class="m" data-l10n="p.b"></span><span data-l10n="p.c"></span></div>
      <div class="row mix kern c8" data-part="probe.span-kern"><span data-l10n="p.k1"></span><span class="m" data-l10n="p.k2"></span></div>
      <div class="key c9" data-part="probe.flex-text" data-l10n="p.key"></div>
      <div class="key tall c10" data-part="probe.flex-text-tall" data-l10n="p.key"></div>
    </div>
  </div>
  <div class="layer" data-layer="window"></div>
  <div class="layer" data-layer="tooltip"></div>
</body>
</html>
