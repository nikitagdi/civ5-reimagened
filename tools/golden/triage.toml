note = "FLIP unchanged by the pack: the settler figure eurofemale18 now plays its idle clip (b2 pack with fixed idle clips, re-judged 2026-10-28: no figure stands in the bind pose); left: the figures of a squad have their own jitter (SIMP-023), the shared cell is ours (SIMP-044), and the figures cast their shadow on the ground since b2/r-water2 (the UnitShader family goes into the shadow map whatever the Shadows flag of its material says)."

