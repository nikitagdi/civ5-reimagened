# Triage of the golden captures. One table per capture:
#   [S1a]
#   verdict = "accept"   # accept | reject | pending
#   note = "why"
# and one table per mask over its threshold (AC-0.4):
#   [S1a.masks.land]
#   verdict = "bug"      # bug (reference: the task or defect) | simp (reference: SIMP-NNN)
#   reference = "..."
#   note = "the visible difference"
# `cargo xtask golden report --stage accept` fails while a capture has no `accept` here or a mask over its threshold
# has no verdict. Verdicts of 2026-10-27 (b2/r-triage), from the crops of `target/golden/report`; S3 re-judged
# the same day after b2/r-atmos (distance fog, sea colour).

# ---------------------------------------------------------------- S1a, S1b (start of the game, S1 save)

[S1a.masks.all]
verdict = "simp"
reference = "SIMP-062"
note = "Three quarters of the frame are fog clouds: the puffs lie on our own grid, so their lumps and the cloud edge round the revealed hexes differ (fog SSIM 0.94); the rest is the land, trees and units below."

[S1a.masks.land]
verdict = "simp"
reference = "SIMP-035"
note = "Hills and slopes have other shapes and shading (the variant of each relief piece comes from our own stream); the cloud edge over the border hexes differs (SIMP-062)."

[S1a.masks.river]
verdict = "simp"
reference = "SIMP-040"
note = "The river runs a few pixels off the capture's and bends otherwise (meander by eye); its banks lie on other relief (SIMP-035)."

