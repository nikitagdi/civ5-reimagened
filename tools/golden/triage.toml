# ---------------------------------------------------------------- S3 (late-game benchmark map)

[S3.masks.all]
verdict = "bug"
reference = "SIMP-021, SIMP-035"
note = "b2/r-water2 (all SSIM 0.307 to 0.326, FLIP 0.414 to 0.410): the hex grid now lies over the water (the ocean and the rivers read the map of the overlay), the fishing boats stand with their nets (the landmark meshes are drawn in the node state of the plot), the units cast their shadows. The distance fog, the sea and the cities come close to the capture; left: the layout of the cities by eye (SIMP-021) and the shape of the coast and the hills (SIMP-035)."

[S3.masks.land]
verdict = "bug"
reference = "SIMP-045, SIMP-047, SIMP-035"
note = "Hill and slope shapes differ (SIMP-035). b2/fb2-terrain (land FLIP 0.415 to 0.382, SSIM 0.387 to 0.353): the farm fields are the cvFarmSimSystem groups of farm_types.xml (continent crops, wheat yellow, half built, damage) in a patchwork whose fields belong to the hex of their centre, laid in the world (SIMP-045: not the road-network faces of the original); the roads are the dirt piece of roadsandrails laid as a decal along the original's in-hex spline (they were invisible), curved from edge middle to edge middle like the capture's (SIMP-047: control points at 1/4 and 3/4, which model the road handler lays is RW-17's); the landmark grounds are terrain decals; the X wrap seam is closed. Left: the field polygons, the road model choice. The haze of the far land is matched since b2/r-atmos."

[S3.masks.water]
verdict = "bug"
reference = "SIMP-021, SIMP-035"
note = "Colour and haze match since b2/r-atmos. b2/r-water2 (water SSIM 0.388 to 0.448, FLIP 0.327 to 0.299): the hex grid over the water and the boats with their nets on the 18 improved fishing plots (the ships of the units were all there: 33 of them; the missing ones were these boats); the shallows are smoothed over a quarter of a hex. Left: the coast shallows are a thinner light band than the capture's wide soft one (the shelf of the coast hexes is the terrain's), the net is opaque brown where the capture's is grey and translucent, no smoke of the volcano."

[S3.masks.river]
verdict = "simp"
reference = "SIMP-040"
note = "The rivers bend otherwise and run a few pixels off (meander by eye); the far ones are hazed like the capture's since b2/r-atmos."

[S3.masks.forest]
verdict = "simp"
reference = "SIMP-009"
note = "Trees stand elsewhere in the hex (SIMP-009: S3 is another game, none of its tree lists is in S1/S2/S4); leaf light fixed in b2/r-forest (not re-measured: S3 does not settle, anim clips pending); the far forests are hazed like the capture's since b2/r-atmos."

[S3.masks.unit]
verdict = "bug"
reference = "SIMP-023"
note = "As S1a: the settler figure eurofemale18 now plays its idle clip (b2 pack with fixed idle clips, re-judged 2026-10-28: no figure stands in the bind pose); left: the figures of a squad have their own jitter (SIMP-023), the shared cell is ours (SIMP-044), and the figures cast their shadow on the ground since b2/r-water2 (the UnitShader family goes into the shadow map whatever the Shadows flag of its material says). The far figures are hazed by the same g_FogConsts as the terrain (checked with a debug output of the unit pixel shader: fog factor 0.6-0.8 times the ramp, ramp 0 at the bottom of the frame, up to 0.9 at the top); no unit-draw change was needed."

[S3.masks.city]
verdict = "simp"
reference = "SIMP-021"
note = "b2/r-citylayout (city SSIM 0.051 to 0.095, FLIP 0.524 to 0.473; the city mask 82099 to 62887 px): the layout is the port of cvCityBuildingLayoutGen over the authored density and tensor fields (tx:df_*, tx:tf_* of b2-city), the wall is the round hull of the original with towers every 12 units, the wonders stand on the hex corners of FindWonderPlacementSlot. Follow-up: house scale 0.038 (FUN_088587b8, building size 1.0), a random quarter turn a house, the city size of GetVariableCitySizeFromPopulation (S3 pops 12-23 are sizes 6-9, not the densest field), the land band of the houses (raw height 13001..34999), and the houses lit by <culture>_cubelight.dds with hiconreflmap_soft/sharp as S3 binds them (they were lit by the unit cubes, about 3x brighter: the whiteness). Left (SIMP-021): the height class of each catalog model, the wall mesh between the towers (no gatehouse), the wonder kind and heading."

[S3.masks.landmark]
verdict = "simp"
reference = "SIMP-045"
note = "Improvements and resources stand elsewhere in their hexes (layouts by eye); the far ones are hazed like the capture's since b2/r-atmos. Since b2/fb2-terrain the LandmarkShader grounds (quarries, camps, mines, natural wonders) are terrain decals, not flat quads (landmark FLIP 0.456, SSIM 0.370)."

[S3.masks.overlay]
verdict = "simp"
reference = "SIMP-035"
note = "Borders and grid lines drape over other relief, so they bend and sit a few pixels off the capture's on hills and slopes."

