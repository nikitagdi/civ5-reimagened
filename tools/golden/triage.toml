reference = "SIMP-009"
note = "Trees stand elsewhere in the hex (SIMP-009: the lists come from the game's CRT rand stream, seeded per game and drawn by the terrain build). Leaf colour and soft edges as the capture's since b2/r-forest (the atlas was read with v flipped; trees now back to front): forest FLIP 0.387 -> 0.364, SSIM 0.396 -> 0.368 (finer detail on other places)."

[S1a.masks.unit]
