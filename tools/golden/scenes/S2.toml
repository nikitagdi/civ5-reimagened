[scene]
id = "S2"
captures = ["S2-bake", "S2"]
[setup]
sync_seed = 12345
map_seed = 12345
world_size = "WORLDSIZE_DUEL"
map_script = "Assets/Maps/Lekmap v5.2/LekmapPangaeaFractalv5.2.lua"
human = "CIVILIZATION_ROME"
ai = ["CIVILIZATION_GREECE"]
city_states = []
handicap = "HANDICAP_PRINCE"
speed = "GAMESPEED_STANDARD"
era = "ERA_ANCIENT"
# The initial autosave of the capture session of 2026-10-21 (the same world as S1a and the S1 save: equal state digest).
save = "v2/S1/autosave-initial-2026-10-21.Civ5Save"
[view]
player = 0
reveal = "game"
basis_nw = "all"
[render]
preset = "high"
size = [1920, 1080]
msaa = 4
# The scene description asks for FOW and FluidFOW off in S2, but the captures S2 and S2-bake were made with
# them on (FOW::BasePS, FOW::VisibleFluid and the clouds are in both): our frame keeps them as well.
disable = ["YieldIcons"]
# The captures show the hex grid (TerrainShader::ScreenSpaceOverlayPS over the cells).
grid = true
camera = "capture"
time_constants = ["*Time*", "*Scroll*"]
[compare]
masks = ["land", "water", "river", "forest", "unit", "city", "landmark", "fog", "overlay"]
