[package]
name = "ui2-actions"
description = "UI v2 actions: intents from skins and scripts checked and turned into orders, the local state of the UI, skin settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[package.metadata.civ5]
layer = "client"

# No `replica`, no `gamecore`: an intent never touches the game, orders leave through the `OrderSink` the host
# provides, and what the player sees comes back through the model.
[dependencies]
protocol.workspace = true
ui2-model.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
