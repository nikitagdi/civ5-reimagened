[package]
name = "render"
description = "wgpu renderer: WebGPU/WebGL2, scene, UI drawing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[package.metadata.civ5]
layer = "client"

[dependencies]
asset-format.workspace = true
jobs.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
draw-list.workspace = true
# UI v2: the retained scene the `Ui2` pass draws, and its glyph atlas.
ui2-draw.workspace = true
ui2-text.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# WGSL parser and validator for the tests of `shaders::catalog()` (the naga of wgpu, approved).
naga.workspace = true
# The picture page table the `Ui2` pass tests hand to `Scene::set_pages`.
ui2-package.workspace = true
# The ready-made scenes of the `Ui2` pass tests.
ui2-draw = { workspace = true, features = ["testkit"] }
