[package]
name = "ui2-script"
description = "UI v2 scripts: the protocol with the script workers of skins and mods, and their supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[package.metadata.civ5]
layer = "client"

# No wasm-bindgen or web-sys: workers are reached through `platform::ScriptHost` (implemented in
# `platform-web`), so the supervisor builds and is tested natively.
[dependencies]
platform.workspace = true
ui2-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
