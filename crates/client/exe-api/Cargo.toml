[package]
name = "exe-api"
description = "The globals the exe gives the Lua of the original UI (UI, Events, Network, OptionsManager, Modding, ...) and the AC-A1 coverage report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[package.metadata.civ5]
layer = "client"

# `replica` is the game (`replica::GameSide` and the UI types of `gamecore` it re-exports; R10: the client's only
# way to `gamecore`). `serde_json` stores the user data of `Modding.OpenUserData`; the coverage report (native only)
# reads the built `ui` set through `asset-format` and `assets`, which `ui` already uses.
[dependencies]
asset-format.workspace = true
assets.workspace = true
loc.workspace = true
lua-sys.workspace = true
platform.workspace = true
replica.workspace = true
serde_json.workspace = true
ui.workspace = true
tracing.workspace = true

# `gamecore`: tests only (R10 counts normal and build edges); the real-core K1 test plays the server turns itself.
[dev-dependencies]
draw-list.workspace = true
gamecore.workspace = true
