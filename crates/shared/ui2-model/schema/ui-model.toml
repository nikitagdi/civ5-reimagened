version = "1.5"

# The UI view model, schema 1.0. Source of the generated Rust types, the path table and the JS typings
# (`cargo xtask ui gen-model`). A new field, root or enum value is a minor version; removing, renaming or
# retyping anything is a major one.

[enum]
Source = ["replica", "server"]
Phase = ["starting", "ai", "humans", "game_over"]
TurnMode = ["simultaneous", "hybrid"]
Mood = ["content", "unhappy", "very_unhappy"]
TurnUi = ["next_turn", "unit_needs_orders", "city_needs_production", "research_needed", "policy_needed", "other_blocker", "waiting_others", "ai_moving", "ended", "game_over"]
# Domain and Activity follow the order of the core; `other` stands for a value this model does not know.
Domain = ["sea", "air", "land", "immobile", "hover", "other"]
Activity = ["awake", "hold", "sleep", "heal", "sentry", "intercept", "mission", "other"]
# The first twelve are the unit commands of the core; the last three are shown but have no order yet.
UnitActionKind = ["move", "range_attack", "found_city", "fortify", "sleep", "skip", "heal", "automate_build", "automate_explore", "cancel", "disband", "wake", "alert", "pillage", "upgrade"]
NoteCat = ["growth", "great_people", "diplomacy", "military", "production", "research", "policy", "religion", "other"]
# What a click on a notification does, by its type (the core's CvNotifications::Activate). `look` moves the camera to
# its plot; `none` does nothing the client can show; `leader` opens the leader window of the AI the note names (1.5).
NoteGo = [
  "look", "none", "capital", "unit", "choose_tech", "tech_award", "steal_tech", "policies", "production", "diplo_vote",
  "city_state", "deal", "free_great_person", "faith_great_person", "maya_bonus", "pantheon", "reformation",
  "found_religion", "enhance_religion", "espionage", "league", "league_project", "culture", "ideology", "archaeology",
  "great_work", "leader",
]
ChatTo = ["all", "player"]
ItemKind = ["unit", "building", "wonder", "project", "process"]
MapMode = ["select", "move", "range_attack", "target"]
# What a map targeting mode (`ui.target`, the original's interface modes that ask for a plot) acts with: a unit's order
# (a row of the core's actions), a city's ranged strike, or a gift to a city-state (a unit of the player's, an
# improvement on one of its plots).
TargetKind = ["unit", "city", "gift_unit", "gift_improvement"]
ProdTab = ["all", "units", "buildings", "wonders", "other"]
TurnPending = ["none", "ending", "cancelling"]
ToastKind = ["refused", "rejected", "lost"]
# Why an intent was refused, here or by the server. The skin picks its own text for each.
RefuseWhy = [
  "unsupported", "no_screen", "no_unit", "action_unavailable", "not_your_city", "option_unavailable",
  "cannot_buy", "bad_slot", "tech_unavailable", "cannot_end_turn", "cannot_cancel", "chat_empty",
  "chat_too_long", "chat_rate", "no_connection", "no_game", "too_many", "turn_changed", "too_big",
  "core", "turn_ended", "not_your_turn", "restarting", "invalid", "expired", "not_seated", "other",
  "not_host", "no_such_player", "not_human", "self_kick", "last_human",
]
# Windows are part of the skin and open over the map. Screens live outside it and are opened by the host.
WindowId = ["production", "research", "menu", "chat", "notes_log"]
ScreenId = ["tech_tree", "policies", "religion", "diplomacy", "overview", "notification_log", "economy", "military", "victory", "demographics", "chat"]
MouseButton = ["left", "right"]
PushAt = ["back", "front"]
BuyWith = ["gold", "faith"]
# Session operations: what the session layer (not the game) does for the seat, each with its own authority check.
SessionOp = ["save", "leave", "pause", "resume", "kick"]
SeatConn = ["online", "lost", "none"]
SeatControl = ["human", "ai", "closed"]
# What holds the end of turn: the core's EndTurnBlockingTypes in their order (the index is the core's number), then the
# reminders that do not block.
EndTurnBlock = ["policy", "research", "production", "units", "diplo_vote", "minor_quest", "free_tech", "stacked_units", "unit_needs_orders", "unit_promotion", "city_range_attack", "free_policy", "free_items", "found_pantheon", "found_religion", "enhance_religion", "steal_tech", "maya_long_count", "faith_great_person", "reformation", "league_proposals", "archaeology", "league_votes", "ideology", "deal_received"]

[type]
Plot = { x = "i16", y = "i16" }
EraRef = { id = "i16", name = "text" }
GoldenAge = { active = "bool", turns = "i16", progress = "i32", threshold = "i32" }

[type.Resource]
id = "key<item>"
name = "text"
icon = "asset"
available = "i32"
used = "i32"
total = "i32"

[type.PolicyBranch]
id = "i16"
name = "text"
unlocked = "bool"
owned = "i8"
total = "i8"

[type.Tech]
id = "key<tech>"
name = "text"
icon = "asset"
turns = "i16?"
progress = "i32"
cost = "i32"
fraction = "f32"

[type.PlayerRow]
id = "key<player>"
leader = "str"
civ = "str"
nick = "str?"
color = "color"
color2 = "color"
human = "bool"
alive = "bool"
met = "bool"
at_war = "bool"
me = "bool"

[type.Blocker]
kind = "i8"
unit = "key<unit>?"
city = "key<city>?"
plot = "Plot?"

[type.Timer]
left_s = "i32"
total_s = "i32"
stopped = "bool"

[type.Seat]
player = "key<player>"
name = "str"
me = "bool"
finished = "bool"
may_act = "bool"
online = "bool"

[type.Promo]
id = "i16"
name = "text"
icon = "asset"

[type.UnitActionRow]
kind = "UnitActionKind"
enabled = "bool"
reason = "str?"
supported = "bool"

[type.Act]
shown = "bool"
enabled = "bool"
reason = "str?"

# One `Act` per unit action, named after it: a button reads `unit.act.fortify.shown`.
[type.UnitActs]
_each = "UnitActionKind"
_type = "Act"

[type.BannerProd]
item = "key<item>"
name = "text"
icon = "asset"
turns = "i16?"
fraction = "f32"

# `color` is the owner's plate colour (a banner's or a flag's background), `color2` the colour of the icon and text
# on it: the background and icon colours of a civilization, the other way round for a city-state (as the original).
[type.CityBanner]
key = "key<city>"
owner = "key<player>"
color = "color"
color2 = "color"
name = "str"
plot = "Plot"
size = "i16"
capital = "bool"
mine = "bool"
visible = "bool"
puppet = "bool"
razing = "bool"
occupied = "bool"
resistance = "bool"
can_shoot = "bool"
strength = "i16"
hp_fraction = "f32"
growth_turns = "i16?"
production = "BannerProd?"

# `icon` is the unit's portrait, `flag` the white glyph of the original unit flag (the unit's `UnitFlagAtlas` cell),
# which the owner's colour tints; `spent`: an own unit with no moves left this turn.
[type.UnitFlag]
key = "key<unit>"
owner = "key<player>"
color = "color"
color2 = "color"
plot = "Plot"
icon = "asset"
flag = "asset"
hp_fraction = "f32"
domain = "Domain"
mine = "bool"
waiting = "bool"
spent = "bool"
at_war = "bool"
cargo = "bool"

[type.Note]
id = "key<note>"
category = "NoteCat"
message = "str"
summary = "str"
turn = "i16"
plot = "Plot?"
# 1.3: the click's action, the core's game data and extra game data of the notification, and whether the player may
# dismiss it (the core's MayUserDismiss). A `deal` note has no plot and its data1 is the other player.
go = "NoteGo"
data1 = "i32"
data2 = "i32"
dismissable = "bool"

[type.ChatRow]
seq = "key<chat>"
from = "str"
from_player = "key<player>?"
to = "ChatTo"
text = "str"
turn = "i32"
mine = "bool"

[type.ProdNow]
item = "key<item>"
name = "text"
kind = "ItemKind"
stored = "i32"
needed = "i32"
turns = "i16?"
fraction = "f32"

[type.QueueRow]
slot = "i32"
item = "key<item>"
name = "text"
kind = "ItemKind"
turns = "i16?"
first = "bool"

[type.Opt]
item = "key<item>"
order = "i32"
name = "text"
icon = "asset"
turns = "i16?"
cost = "i32"
enabled = "bool"
current = "bool"
queued = "bool"
locked_reason = "str?"
effect = "text?"
buy_gold = "i32?"
buy_gold_ok = "bool"
buy_faith = "i32?"
buy_faith_ok = "bool"
pending = "bool"

[type.OptGroup]
kind = "ItemKind"
count = "i32"
options = { list = "Opt", key = "item" }

# `idx` is the position in the list: a requirement has no identity of its own, but every list needs a key.
[type.Req]
idx = "i32"
name = "text"
met = "bool"

[type.CityTurns]
city = "key<city>"
name = "str"
turns = "i16?"
fraction = "f32"

[type.Detail]
item = "key<item>"
name = "text"
kind = "ItemKind"
turns = "i16?"
cost = "i32"
help = "text?"
maintenance = "i32?"
requires = { list = "Req", key = "idx" }
compare = { list = "CityTurns", key = "city" }
short_gold = "i32?"

[type.Selection]
unit = "key<unit>?"
city = "key<city>?"
plot = "Plot?"

# A turn badge of the movement path under the mouse: the plot where a turn of the move ends (and the target), and
# that turn (1: this turn), as the original's `PathHelpManager.lua` labels them. `cell` is the plot packed for a map
# anchor (`data-anchor="plot:{{p.cell}}"`): x times 65536 plus y.
[type.PathLabel]
cell = "i32"
plot = "Plot"
turn = "i16"

# The yield and resource icons of one plot in view, as the original's YieldIconManager and ResourceIconManager hang
# them on the plot while the map options switch them on; `cell` packs the plot as `PathLabel.cell` does.
[type.MapIcon]
cell = "i32"
food = "i16"
production = "i16"
gold = "i16"
science = "i16"
culture = "i16"
faith = "i16"
has_resource = "bool"
resource = "asset"

# The plot the mouse rests on; `cell` packs it as `PathLabel.cell` does.
[type.HoverPlot]
cell = "i32"
plot = "Plot"

# The map's targeting mode (`ui.map_mode` is `target`): what acts and with what. `a` is the row of the core's actions
# for a unit's order (-1: the unit's ranged attack) or the city-state's player id for a gift. The `targets` service
# root follows it with the plots the core accepts.
[type.UiTarget]
kind = "TargetKind"
unit = "key<unit>?"
city = "key<city>?"
a = "i32"

[type.Win]
open = "bool"

# SIMPLIFIED(SIMP-320): window and intent scalar arguments use the model's signed 32-bit
# integer type, widened to i64 on the screen protocol boundary.
[type.WinArgs]
open = "bool"
a = "i32?"
b = "i32?"
popup_id = "i32?"
popup_decision = "bool"

[type.WinCity]
open = "bool"
city = "key<city>?"

[type.Windows]
production = "WinCity"
research = "Win"
menu = "Win"
chat = "Win"
notes_log = "Win"

[type.UiProduction]
tab = { type = "ProdTab", js = true }
focus = { type = "key<item>?", js = true }
hover = { type = "key<item>?", js = true }

# The game thing the pointer rests on in a window, for its rich tooltip: `kind` as `rich_tooltips` numbers them (0 tech,
# 1 unit type, 2 building, 3 improvement, 4 policy, 5 belief, ...), `id` its row, `city` the city it is seen from. The
# `rich_tooltips` service root follows it while `id` is set; the skin sets it on pointerenter and clears it on leave.
[type.UiTip]
kind = { type = "i32", js = true }
id = { type = "i32?", js = true }
city = { type = "i32?", js = true }
slot = { type = "i32?", js = true }

[type.UiChat]
to = { type = "ChatTo", js = true }
to_player = { type = "key<player>?", js = true }

[type.Pending]
seq = "i32"
intent = "str"
target = "str"
since_ms = "u32"

# One thing that holds the end of turn (or a reminder): what to select or open for it. `window` names the skin window
# that takes the choice, with its arguments; `text` is the game's own summary of the notification behind it (none for
# a unit, or a blocker no notification of the replica names).
[type.TurnBlocker]
seq = "i32"
kind = "EndTurnBlock"
text = "str?"
unit = "key<unit>?"
city = "key<city>?"
plot = "Plot?"
window = "str?"
a = "i32?"
b = "i32?"

[type.SessionSeat]
player = "key<player>"
nick = "str?"
control = "SeatControl"
conn = "SeatConn"
host = "bool"
me = "bool"

[type.SessionSave]
id = "str"
name = "str"
turn = "i32"

[type.Toast]
seq = "i32"
kind = "ToastKind"
why = "RefuseWhy"
detail = "str?"

# One option of the client (the classic client's `civ5.options.<key>`), as the options window edits it: `value` is the
# draft (a switch is 0 or 1; a number runs from `min` to `max` in steps of `step`). `why` says why it cannot apply.
[type.UiOption]
key = "str"
tab = "str"
name = "text"
toggle = "bool"
value = "i32"
min = "i32"
max = "i32"
step = "i32"
available = "bool"
why = "text?"

# One key the skin or the game binds, by its default key (`id`, `[Ctrl+][Alt+][Shift+]<code>`): `key` is the key the
# draft gives it, `label` a short form of it; `more` other actions on the same key; a `fixed` key cannot be moved.
[type.UiHotkey]
id = "str"
key = "str"
label = "str"
group = "str"
name = "text"
more = "i32"
fixed = "bool"

# Session and source state.
[model.meta]
schema = "str"
source = "Source"
live = "bool"
catching_up = "bool"
connected = "bool"

[model.game]
turn = "i32"
year = "i32"
year_text = "text"
era = "EraRef"
me = "key<player>"
phase = "Phase"
mode = "TurnMode"
winner = "key<player>?"

# The top bar.
[model.top]
science_rate = "i32"
gold = "i32"
gold_rate = "i32"
happiness = "i32"
mood = "Mood"
golden_age = "GoldenAge"
culture = "i32"
culture_rate = "i32"
policy_cost = "i32"
policy_turns = "i16?"
faith = "i32"
faith_rate = "i32"
tourism = "i32?"
resources = { list = "Resource", key = "id" }
policies = { list = "PolicyBranch", key = "id" }

[model.research]
current = "Tech?"
next = "Tech?"
queue = { list = "Tech", key = "id" }
options = { list = "Tech", key = "id" }
known = "bool"
blocked = "bool"

# The session around the game (the gateway's seat list, the host, the saves): who sits where and whether they are
# connected, the one source for every window that shows it. Only what the gateway already sends every seat.
[model.session]
is_host = "bool"
paused = "bool"
ping_ms = "i32?"
seats = { list = "SessionSeat", key = "player" }
saves = { list = "SessionSave", key = "id" }

# The players of the game, in seat order.
[model.players]
_list = "PlayerRow"
_key = "id"

# The turn button and the readiness of the players.
[model.turn]
state = "TurnUi"
blocker = "Blocker?"
units_waiting = "i32"
finished = "bool"
can_cancel = "bool"
timer = "Timer?"
ready = "i32"
humans = "i32"
seats = { list = "Seat", key = "player" }
# Everything that holds the end of turn, in the core's order (the first is `blocker`), and the reminders that do not.
blockers = { list = "TurnBlocker", key = "seq" }
reminders = { list = "TurnBlocker", key = "seq" }

# The selected unit; absent while nothing is selected.
[model.unit]
_optional = true
key = "key<unit>"
name = "str"
type_name = "text"
portrait = "asset"
level = "i16"
xp = "i16"
strength = "i16"
ranged = "i16"
range = "i16"
moves = "f32"
max_moves = "i16"
hp = "i16"
max_hp = "i16"
hp_fraction = "f32"
domain = "Domain"
activity = "Activity"
promotions = { list = "Promo", key = "id" }
promotion_ready = "bool"
actions = { list = "UnitActionRow", key = "kind" }
act = "UnitActs"
pending = "bool"

# What the map shows: city banners and unit flags.
[model.map]
cities = { list = "CityBanner", key = "key" }
units = { list = "UnitFlag", key = "key" }

# Notifications, newest last.
[model.notes]
_list = "Note"
_key = "id"

# The most recent chat lines.
[model.chat]
_list = "ChatRow"
_key = "seq"

# The production window; absent while it is closed.
[model.production]
_optional = true
city = "key<city>"
name = "str"
capital = "bool"
size = "i16"
rate = "i32"
overflow = "i32?"
gold = "i32"
faith = "i32"
current = "ProdNow?"
queue_known = "bool"
queue = { list = "QueueRow", key = "slot" }
groups = { list = "OptGroup", key = "kind" }
detail = "Detail?"

# Local state of the interface: selection, windows, tabs, waiting orders and errors. Written by the actions
# module; the fields marked `js` can also be set from scripts and markup.
[model.ui]
selection = "Selection"
map_mode = "MapMode"
# The targeting mode while `map_mode` is `target`.
target = "UiTarget?"
windows = "Windows"
production = "UiProduction"
chat = "UiChat"
tip = "UiTip"
pending = { list = "Pending", key = "seq" }
turn_pending = "TurnPending"
errors = { list = "Toast", key = "seq" }
# The turn badges of the path of the selected unit to the plot under the mouse (written by the host).
path = { list = "PathLabel", key = "cell" }
# The plot the mouse has rested on over the map: no row or one (written by the host after the tooltip delay;
# `plot_help` follows it). A list, so that the plot tooltip can hang on the plot as a map anchor.
hover = { list = "HoverPlot", key = "cell" }
# The yield and resource icons of the revealed plots in view while the map options show them (written by the host).
map_icons = { list = "MapIcon", key = "cell" }
# The options window: the client's options and the hotkeys (drafts until `options.accept`), the binding that waits
# for a key press, and the key a binding was refused because another one has it.
options = { list = "UiOption", key = "key" }
hotkeys = { list = "UiHotkey", key = "id" }
hotkey_capture = "str?"
hotkey_clash = "str?"

# Intents: what the interface asks for, by name and with typed arguments.
[intent."unit.select"]
unit = "key<unit>"

[intent."unit.select_next"]

[intent."unit.deselect"]

[intent."unit.action"]
unit = "key<unit>"
action = "UnitActionKind"

[intent."unit.move"]
unit = "key<unit>"
plot = "Plot"

[intent."unit.range_attack"]
unit = "key<unit>"
plot = "Plot"

[intent."map.click"]
plot = "Plot"
button = "MouseButton"

# Enter the map's targeting mode (the original's interface modes): a unit's order (`unit`, `a` the row of the core's
# actions), a city's ranged strike (`city`), a gift to the city-state `a` (a unit, or an improvement on its plot). A
# left click on a plot of `targets.plots` gives the order; a right click or Escape (`map.cancel`) leaves the mode.
[intent."map.target"]
kind = "TargetKind"
unit = "key<unit>?"
city = "key<city>?"
a = "i32?"

[intent."map.cancel"]

[intent."turn.primary"]

[intent."turn.end"]
force = "bool"

[intent."turn.cancel"]

# Go to one entry of `turn.blockers` or `turn.reminders` (by `seq`): select its unit or city, or open its window.
[intent."turn.blocker"]
seq = "i32"

[intent."production.choose"]
city = "key<city>"
item = "key<item>"

[intent."production.replace"]
city = "key<city>"
item = "key<item>"

[intent."production.push"]
city = "key<city>"
item = "key<item>"
at = "PushAt"

[intent."production.pop"]
city = "key<city>"
slot = "i32"

[intent."production.move"]
city = "key<city>"
from = "i32"
to = "i32"

[intent."production.buy"]
city = "key<city>"
item = "key<item>"
with = "BuyWith"

[intent."research.choose"]
tech = "key<tech>"
queue = "bool"

[intent."note.dismiss"]
note = "key<note>"

[intent."note.activate"]
note = "key<note>"

[intent."window.open"]
window = "WindowId"
city = "key<city>?"
a = "i32?"
b = "i32?"

[intent."window.close"]
window = "WindowId"

[intent."window.toggle"]
window = "WindowId"

[intent."screen.open"]
screen = "ScreenId"

[intent."camera.to_plot"]
plot = "Plot"

[intent."camera.to_city"]
city = "key<city>"

[intent."camera.to_unit"]
unit = "key<unit>"

[intent."chat.send"]
text = "str"
to = "ChatTo"
player = "key<player>?"

[intent."screen.act"]
screen = "str"
action = "str"
a = "i32?"
b = "i32?"
c = "i32?"
d = "i32?"
text = "str?"
# A session operation to run once the server applied the action (a confirmed exit leaves after its popup is done).
then = "SessionOp?"

# A session operation: save (host), leave to the lobby (any seat), pause and resume the turn timer (host), kick a human
# seat to the AI (host; `player` names it). The session layer checks the authority; a refusal comes back as a toast.
[intent."session.op"]
op = "SessionOp"
player = "key<player>?"

# The options window (`ui.options`, `ui.hotkeys`): `edit` takes the stored values as the drafts, `set` changes one
# draft, `accept` stores and applies the drafts, `cancel` drops them, `reset` makes every draft its default.
[intent."options.edit"]

[intent."options.set"]
key = "str"
value = "i32"

[intent."options.accept"]

[intent."options.cancel"]

[intent."options.reset"]

# Wait for the next key press to bind it to the hotkey `id` (an empty `id` stops waiting); `clear` gives it back its
# default key.
[intent."hotkey.capture"]
id = "str"

[intent."hotkey.clear"]
id = "str"
