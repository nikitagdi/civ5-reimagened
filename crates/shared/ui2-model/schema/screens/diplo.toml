[type.DiploItem]
key = "str"
side = "DiploSide"
group = "DiploGroup"
kind = "DiploItemKind"
name = "text"
amount = "i32?"
duration = "i32?"

[type.DiploDeal]
id = "i32"
state = "DiploDealState"
