name = "text"
leader = "text"
civ = "text"
icon_leader = "asset"
icon_civ = "asset"
color_bg = "str"
color_fg = "str"
is_human = "bool"
score = "i32"
status = "DiploStatus"
mood = "DiploMood"
war_turns = "i32?"
denounce_turns = "i32?"
dof_turns = "i32?"
summary = "text"
trade_visible = "bool"
gold = "i32?"
gold_per_turn = "i32?"
embassy = "DiploDirection?"
borders = "DiploDirection?"
defensive_pact = "bool?"
research_agreement = "bool?"
trade_agreement_possible = "bool?"
resources = { list = "DiploResource", key = "key" }
action = "DiploAction"
action_enabled = "bool"
action_reason = "text?"
era = "text"
policies = { list = "DiploPolicy", key = "key" }
wonders = { list = "DiploWonder", key = "key" }
relations = { list = "DiploRelation", key = "key" }

[type.DiploScale]
min = "i32"
