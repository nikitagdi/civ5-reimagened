at_war = "i32"
friends = "i32"
denounced_us = "i32"
allies_cs = "i32"
cs_at_war = "i32"

[type.DiploResource]
key = "str"
name = "text"
count = "i32"
kind = "DiploResourceKind"
icon = "asset"

[type.DiploPolicy]
key = "str"
name = "text"
count = "i32"
is_ideology = "bool"

[type.DiploWonder]
key = "str"
name = "text"
icon = "asset"

[type.DiploRelation]
key = "str"
kind = "DiploRelationKind"
tone = "DiploTone"
