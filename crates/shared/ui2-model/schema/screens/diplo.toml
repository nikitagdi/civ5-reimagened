[enum]
DiploStatus = ["none", "war", "denounced_us", "liberated_us"]
DiploMood = ["human", "friendly", "neutral", "guarded", "hostile", "afraid"]
DiploDirection = ["both", "ours", "theirs", "none"]
DiploResourceKind = ["strategic", "luxury"]
DiploAction = ["trade", "talk"]
DiploRelationKind = ["war_us", "we_denounced", "war", "friend", "denounced", "betrayal", "ally_cs", "dp"]
DiploTone = ["good", "bad"]
DiploCSStatus = ["allied", "friends", "neutral", "angry", "war"]
DiploDealState = ["current", "completed"]
DiploSide = ["them", "me"]
DiploGroup = ["gold", "strategic", "luxury", "other"]
DiploItemKind = ["gold", "gold_per_turn", "resource", "open_borders", "embassy", "defensive_pact", "research_agreement", "trade_agreement", "friendship", "peace", "city", "third_party_peace", "third_party_war", "vote"]

[type.DiploPerson]
id = "i32"
name = "text"
leader = "text"
civ = "text"
icon_leader = "asset"
icon_civ = "asset"
color_bg = "str"
color_fg = "str"
score = "i32"

[type.DiploLeague]
active = "bool"
in_session = "bool"
