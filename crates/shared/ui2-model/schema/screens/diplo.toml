friends = "i32"
allies = "i32"

[type.DiploCS]
id = "i32"
name = "text"
icon = "asset"
color = "str"
at_war = "bool"
influence = "i32"
status = "DiploCSStatus"
trait = "text"
personality = "text"
ally_id = "i32?"
ally_name = "text?"
