[enum]
PoliciesTab = ["policies", "ideology"]
PoliciesBranchState = ["opened", "complete", "closed", "era_locked", "blocked"]
PoliciesPolicyState = ["adopted", "available", "locked", "blocked"]
PoliciesSlotState = ["adopted", "open", "unaffordable", "locked", "empty"]
PoliciesOpinionState = ["content", "dissidents", "civil_resistance", "revolutionary_wave"]

[type.PoliciesText]
id = "i32"
name = "str"

[type.PoliciesCulture]
stored = "i32"
per_turn = "i32"
next_cost = "i32"
