reason = "text?"
tooltip = "text"
policies = { list = "PoliciesPolicy", key = "id" }
links = { list = "PoliciesLink", key = "key" }

[type.PoliciesTenet]
id = "i32"
key = "str"
name = "str"
effect = "text"

[type.PoliciesSlot]
key = "str"
state = "PoliciesSlotState"
tenet_id = "i32?"
