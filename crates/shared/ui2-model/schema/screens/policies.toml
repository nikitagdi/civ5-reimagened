[type.PoliciesPolicy]
id = "i32"
key = "str"
name = "str"
icon = "asset"
grid_x = "i32"
grid_y = "i32"
state = "PoliciesPolicyState"
effect = "text"
requires = { list = "PoliciesText", key = "id" }
reason = "text?"

[type.PoliciesLink]
key = "str"
from_x = "i32"
from_y = "i32"
to_x = "i32"
to_y = "i32"
lit = "bool"

[type.PoliciesBranch]
id = "i32"
key = "str"
name = "str"
icon = "asset"
state = "PoliciesBranchState"
adopted = "i32"
total = "i32"
opener = "text"
finisher = "text"
finisher_done = "bool"
era = "text"
can_unlock = "bool"
unlock_cost = "i32?"
