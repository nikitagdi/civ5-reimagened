anarchy_turns = "i32"
tenets_now = "i32"
tenets_kept = "i32"
unhappiness_removed = "i32"

[type.PoliciesIdeology]
id = "i32"
key = "str"
name = "str"
title = "text"
icon = "asset"
emblem = "asset"
adopted_date = "text"
summary = "text"
