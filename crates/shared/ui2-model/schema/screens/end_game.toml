[enum]
EndGameOutcome = ["victory", "defeat", "kicked", "host_lost", "net_lost"]

EndGameVictoryType = ["science", "domination", "cultural", "diplomatic", "time", "scrap"]

[type.EndGameCiv]
key = "str"
icon = "asset"
color_bg = "color"
color_fg = "color"

[type.EndGameWinner]
player = "i32"
name = "text"
civ_name = "text"

[type.EndGamePlayers]
id = "i32"
name = "text"
civ_icon = "asset"
color_bg = "color"
color_fg = "color"
score = "i32"
me = "bool"

[type.EndGameRankingRows]
