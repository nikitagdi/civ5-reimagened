# Rates and stored yields are whole yield units; turns are nullable for indefinite orders.
[enum]
CityViewReason = ["none", "puppet", "foreign", "spy", "capture_pending", "popup_view"]
CityStatusKind = ["connected", "blockaded", "razing", "puppet", "resistance", "occupied"]
CityDemandKind = ["wltkd", "resource"]
CityGrowth = ["growing", "stagnant", "starving"]
CityYieldKind = ["food", "production", "gold", "science", "faith", "culture", "tourism", "golden_age"]
CityItemKind = ["unit", "building", "wonder", "project", "process"]
CityGroupKind = ["unit", "building", "wonder_project", "process"]
CityBuyState = ["ok", "short", "off"]
CityFocus = ["default", "food", "production", "gold", "science", "culture", "great_people", "faith", "golden_age"]
CityBuildingKind = ["specialist", "great_work", "wonder", "other"]
CityWorkKind = ["art", "writing", "music", "artifact"]
CityTileState = ["center", "worked", "locked", "unworked", "other", "blocked", "enemy", "unowned"]
CityTaskKind = ["raze", "unraze", "annex", "none"]
CityTone = ["neutral", "negative"]

