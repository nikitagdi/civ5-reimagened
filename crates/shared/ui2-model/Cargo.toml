[package]
name = "ui2-model"
description = "UI v2 view model: schema language, typed model, keyed-list deltas, change-tracking store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[package.metadata.civ5]
layer = "shared"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# `impl SchemaView for Schema`: shared to shared, no features, the package never depends back.
ui2-package.workspace = true

[dev-dependencies]
# Tests build a package to check its paths against the real schema.
ui2-package = { workspace = true, features = ["write", "profile"] }
