# UI profile 1.0: the one machine-readable description of what a skin may use.
#
# Read by `Profile::v1()` (include_str!), by the converter and by the preview. Chrome bakes the
# cascade, so only longhand properties appear; a property outside this file with a non-initial
# computed value is an error (E2).
#
# prop.<name> fields:
#   kind       how the value is parsed (see ValueKind in src/profile/props.rs)
#   values     keywords of a `keyword` / `keyword-set` property (of each item of a `keywords`
#              list, of each axis of an `image-repeat`); for the other kinds the extra
#              keywords allowed beside the value (`auto`, `none`, `normal`). For a `keyword-set`
#              the first entry stands alone, the others combine.
#   inherited  inherited by children (informational: Chrome already resolved it)
#   anim       can be the target of a transition
#   bind       can be set by data-bind-style-<name>
#   token      a color (shadow color, gradient stop color) that may refer to a root color token
#   calc       calc() is allowed
#   pct        a percentage is allowed in a length (default true)
#   min, max   inclusive range of a number, integer, length (px) or time (ms)
#   max_items  longest list
#   initial    the initial value as Chrome serializes it; it must parse

version = "1.0"

# Elements (HTML). `group` is the profile's own grouping; `types` and `require` restrict a few.
element.html = { group = "document" }
element.head = { group = "document" }
element.body = { group = "document" }
element.meta = { group = "document" }
element.title = { group = "document" }
element.style = { group = "document" }
element.template = { group = "document" }
element.link = { group = "document" }
element.script = { group = "document" }
element.div = { group = "block" }
element.section = { group = "block" }
element.header = { group = "block" }
element.footer = { group = "block" }
element.aside = { group = "block" }
element.nav = { group = "block" }
element.main = { group = "block" }
element.article = { group = "block" }
element.p = { group = "block" }
element.h1 = { group = "block" }
element.h2 = { group = "block" }
element.h3 = { group = "block" }
element.h4 = { group = "block" }
element.h5 = { group = "block" }
element.h6 = { group = "block" }
element.ul = { group = "block", require = { list-style = "none" } }
element.ol = { group = "block", require = { list-style = "none" } }
element.li = { group = "block", require = { list-style = "none" } }
element.label = { group = "block" }
element.hr = { group = "block" }
element.span = { group = "text" }
element.b = { group = "text" }
element.strong = { group = "text" }
element.i = { group = "text" }
element.em = { group = "text" }
element.small = { group = "text" }
element.button = { group = "control", require = { appearance = "none" } }
element.input = { group = "control", types = ["text"], require = { appearance = "none" } }
element.img = { group = "image" }
element.svg = { group = "image" }
element.use = { group = "image" }
element.symbol = { group = "image" }
element.defs = { group = "image" }

# Layout
prop.display = { kind = "keyword", values = ["none", "block", "flex", "grid", "inline"], initial = "inline" }
prop.position = { kind = "keyword", values = ["static", "relative", "absolute"], initial = "static" }
prop.z-index = { kind = "integer", values = ["auto"], min = -9999, max = 9999, initial = "auto" }
prop.box-sizing = { kind = "keyword", values = ["border-box", "content-box"], initial = "content-box" }
prop.top = { kind = "length", values = ["auto"], bind = true, initial = "auto" }
prop.right = { kind = "length", values = ["auto"], bind = true, initial = "auto" }
prop.bottom = { kind = "length", values = ["auto"], bind = true, initial = "auto" }
prop.left = { kind = "length", values = ["auto"], bind = true, initial = "auto" }
prop.width = { kind = "length", values = ["auto"], min = 0, bind = true, initial = "auto" }
prop.height = { kind = "length", values = ["auto"], min = 0, bind = true, initial = "auto" }
prop.min-width = { kind = "length", values = ["auto"], min = 0, initial = "auto" }
prop.min-height = { kind = "length", values = ["auto"], min = 0, initial = "auto" }
prop.max-width = { kind = "length", values = ["none"], min = 0, initial = "none" }
prop.max-height = { kind = "length", values = ["none"], min = 0, initial = "none" }
prop.margin-top = { kind = "length", values = ["auto"], initial = "0px" }
prop.margin-right = { kind = "length", values = ["auto"], initial = "0px" }
prop.margin-bottom = { kind = "length", values = ["auto"], initial = "0px" }
prop.margin-left = { kind = "length", values = ["auto"], initial = "0px" }
prop.padding-top = { kind = "length", min = 0, initial = "0px" }
prop.padding-right = { kind = "length", min = 0, initial = "0px" }
prop.padding-bottom = { kind = "length", min = 0, initial = "0px" }
prop.padding-left = { kind = "length", min = 0, initial = "0px" }
prop.overflow-x = { kind = "keyword", values = ["visible", "hidden", "clip", "auto", "scroll"], initial = "visible" }
prop.overflow-y = { kind = "keyword", values = ["visible", "hidden", "clip", "auto", "scroll"], initial = "visible" }
prop.flex-direction = { kind = "keyword", values = ["row", "row-reverse", "column", "column-reverse"], initial = "row" }
prop.flex-wrap = { kind = "keyword", values = ["nowrap", "wrap"], initial = "nowrap" }
prop.flex-grow = { kind = "number", min = 0, bind = true, initial = "0" }
prop.flex-shrink = { kind = "number", min = 0, initial = "1" }
prop.flex-basis = { kind = "length", values = ["auto"], min = 0, initial = "auto" }
prop.order = { kind = "integer", initial = "0" }
prop.justify-content = { kind = "keyword", values = ["normal", "flex-start", "flex-end", "start", "end", "center", "space-between", "space-around", "space-evenly"], initial = "normal" }
prop.align-items = { kind = "keyword", values = ["normal", "stretch", "flex-start", "flex-end", "start", "end", "center", "baseline"], initial = "normal" }
prop.align-self = { kind = "keyword", values = ["auto", "normal", "stretch", "flex-start", "flex-end", "start", "end", "center", "baseline"], initial = "auto" }
prop.align-content = { kind = "keyword", values = ["normal", "flex-start", "flex-end", "start", "end", "center", "space-between", "space-around", "space-evenly"], initial = "normal" }
prop.row-gap = { kind = "length", values = ["normal"], min = 0, initial = "normal" }
prop.column-gap = { kind = "length", values = ["normal"], min = 0, initial = "normal" }

# Decoration
prop.color = { kind = "color", inherited = true, anim = true, bind = true, token = true, initial = "rgb(0, 0, 0)" }
prop.background-color = { kind = "color", anim = true, bind = true, token = true, initial = "rgba(0, 0, 0, 0)" }
prop.opacity = { kind = "number", min = 0, max = 1, anim = true, bind = true, initial = "1" }
prop.visibility = { kind = "keyword", values = ["visible", "hidden"], inherited = true, anim = true, initial = "visible" }
prop.border-top-width = { kind = "length", pct = false, min = 0, initial = "0px" }
prop.border-right-width = { kind = "length", pct = false, min = 0, initial = "0px" }
prop.border-bottom-width = { kind = "length", pct = false, min = 0, initial = "0px" }
prop.border-left-width = { kind = "length", pct = false, min = 0, initial = "0px" }
prop.border-top-style = { kind = "keyword", values = ["none", "solid"], initial = "none" }
prop.border-right-style = { kind = "keyword", values = ["none", "solid"], initial = "none" }
prop.border-bottom-style = { kind = "keyword", values = ["none", "solid"], initial = "none" }
prop.border-left-style = { kind = "keyword", values = ["none", "solid"], initial = "none" }
prop.border-top-color = { kind = "color", anim = true, token = true, initial = "rgb(0, 0, 0)" }
prop.border-right-color = { kind = "color", anim = true, token = true, initial = "rgb(0, 0, 0)" }
prop.border-bottom-color = { kind = "color", anim = true, token = true, initial = "rgb(0, 0, 0)" }
prop.border-left-color = { kind = "color", anim = true, token = true, initial = "rgb(0, 0, 0)" }
prop.border-top-left-radius = { kind = "radius", min = 0, initial = "0px" }
prop.border-top-right-radius = { kind = "radius", min = 0, initial = "0px" }
prop.border-bottom-right-radius = { kind = "radius", min = 0, initial = "0px" }
prop.border-bottom-left-radius = { kind = "radius", min = 0, initial = "0px" }
prop.box-shadow = { kind = "shadows", anim = true, token = true, max_items = 4, initial = "none" }
prop.text-shadow = { kind = "shadows", inherited = true, token = true, max_items = 1, initial = "none" }
prop.transform = { kind = "transform", anim = true, bind = true, calc = true, initial = "none" }
prop.transform-origin = { kind = "origin", calc = true, initial = "50% 50%" }
prop.cursor = { kind = "keyword", values = ["auto", "default", "pointer", "text", "move", "grab", "grabbing", "not-allowed"], inherited = true, initial = "auto" }
prop.pointer-events = { kind = "keyword", values = ["auto", "none"], inherited = true, initial = "auto" }

# Transitions: duration and delay in ms after parsing
prop.transition-property = { kind = "properties", initial = "all" }
prop.transition-duration = { kind = "times", min = 0, max = 1000, initial = "0s" }
prop.transition-delay = { kind = "times", min = 0, max = 1000, initial = "0s" }
prop.transition-timing-function = { kind = "easings", initial = "ease" }

# Text
prop.font-family = { kind = "families", inherited = true, initial = "serif" }
prop.font-size = { kind = "length", pct = false, min = 0, inherited = true, initial = "16px" }
prop.font-weight = { kind = "integer", min = 100, max = 900, inherited = true, initial = "400" }
prop.font-style = { kind = "keyword", values = ["normal", "italic"], inherited = true, initial = "normal" }
prop.font-variant-numeric = { kind = "keyword-set", values = ["normal", "tabular-nums", "proportional-nums", "lining-nums", "oldstyle-nums"], inherited = true, initial = "normal" }
prop.line-height = { kind = "line-height", inherited = true, min = 0, initial = "normal" }
prop.letter-spacing = { kind = "length", values = ["normal"], pct = false, inherited = true, initial = "normal" }
prop.word-spacing = { kind = "length", values = ["normal"], pct = false, inherited = true, initial = "normal" }
prop.text-align = { kind = "keyword", values = ["start", "end", "left", "right", "center"], inherited = true, initial = "start" }
prop.white-space-collapse = { kind = "keyword", values = ["collapse", "preserve"], inherited = true, initial = "collapse" }
prop.text-wrap-mode = { kind = "keyword", values = ["wrap", "nowrap"], inherited = true, initial = "wrap" }
prop.text-overflow = { kind = "keyword", values = ["clip", "ellipsis"], initial = "clip" }
prop.overflow-wrap = { kind = "keyword", values = ["normal", "break-word", "anywhere"], inherited = true, initial = "normal" }
prop.word-break = { kind = "keyword", values = ["normal", "break-word"], inherited = true, initial = "normal" }
prop.text-transform = { kind = "keyword", values = ["none"], inherited = true, initial = "none" }
prop.text-decoration-line = { kind = "keyword-set", values = ["none", "underline"], initial = "none" }

# Icons (svg elements only)
prop.fill = { kind = "color", values = ["none"], inherited = true, anim = true, token = true, initial = "rgb(0, 0, 0)" }
prop.stroke = { kind = "color", values = ["none"], inherited = true, anim = true, token = true, initial = "none" }
prop.stroke-width = { kind = "length", pct = false, min = 0, inherited = true, initial = "1px" }
prop.stroke-linecap = { kind = "keyword", values = ["butt", "round", "square"], inherited = true, initial = "butt" }
prop.stroke-linejoin = { kind = "keyword", values = ["miter", "round", "bevel"], inherited = true, initial = "miter" }

# Background layers and outline (decoration). The background lists hold one entry per layer; Chrome
# repeats the shorter lists to the number of images. Gradients take at most 4 stops each.
prop.background-image = { kind = "images", token = true, calc = true, max_items = 4, initial = "none" }
prop.background-size = { kind = "bg-sizes", bind = true, calc = true, min = 0, max_items = 4, initial = "auto" }
prop.background-position-x = { kind = "lengths", calc = true, max_items = 4, initial = "0%" }
prop.background-position-y = { kind = "lengths", calc = true, max_items = 4, initial = "0%" }
prop.background-repeat = { kind = "repeats", max_items = 4, initial = "repeat" }
prop.background-origin = { kind = "keywords", values = ["border-box", "padding-box", "content-box"], max_items = 4, initial = "padding-box" }
prop.background-clip = { kind = "keywords", values = ["border-box", "padding-box", "content-box"], max_items = 4, initial = "border-box" }
prop.outline-style = { kind = "keyword", values = ["none", "solid"], initial = "none" }
prop.outline-width = { kind = "length", pct = false, min = 0, initial = "3px" }
prop.outline-color = { kind = "color", anim = true, token = true, initial = "rgb(0, 0, 0)" }
prop.outline-offset = { kind = "length", pct = false, initial = "0px" }

# Layout, second part: grid, item alignment on the inline axis, aspect ratio, scrollbars. Track
# lists take px, %, fr, auto, min-content, max-content, minmax() and repeat(N, ...); no calc().
prop.justify-items = { kind = "keyword", values = ["normal", "stretch", "flex-start", "flex-end", "start", "end", "center", "baseline"], initial = "normal" }
prop.justify-self = { kind = "keyword", values = ["auto", "normal", "stretch", "flex-start", "flex-end", "start", "end", "center", "baseline"], initial = "auto" }
prop.aspect-ratio = { kind = "ratio", initial = "auto" }
prop.scrollbar-width = { kind = "keyword", values = ["auto", "none"], initial = "auto" }
prop.grid-template-columns = { kind = "tracks", min = 0, initial = "none" }
prop.grid-template-rows = { kind = "tracks", min = 0, initial = "none" }
prop.grid-auto-columns = { kind = "track-sizes", min = 0, initial = "auto" }
prop.grid-auto-rows = { kind = "track-sizes", min = 0, initial = "auto" }
prop.grid-auto-flow = { kind = "keyword", values = ["row", "column", "dense", "column dense"], initial = "row" }
prop.grid-row-start = { kind = "grid-line", initial = "auto" }
prop.grid-row-end = { kind = "grid-line", initial = "auto" }
prop.grid-column-start = { kind = "grid-line", initial = "auto" }
prop.grid-column-end = { kind = "grid-line", initial = "auto" }

# 9-slice frames (border-image) and clipping. The outset is always 0; a clip polygon is convex
# with at most 8 points (the clip shader's limit).
prop.border-image-source = { kind = "url", values = ["none"], initial = "none" }
prop.border-image-slice = { kind = "slice", initial = "100%" }
prop.border-image-width = { kind = "image-widths", initial = "1" }
prop.border-image-repeat = { kind = "image-repeat", values = ["stretch", "repeat", "round"], initial = "stretch" }
prop.border-image-outset = { kind = "length", pct = false, min = 0, max = 0, initial = "0" }
prop.clip-path = { kind = "polygon", calc = true, max_items = 8, initial = "none" }

# Text, second part: the single values the profile allows.
prop.text-indent = { kind = "length", pct = false, min = 0, max = 0, inherited = true, initial = "0px" }
prop.text-wrap-style = { kind = "keyword", values = ["auto"], inherited = true, initial = "auto" }
prop.vertical-align = { kind = "keyword", values = ["baseline"], initial = "baseline" }
prop.direction = { kind = "keyword", values = ["ltr"], inherited = true, initial = "ltr" }
prop.writing-mode = { kind = "keyword", values = ["horizontal-tb"], inherited = true, initial = "horizontal-tb" }

# Ignored: documented, without effect.
ignored."-webkit-font-smoothing" = { why = "the platform decides smoothing; it does not change layout" }
ignored."text-rendering" = { why = "the text stack always uses its own shaping and rasterizer" }
ignored."user-select" = { why = "the runtime has no text selection" }
ignored."will-change" = { why = "a hint for the browser compositor" }
ignored."-webkit-tap-highlight-color" = { why = "no tap highlight in the runtime" }
ignored."font-kerning" = { why = "kerning is always on" }
ignored."font-optical-sizing" = { why = "variable fonts are not part of the profile" }
ignored."caret-color" = { why = "the runtime draws its own caret" }

selector = { pseudo_class = ["hover", "active", "focus", "focus-visible", "disabled"], combinators = [" ", ">"] }

# Extension points every skin must have.
slot.mods = { required = true }

# Synonyms every skin defines for mods.
token."--ui-surface" = { required = true }
token."--ui-surface-2" = { required = true }
token."--ui-line" = { required = true }
token."--ui-text" = { required = true }
token."--ui-text-2" = { required = true }
token."--ui-text-3" = { required = true }
token."--ui-accent" = { required = true }
token."--ui-accent-ink" = { required = true }
token."--ui-negative" = { required = true }
token."--ui-y-food" = { required = true }
token."--ui-y-prod" = { required = true }
token."--ui-y-gold" = { required = true }
token."--ui-y-sci" = { required = true }
token."--ui-y-cult" = { required = true }
token."--ui-y-faith" = { required = true }
token."--ui-y-happy" = { required = true }
token."--ui-y-tour" = { required = true }

# Error codes (value parsers). The converter prints `what` and `hint`; categories: E1 HTML and
# attributes, E2 properties and values, E3 selectors and variants, E4 bindings and expressions,
# E5 fonts and images, E6 localization, E7 slots, keys, anchors, tokens, E8 budgets, E9 environment.
error.E2-002 = { what = "value outside the profile", hint = "use one of the values the profile table lists for this property" }
error.E2-003 = { what = "unit other than px", hint = "viewport and container units would be baked into px at one size; use % or px, or a breakpoint" }
error.E2-004 = { what = "number is not finite", hint = "NaN and infinity cannot be stored; check the calc() expression and its variables" }
error.E2-005 = { what = "value out of range", hint = "keep the number inside the range the profile table gives" }
error.E2-006 = { what = "color form outside the profile", hint = "write the color as #hex, rgb(), rgba(), a color name or transparent; currentcolor and color functions are resolved by Chrome first" }
error.E2-007 = { what = "calc() outside decoration properties", hint = "layout cannot use calc(); use flex, grid or a percentage" }
error.E2-008 = { what = "list too long", hint = "shorten the list to the number the profile table allows" }
error.E2-020 = { what = "grid feature outside the profile", hint = "write tracks as px, %, fr, auto, min-content, max-content, minmax() or repeat(<count>, ...); place items by line numbers or span <count>; grid lines and areas have no names" }
error.E2-021 = { what = "clip shape outside the profile", hint = "use clip-path: none or a polygon() of three to eight points" }
error.E2-022 = { what = "clip polygon is not convex", hint = "the clip is drawn as one convex polygon; list the points in order around the shape, or split the shape into nested elements" }
error.E2-023 = { what = "picture reference outside the profile", hint = "refer to a png, webp or svg file inside the skin (a border image is png or webp), without a query or a data: URL" }

# Numbering: one counter per family, in the order the codes were defined. Ranges that other
# parts of the pipeline own are reserved here so new codes do not collide:
#   E2-001..E2-009 and E2-020..E2-039 value parsers, E2-010..E2-019 and E2-040.. converter
#   E1-001..E1-019 document and element rules (converter), E1-020.. attribute names
#   E4-001..E4-019 expressions and templates, E4-020.. attribute values and actions
#   E6-001..E6-009 skin texts (converter), E6-010.. l10n attribute grammar
#   E7-001..E7-009 required slots, tokens, layers (converter), E7-010.. attribute grammar
error.E4-001 = { what = "syntax error in an expression", hint = "check the expression against the grammar: literals, paths, operators, calls, ?: and parentheses; comparisons cannot be chained" }
error.E4-002 = { what = "unknown function", hint = "the functions are fmt.int fmt.signed fmt.fixed fmt.pct fmt.mmss loc len min max clamp round floor ceil abs" }
error.E4-003 = { what = "wrong number of arguments", hint = "see the argument counts of the function in the profile reference" }
error.E4-004 = { what = "unknown path", hint = "a path starts at a model root, a loop variable or state; check the name against the model schema" }
error.E4-005 = { what = "arithmetic over something that is not a number", hint = "only int and float values can be added, multiplied or passed to numeric functions; write text with a {{ }} insert" }
error.E4-006 = { what = "values of different types cannot be compared", hint = "compare numbers with numbers, strings with strings or enum values, keys of one kind; null can be compared with anything" }
error.E4-007 = { what = "string is not a value of the enum", hint = "use one of the values the schema lists for this enum" }
error.E4-008 = { what = "a bool, a list or a record cannot be written into text", hint = "use a condition (data-bind-if, class-toggle) or write a field of the record" }
error.E4-009 = { what = "data-bind-for needs a list", hint = "loop over a path whose type is a list" }
error.E4-010 = { what = "the loop variable name is taken", hint = "use a name that is not a model root, a keyword (state, mods, true, false, null) or an enclosing variable" }
error.E4-011 = { what = "argument of the wrong type", hint = "see the argument types of the function in the profile reference" }
error.E4-012 = { what = "a list has no fields", hint = "loop over the list with data-bind-for and read the field of the item" }
error.E4-013 = { what = "an insert is not closed", hint = "every {{ needs a }}; a string inside the insert may contain }} only between its quotes" }

# Attributes (E1-020.. names, E4-020.. values and actions, E5-010, E6-010, E7-010.. grammar)
error.E1-020 = { what = "title attribute", hint = "use data-tooltip with the id of a tooltip template" }
error.E1-021 = { what = "inline event attribute", hint = "use data-on-<event>=\"intent ...\" or \"call ...\"" }
error.E1-022 = { what = "data attribute outside the profile", hint = "check the spelling against the list of data-* attributes in the profile reference" }
error.E1-023 = { what = "srcset attribute", hint = "put the 2x picture next to the 1x file as <name>@2x.<ext>" }
error.E1-024 = { what = "attribute outside the profile", hint = "remove it, or use the profile's own attribute for the same purpose" }
error.E1-025 = { what = "attribute not allowed on this element", hint = "see which elements take the attribute in the profile reference" }
error.E1-026 = { what = "attribute written twice", hint = "keep one of them" }
error.E1-027 = { what = "include path outside the skin", hint = "write a relative path with / separators that does not leave the skin folder" }
error.E1-028 = { what = "attribute value outside the profile", hint = "use one of the values the profile allows for this element" }
error.E4-020 = { what = "the value must be exactly one {{ }} insert", hint = "write the whole attribute as {{ expression }}" }
error.E4-021 = { what = "malformed data-bind-for", hint = "write [index,] item:{{ list }}, for example c:{{ top.cities }}" }
error.E4-022 = { what = "the list has no key", hint = "add data-bind-key=\"{{ item.field }}\" with a unique value per item" }
error.E4-023 = { what = "attribute without the attribute it belongs to", hint = "add the missing attribute on the same element, or remove this one" }
error.E4-024 = { what = "malformed data-bind-class-toggle", hint = "write class:{{ condition }}, separated by ; for several classes" }
error.E4-025 = { what = "property cannot be bound", hint = "only properties marked bind in the profile table can be set by data-bind-style-<property>" }
error.E4-026 = { what = "malformed action", hint = "an action is intent name(args), set state.x = expr, toggle state.x, call name(args) or stop; separate several with ;" }
error.E4-027 = { what = "unknown intent", hint = "intents come from the catalogue of the model schema" }
error.E4-028 = { what = "wrong intent arguments", hint = "pass every argument of the intent, all by name or all by position" }
error.E4-029 = { what = "value of the wrong type", hint = "the value must have the type the target declares" }
error.E4-030 = { what = "path is read-only for markup", hint = "markup writes only state.* and ui.* fields the schema marks writable" }
error.E4-031 = { what = "intent of another mod", hint = "a mod fragment sends intents of the catalogue and mods.<its own id>.<name>" }
error.E4-032 = { what = "malformed data-bind-model", hint = "write the path of a skin state value, for example state.volume" }
error.E4-033 = { what = "malformed data-control", hint = "a control is checkbox, toggle, radio, slider or select with data-bind-model and the attributes of its kind" }
error.E4-034 = { what = "data-event next to data-on-click", hint = "put the call into data-on-click instead" }
error.E4-035 = { what = "binding inside a script island", hint = "an island is driven by script commands; move the binding outside the island" }
error.E4-036 = { what = "conflicting sources of text", hint = "an element has one source of text (data-bind-value or data-l10n) and then no child elements" }
error.E4-037 = { what = "data-bind-if and data-bind-for on one node", hint = "put the condition on a parent element or use data-bind-filter" }
error.E5-010 = { what = "malformed game asset reference", hint = "write <namespace>:<id>, for example render:minimap" }
error.E6-010 = { what = "malformed text key", hint = "write lower case words separated by dots, for example top.turn" }
error.E7-010 = { what = "malformed slot or part name", hint = "use lower case words, digits and - separated by dots, for example top.right" }
error.E7-011 = { what = "malformed layer or screen", hint = "layers are map, hud, window and tooltip; a screen is a child of the window layer" }
error.E7-012 = { what = "malformed or misplaced anchor", hint = "write city:{{ id }}, unit:{{ id }} or plot:{{ id }} on the node with data-bind-for in the map layer" }
error.E7-013 = { what = "malformed hotkey", hint = "write [Ctrl+][Alt+][Shift+]<KeyboardEvent.code>, for example Ctrl+KeyB or F5" }
error.E7-014 = { what = "hotkey inside a loop", hint = "a hotkey needs a node that exists once; move it out of the data-bind-for body" }
error.E7-015 = { what = "slot on a node with if or for", hint = "put data-slot on a plain parent element" }
error.E7-016 = { what = "malformed tooltip reference", hint = "data-tooltip is the id of a <template data-layer=\"tooltip\">" }
error.E7-017 = { what = "malformed data-fit", hint = "write data-fit=\"shrink\" and optionally data-fit-min=\"12px\"" }
error.E7-018 = { what = "malformed script island", hint = "an island has an id; keys and classes are plain words" }

# The converter's own rules (tools/ui-convert): E1-001.., E2-010..E2-019 and E2-040.., E3 (all
# but the selector and media codes of the profile's select module), E4-040.., E5-001..,
# E6-001.., E7-001.., E9 (all).
error.E1-001 = { what = "skin.toml is malformed", hint = "check the file against the skin.toml reference: [skin] id, version, title, entry, model, api; [fonts], [state], [themes], [scripts], [verify]" }
error.E1-002 = { what = "element outside the profile", hint = "use the elements of the profile reference; links, tables, forms and media elements have no place in a skin" }
error.E1-003 = { what = "resource outside the skin", hint = "refer to files inside the skin folder with a relative path; nothing is loaded from the network" }
error.E1-004 = { what = "inline or module script", hint = "put the code into a classic script file listed in skin.toml [scripts] files" }
error.E1-005 = { what = "id used twice", hint = "an id names one element; use a class for several" }
error.E1-006 = { what = "the element lacks a computed value the profile requires", hint = "set the value the profile lists for this element (appearance: none for controls, list-style: none for lists)" }
error.E1-007 = { what = "import or export in a skin script", hint = "skin scripts are classic scripts in the order of skin.toml [scripts] files; share code through globals of the script context" }
error.E1-008 = { what = "browser API in a skin script", hint = "a skin script talks to the game only through the ui object; it has no document, window, network or storage" }
error.E1-009 = { what = "included file not found", hint = "data-include names a file of the skin folder, relative to the skin root" }
error.E2-010 = { what = "property outside the profile", hint = "remove the declaration or use a property of the profile reference; layout is block, flex, grid and absolute" }
error.E2-011 = { what = "computed value cannot be stored", hint = "Chrome computed a value of another kind than the property's field holds; simplify the declaration" }
error.E2-012 = { what = "icon paint on an element that is not an icon", hint = "fill and stroke style only svg icons" }
error.E2-013 = { what = "page background is not transparent", hint = "the world is drawn under the UI; give html and body no background (the preview backdrop is not part of the skin)" }
error.E3-001 = { what = "at-rule outside the profile", hint = "a skin may use @media (width and height) and @font-face only" }
error.E3-002 = { what = "selector outside the profile", hint = "use tags, classes, ids, :root, the combinators space and >, and :hover :active :focus :focus-visible :disabled; give the element a class instead of a structural or sibling selector" }
error.E3-003 = { what = "a toggled class is also written in the static class attribute", hint = "a class that data-bind-class-toggle switches must not be in class=\"...\" of the same element" }
error.E3-004 = { what = "media query outside the profile", hint = "write @media with width and height in px: min-, max- or ranges joined by and, type all or screen" }
error.E3-005 = { what = "more than four conditions on one node", hint = "a node can depend on at most four dynamic conditions (hover, focus, toggled classes of it and its ancestors); move a condition to a child or merge classes" }
error.E3-006 = { what = "too many breakpoints", hint = "a skin has at most 8 media conditions and at most 16 viewport cells" }
error.E3-007 = { what = "transitions differ between the variants of a node", hint = "declare transition on the base rule only; a state may change values, not transitions" }
error.E3-008 = { what = "display: contents changes with a condition or a breakpoint", hint = "an element is either a box or not in every state; restructure the markup" }
error.E3-009 = { what = "order changes with a condition or a breakpoint", hint = "the order of children is fixed when the skin is built; keep order the same in every state and cell" }
error.E3-010 = { what = "CSS syntax error", hint = "fix the stylesheet so Chrome and the converter read the same rules" }
error.E4-040 = { what = "sample does not fit the model schema", hint = "write the sample as the schema describes the roots; a field the schema does not have is an error" }
error.E4-041 = { what = "sample state value is not in the skin state", hint = "declare the value in skin.toml [state] or remove it from the sample" }
error.E4-042 = { what = "skin state value of an unsupported type", hint = "a state value is a bool, an integer, a float or a string" }
error.E5-001 = { what = "SVG content outside the profile", hint = "an inline svg is a static picture: no text, script or foreignObject; write text as HTML" }
error.E5-002 = { what = "icon reference outside the sprite", hint = "an icon is <use href=\"#id\"> of a symbol in the skin's sprite" }
error.E5-003 = { what = "font face without a skin font file", hint = "point src: url() at a path listed in skin.toml [fonts.files], which maps it to a file under third_party/fonts" }
error.E5-004 = { what = "font face not loaded", hint = "Chromium could not load the subset of the face; check the file and that the face is a TTF or OTF" }
error.E5-005 = { what = "picture cannot be rasterized", hint = "pictures are png, webp or svg files inside the skin with a size from CSS" }
error.E8-001 = { what = "package budget exceeded", hint = "the package holds at most 3 MB: fonts 1.2 MB, pictures 0.8 MB, scripts 750 KB, the rest 0.5 MB; use fewer or smaller pictures, fewer faces or a smaller subset" }
error.E6-001 = { what = "untranslated text", hint = "put the text into the skin's l10n tables and show it with data-l10n, or bind it with data-bind-value" }
error.E6-002 = { what = "text key not found", hint = "add the key to l10n/<lang>.toml of every language of the skin" }
error.E6-003 = { what = "malformed text table or template", hint = "an l10n file is TOML with \"key\" = \"template\"; a template uses {1}, {1_Num}, {1: plural ...} like the game's texts" }
error.E6-004 = { what = "the template uses more arguments than the node passes", hint = "pass every {n} of the template in data-l10n-args" }
error.E7-001 = { what = "the body does not hold the four layer roots", hint = "the children of body are the layer roots data-layer=map, hud, window and tooltip, in this order" }
error.E7-002 = { what = "required extension point missing", hint = "add data-slot with this name on a flex or grid element of the skin" }
error.E7-003 = { what = "required color token synonym missing", hint = "define the synonym on :root as var(--<root token>)" }
error.E7-004 = { what = "the same hotkey twice in one layer", hint = "give each node of a layer its own key" }
error.E7-005 = { what = "the same part name twice", hint = "a part name names one element of the skin" }
error.E7-006 = { what = "tooltip template not found", hint = "data-tooltip is the id of a <template data-layer=\"tooltip\"> of the skin" }
error.E7-007 = { what = "layer root is not a full-size box without pointer events", hint = "a layer root is position:absolute; inset:0; pointer-events:none, and its panels switch pointer events on" }
error.E9-001 = { what = "request outside the local server", hint = "a skin loads nothing from the network or from other servers; refer to files inside the skin folder" }
error.E9-002 = { what = "Node or Chromium failed", hint = "run npm ci in tools/playtest and tools/ui-convert/node; check that node is on PATH" }
error.E9-003 = { what = "bad request on the converter protocol", hint = "a converter bug: the Node side refused a request" }
error.E9-004 = { what = "skin folder or entry file not found", hint = "pass the skin id (skins/<id>) or a folder with skin.toml and the entry file" }
error.E9-005 = { what = "preview script missing", hint = "includes and bindings are expanded by node/preview/preview.js; without it the page shows only the entry file" }
error.E9-006 = { what = "font subsetter missing", hint = "install it: python -m pip install --user -r tools/ui-convert/fonts/requirements.txt (or point CIV5_PYTHON at a Python that has it)" }
error.E9-007 = { what = "package not written", hint = "a converter bug or a file system problem: the package builder refused the data or the output folder is not writable" }
